<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acessos — Central de Operação</title>
<link rel="icon" type="image/png" href="/icone.png">
<style>
  :root {
    --painel: #c5c9c3; --tela: #e8eae5; --grafite: #23282a; --tinta: #1a1f1c; --apagado: #5b625c;
    --linha: #b3b8b1; --critico: #c1121f; --atencao: #b37700; --ok: #1c7a4f; --info: #1f5c99;
    --titulo: "Archivo", "Segoe UI", system-ui, sans-serif;
    --corpo: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--painel); color: var(--tinta); font: 15px/1.4 var(--corpo); }
  header { background: var(--grafite); color: #f2f3f0; padding: 12px 20px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font: 700 18px var(--titulo); letter-spacing: .06em; text-transform: uppercase; }
  header nav { display: flex; gap: 4px; align-self: center; }
  header nav a { color: #c9cec7; text-decoration: none; padding: 6px 12px; font-weight: 600; border-bottom: 3px solid transparent; }
  header nav a[aria-current="page"] { color: #fff; border-bottom-color: #d99000; }
  header .conta { color: #b9bfb7; font-size: 13px; margin-left: auto; overflow-wrap: anywhere; }
  header .conta a { color: #f2f3f0; margin-left: 8px; }
  main { padding: 16px 20px 32px; max-width: 900px; margin: 0 auto; }
  h2 { font: 700 15px var(--titulo); letter-spacing: .06em; text-transform: uppercase; margin: 0 0 10px; }
  .bloco { background: var(--tela); border: 1px solid var(--linha); padding: 14px 16px; margin-bottom: 16px; }
  .ajuda { color: var(--apagado); font-size: 14px; margin: 8px 0 0; }
  form { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input[type="email"] { flex: 1 1 260px; min-width: 0; font: 15px var(--corpo); padding: 8px 10px; border: 1px solid #8c928b; background: #fff; }
  label.papel { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
  button { font: 600 14px var(--corpo); padding: 8px 14px; border: 1px solid var(--grafite); background: #f4f5f2; color: var(--grafite); cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { background: var(--grafite); color: #fff; }
  button.forte { background: var(--grafite); color: #fff; }
  button.perigo { border-color: var(--critico); color: var(--critico); }
  button.perigo:hover:not(:disabled) { background: var(--critico); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font: 600 11px var(--corpo); letter-spacing: .08em; text-transform: uppercase; color: var(--apagado); padding: 6px 8px; border-bottom: 1px solid var(--linha); }
  td { padding: 8px; border-bottom: 1px solid var(--linha); vertical-align: middle; }
  td.email { overflow-wrap: anywhere; }
  td.acoes { text-align: right; white-space: nowrap; }
  td.acoes button { margin-left: 6px; }
  .selo { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border: 1px solid var(--info); color: var(--info); }
  .voce { color: var(--apagado); font-size: 13px; }
  .msg { padding: 8px 12px; margin-bottom: 12px; display: none; }
  .msg.erro { display: block; background: #fbeaea; border: 1px solid var(--critico); color: var(--critico); }
  .msg.ok { display: block; background: #e6f3ec; border: 1px solid var(--ok); color: var(--ok); }
  .vazio { background: var(--tela); border: 1px dashed var(--linha); padding: 24px; color: var(--apagado); }
  code { background: #f4f5f2; padding: 1px 5px; border: 1px solid var(--linha); overflow-wrap: anywhere; }
  @media (max-width: 640px) {
    main, header { padding-left: 16px; padding-right: 16px; }
    thead { display: none; }
    tr { display: grid; grid-template-columns: 1fr auto; border-bottom: 1px solid var(--linha); padding: 6px 0; }
    td { border: 0; padding: 4px 0; }
    td.acoes { grid-column: 1 / -1; text-align: left; }
    td.acoes button { margin: 0 6px 0 0; }
  }
</style>
</head>
<body>
<header>
  <h1>Central de Operação</h1>
  <nav aria-label="Telas da central">
    <a href="/">Lojas</a>
    <a href="/alarmes">Alarmes</a>
    <a href="/acessos" aria-current="page">Acessos</a>
  </nav>
  <span class="conta" id="conta" hidden></span>
</header>
<main id="principal">
  <p class="vazio">Carregando…</p>
</main>
<script>
  // e-mails entram na página só como texto (textContent), nunca como HTML
  const el = (tag, props = {}, ...filhos) => {
    const n = document.createElement(tag);
    Object.assign(n, props);
    for (const f of filhos) if (f != null) n.append(f);
    return n;
  };
  const principal = document.getElementById('principal');
  let eu = null;
  let mensagem = null;

  async function chamar(caminho, corpo) {
    const r = await fetch(caminho, {
      method: corpo ? 'POST' : 'GET',
      cache: 'no-store',
      headers: corpo ? { 'Content-Type': 'application/json', 'X-Central': '1' } : {},
      body: corpo ? JSON.stringify(corpo) : undefined,
    });
    const dados = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(dados.erro || `erro ${r.status}`);
    return dados;
  }

  function avisar(texto, tipo) {
    mensagem = { texto, tipo };
  }

  function desenhar(usuarios) {
    const caixa = el('div', { className: `msg ${mensagem?.tipo || ''}`, role: 'status', textContent: mensagem?.texto || '' });
    mensagem = null;

    const email = el('input', { type: 'email', required: true, placeholder: 'fulano@gmail.com', autocomplete: 'off', ariaLabel: 'E-mail da conta Google' });
    const admin = el('input', { type: 'checkbox' });
    const form = el('form', {},
      email,
      el('label', { className: 'papel' }, admin, 'administrador'),
      el('button', { type: 'submit', className: 'forte', textContent: 'Liberar acesso' }));
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const alvo = email.value.trim().toLowerCase();
      try {
        const r = await chamar('/api/acesso', { email: alvo, admin: admin.checked });
        avisar(`${alvo} liberado. A pessoa entra com a conta Google desse e-mail.`, 'ok');
        desenhar(r.usuarios);
      } catch (e) { avisar(e.message, 'erro'); desenhar(usuarios); }
    });

    const corpo = el('tbody');
    for (const u of usuarios) {
      const souEu = u.email === eu.email;
      const papel = el('button', {
        type: 'button',
        textContent: u.admin ? 'Tirar administrador' : 'Tornar administrador',
        disabled: souEu,
        title: souEu ? 'Outro administrador precisa fazer isso' : '',
      });
      papel.addEventListener('click', async () => {
        try {
          const r = await chamar('/api/acesso', { email: u.email, admin: !u.admin });
          avisar(`${u.email}: ${u.admin ? 'deixou de ser administrador' : 'agora é administrador'}.`, 'ok');
          desenhar(r.usuarios);
        } catch (e) { avisar(e.message, 'erro'); desenhar(usuarios); }
      });
      const remover = el('button', { type: 'button', className: 'perigo', textContent: 'Remover', disabled: souEu });
      remover.addEventListener('click', async () => {
        if (!confirm(`Remover o acesso de ${u.email}?\nA pessoa perde o acesso na hora.`)) return;
        try {
          const r = await chamar('/api/acesso/remover', { email: u.email });
          avisar(`${u.email} removido.`, 'ok');
          desenhar(r.usuarios);
        } catch (e) { avisar(e.message, 'erro'); desenhar(usuarios); }
      });
      corpo.append(el('tr', {},
        el('td', { className: 'email' }, u.email, souEu ? el('span', { className: 'voce', textContent: ' (você)' }) : null),
        el('td', {}, u.admin ? el('span', { className: 'selo', textContent: 'ADMINISTRADOR' }) : 'operador'),
        el('td', { className: 'acoes' }, papel, remover)));
    }

    principal.replaceChildren(
      caixa,
      el('section', { className: 'bloco' },
        el('h2', { textContent: 'Liberar um e-mail' }),
        form,
        el('p', { className: 'ajuda', textContent: 'Use o e-mail da conta Google, exatamente como aparece no login '
          + '(Gmail ou e-mail da empresa no Google). Administrador também cadastra e remove acessos.' }),
        el('p', { className: 'ajuda' }, el('b', { textContent: 'Pessoa nova: ' }),
          'enquanto o login do Google estiver em modo de teste, inclua o e-mail também no Google Cloud, em ',
          el('b', { textContent: 'Google Auth Platform → Público-alvo → Usuários de teste' }),
          '. Sem isso o Google bloqueia antes de chegar aqui. Para remover alguém, basta remover aqui.')),
      el('section', { className: 'bloco' },
        el('h2', { textContent: `Com acesso (${usuarios.length})` }),
        el('table', {},
          el('thead', {}, el('tr', {}, el('th', { textContent: 'E-mail' }), el('th', { textContent: 'Papel' }), el('th'))),
          corpo),
        el('p', { className: 'ajuda', textContent: 'Remover vale na hora, inclusive para quem está com a página aberta. '
          + 'O acesso a cada loja continua pedindo também o usuário e a senha da loja.' })));
  }

  async function iniciar() {
    try {
      eu = await chamar('/api/eu');
    } catch {
      principal.replaceChildren(el('p', { className: 'vazio', textContent: 'Sem resposta do servidor da central.' }));
      return;
    }
    if (eu.email) {
      const conta = document.getElementById('conta');
      conta.replaceChildren(eu.email, el('a', { href: '/oauth2/sign_out?rd=%2F', textContent: 'Sair' }));
      conta.hidden = false;
    }
    if (!eu.web) {
      principal.replaceChildren(el('div', { className: 'vazio' },
        'Os acessos são cadastrados pelo endereço da internet, entrando com a conta Google de um administrador. ',
        'Pela VPN, no servidor da central: ', el('code', { textContent: 'sudo bash /opt/central/acesso.sh' })));
      return;
    }
    if (!eu.admin) {
      principal.replaceChildren(el('p', { className: 'vazio', textContent: 'Só um administrador cadastra e remove acessos.' }));
      return;
    }
    try {
      desenhar((await chamar('/api/acesso')).usuarios);
    } catch (e) {
      principal.replaceChildren(el('p', { className: 'vazio', textContent: e.message }));
    }
  }
  iniciar();
</script>
</body>
</html>
