<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Engemase Pulse Configurador · Supervisório de utilidades: configuração do gateway da unidade">
  <title>Engemase Pulse Configurador</title>
  <link rel="icon" type="image/png" href="assets/marcas/icone.png">
  <script src="assets/tema.js"></script>
  <link rel="stylesheet" href="assets/estilo.css">
</head>
<body>
  <nav class="coluna" aria-label="Telas">
    <div class="marca">
      <img class="marca-simbolo" data-marca="engemase-simbolo" alt="" hidden>
      <span class="marca-texto">
        <b>Engemase Pulse</b>
        <span>Configurador</span>
      </span>
    </div>
    <div class="menu" id="menu"></div>
    <div class="rodape-coluna">
      <span class="linha-estado"><span class="led" id="led-conexao"></span><span id="txt-conexao">conectando</span></span>
      <span class="usuario" id="usuario">—</span>
      <button class="botao escuro" id="btn-tema" title="Automático segue o tema do aparelho">Tema: automático</button>
      <button class="botao escuro" id="btn-sair" hidden>Sair</button>
      <div class="assinatura" id="assinatura" data-marca-caixa hidden>
        <span>desenvolvido por</span>
        <img data-marca="engemase" alt="Engemase Engenharia">
      </div>
    </div>
  </nav>

  <div class="area">
    <header class="cabecalho">
      <h1 id="titulo-tela">Início</h1>
      <span class="isa" id="isa-tela"></span>
      <span class="relogio"><span id="planta">—</span> · <span id="relogio">––</span></span>
    </header>

    <div class="faixa-sim" id="faixa-sim" hidden>
      Modo simulado — valores gerados pelo servidor, sem leitura dos equipamentos
    </div>

    <main class="tela" id="tela"></main>
  </div>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
