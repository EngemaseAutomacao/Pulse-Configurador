/* ---- public/assets/telas/comandos.js ---- */
/**
 * Bloco de acionamento.
 *
 * Um botão que abre ou fecha disjuntor não pode ser um clique só. O padrão aqui
 * é o mesmo de um comando de painel:
 *   - o botão fica desabilitado enquanto houver intertravamento, e a razão
 *     aparece escrita ao lado — o operador não fica adivinhando;
 *   - acionar exige dois toques, e o segundo tem prazo: passou, volta ao normal;
 *   - o servidor revalida tudo antes de escrever, então uma tela desatualizada
 *     não consegue mandar o que o processo não permite;
 *   - o resultado é conferido pela realimentação do equipamento.
 */

const PRAZO_CONFIRMACAO = 8000;

/**
 * Tempo mínimo entre armar e confirmar. A confirmação tem que ser um SEGUNDO
 * gesto humano: sem esta folga, um duplo clique, uma tecla presa, um toque que
 * repica na tela ou um ouvinte ligado duas vezes viram comando de disjuntor
 * saindo no primeiro clique. Ninguém confirma de propósito em 400 ms.
 */
const ESPERA_MINIMA = 400;

const blocoComandos = (idEquipamento = null) => `
  <section class="bloco" data-comandos="${idEquipamento || 'todos'}">
    ${placa('', 'Acionamento')}
    <div class="corpo">
      <div id="cmd-lista"><p class="nota">carregando…</p></div>
      <div id="cmd-resultado"></div>
    </div>
  </section>`;

const comandos = {
  _armado: null,       // { medidor, nome, desde, ate }
  _relogio: null,
  _raiz: null,
  _aoClicar: null,
  _aoTeclar: null,
  _lista: [],

  /** Há comando declarado para este equipamento? */
  async existem(idEquipamento) {
    if (MODO_DEMO) return false;
    try {
      const r = await api('/api/comandos');
      return r.liberados && r.comandos.some((c) => c.medidor === idEquipamento);
    } catch {
      return false;
    }
  },

  /**
   * A tela é remontada no mesmo elemento a cada troca de tela, então os
   * ouvintes PRECISAM ser guardados e removidos: dois ouvintes no mesmo lugar
   * fazem um clique chamar clicar() duas vezes — a primeira arma, a segunda
   * executa, e o disjuntor abre sem ninguém ter confirmado.
   */
  aoMontar(raiz, idEquipamento = null) {
    this.destruir();                       // nunca dois ouvintes no mesmo lugar
    this._raiz = raiz;
    this._id = idEquipamento;
    this._usuario = estado.usuario?.login || null;

    // o botão leva equipamento E comando: perfis repetem nomes ("ligar",
    // "desligar"), e só o nome faria o botão de um disjuntor acionar outro
    this._aoClicar = (ev) => {
      const b = ev.target.closest('[data-cmd]');
      if (b) this.clicar(raiz, b.dataset.medidor, b.dataset.cmd);
      if (ev.target.closest('[data-cmd-cancelar]')) this.desarmar(raiz);
    };
    // Enter no campo de senha confirma, como em qualquer formulário
    this._aoTeclar = (ev) => {
      const campo = ev.target.closest('[data-cmd-senha]');
      if (campo && ev.key === 'Enter') {
        ev.preventDefault();
        this.clicar(raiz, campo.dataset.medidor, campo.dataset.cmdSenha);
      }
    };
    raiz.addEventListener('click', this._aoClicar);
    raiz.addEventListener('keydown', this._aoTeclar);

    this.carregar(raiz);
    this._relogio = setInterval(() => this.carregar(raiz), 2000);
  },

  destruir() {
    clearInterval(this._relogio);
    this._relogio = null;
    if (this._raiz) {
      if (this._aoClicar) this._raiz.removeEventListener('click', this._aoClicar);
      if (this._aoTeclar) this._raiz.removeEventListener('keydown', this._aoTeclar);
    }
    this._raiz = null;
    this._aoClicar = null;
    this._aoTeclar = null;
    this._armado = null;
  },

  async carregar(raiz) {
    const alvo = $('#cmd-lista', raiz);
    if (!alvo || !alvo.isConnected) return;
    try {
      const r = await api('/api/comandos');
      // sem equipamento indicado, a tela mostra todos os acionamentos da planta
      this._lista = this._id ? r.comandos.filter((c) => c.medidor === this._id) : r.comandos;
      this._emCurso = r.em_curso || null;
      this.desenhar(raiz);
    } catch (e) {
      alvo.innerHTML = `<p class="nota">${esc(e.message)}</p>`;
    }
  },

  desenhar(raiz) {
    const alvo = $('#cmd-lista', raiz);
    if (!alvo) return;
    // o bloco se redesenha a cada 2 s: sem isso, a senha em digitação sumiria
    const campoAntes = $('[data-cmd-senha]', raiz);
    const senhaEmDigitacao = campoAntes?.value || '';
    const tinhaFoco = document.activeElement === campoAntes;
    if (!this._lista.length) {
      alvo.innerHTML = '<p class="nota">Nenhum acionamento liberado nesta instalação.</p>';
      return;
    }
    const agora = Date.now();
    // o servidor aceita um acionamento por vez; avisar antes evita a recusa
    const emCurso = this._emCurso
      ? `<p class="nota">Em andamento: ${esc(this._emCurso.rotulo)} (${esc(this._emCurso.equipamento)}),
         por ${esc(this._emCurso.quem)}. Novos acionamentos aguardam a confirmação.</p>`
      : '';
    alvo.innerHTML = `${emCurso}<div class="comandos">${this._lista.map((c) => {
      const armado = this._armado?.medidor === c.medidor && this._armado?.nome === c.nome
        && this._armado.ate > agora;
      const restante = armado ? Math.ceil((this._armado.ate - agora) / 1000) : 0;
      const bloqueado = !c.disponivel;
      return `
        <div class="comando ${c.perigoso ? 'perigoso' : ''} ${armado ? 'armado' : ''}">
          <div class="comando-linha">
            <button class="botao acionar" data-medidor="${esc(c.medidor)}" data-cmd="${esc(c.nome)}" ${bloqueado ? 'disabled' : ''}>
              ${armado ? `Confirmar em ${restante} s` : esc(c.rotulo)}
            </button>
            ${armado ? '<button class="botao" data-cmd-cancelar="1">Cancelar</button>' : ''}
            <div class="comando-estado">
              ${this._id ? '' : `<span class="rotulo" style="margin-bottom:3px">${esc(c.equipamento)}</span>`}
              ${c.impedimentos.length
    ? `<span class="motivo">${c.impedimentos.map(esc).join(' · ')}</span>`
    : !c.autorizado
      ? `<span class="motivo">exige perfil ${esc(c.papel)}</span>`
      : armado
        ? `<span class="motivo aviso">${c.exige_senha
          ? 'digite sua senha e toque de novo' : 'toque de novo para executar'}</span>`
        : `<span class="nota" style="margin:0">${esc(c.descricao || 'pronto para acionar')}</span>`}
              ${c.causa ? `<span class="rotulo" style="margin:4px 0 0">último disparo: ${esc(c.causa)}</span>` : ''}
            </div>
          </div>
          ${armado && c.exige_senha ? `
            <div class="comando-senha">
              <label class="rotulo" for="cmd-senha">Confirme com sua senha</label>
              <input class="entrada" type="password" id="cmd-senha" autocomplete="current-password"
                     data-medidor="${esc(c.medidor)}" data-cmd-senha="${esc(c.nome)}" placeholder="senha de ${esc(this._usuario || 'usuário')}">
            </div>` : ''}
        </div>`;
    }).join('')}</div>`;

    const campo = $('[data-cmd-senha]', raiz);
    if (campo) {
      campo.value = senhaEmDigitacao;
      if (tinhaFoco || !senhaEmDigitacao) campo.focus();
    }
  },

  clicar(raiz, medidor, nome) {
    const c = this._lista.find((x) => x.medidor === medidor && x.nome === nome);
    if (!c || !c.disponivel) return;
    const agora = Date.now();
    const armado = this._armado?.medidor === medidor && this._armado?.nome === nome
      && this._armado.ate > agora;
    if (!armado) {
      // primeiro toque: arma e espera a confirmação
      this._armado = {
        medidor: c.medidor, nome, desde: agora, ate: agora + PRAZO_CONFIRMACAO,
      };
      this.desenhar(raiz);
      return;
    }
    // confirmação cedo demais não é confirmação: é o mesmo toque chegando duas
    // vezes. Continua armado, esperando o gesto de verdade.
    if (agora - this._armado.desde < ESPERA_MINIMA) return;
    const campo = $('[data-cmd-senha]', raiz);
    const senha = campo?.value || '';
    if (c.exige_senha && !senha) {
      campo?.focus();
      return;
    }
    this._armado = null;
    this.executar(raiz, c, senha);
  },

  desarmar(raiz) {
    this._armado = null;
    this.desenhar(raiz);
  },

  async executar(raiz, c, senha = '') {
    const saida = $('#cmd-resultado', raiz);
    saida.innerHTML = `<div class="resultado"><b>${esc(c.rotulo)}</b> — enviando ao equipamento…</div>`;
    try {
      const r = await api('/api/comandos/executar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Painel': '1' },
        // a senha vai só nesta requisição e não fica guardada em lugar nenhum
        body: JSON.stringify({ medidor: c.medidor, comando: c.nome, confirmado: true, senha }),
      });
      saida.innerHTML = `<div class="resultado ${r.confirmado === false ? 'atencao' : 'ok'}">
        <b>${esc(c.rotulo)}</b> — ${esc(r.mensagem)}</div>`;
    } catch (e) {
      saida.innerHTML = `<div class="resultado ruim"><b>Comando recusado.</b> ${esc(e.message)}</div>`;
    }
    this.carregar(raiz);
  },
};

/* ---- public/assets/telas/consumo.js ---- */
/**
 * Consumo de energia por setor, hora a hora.
 *
 * Forma: um gráfico de colunas por setor (pequenos múltiplos), todos na mesma
 * escala para comparar setores entre si — oito setores numa pilha só seriam
 * oito cores e nenhum setor legível. A entrada geral vem em destaque no alto,
 * com escala própria, e a tela fecha com o ranking do dia e a tabela.
 *
 * Uma cor só (o azul de informação do sistema): cada gráfico é um setor, a
 * identidade vem do título. Hora estimada pela potência e hora em andamento
 * levam hachura na mesma cor — nunca um tom mais claro, que se confunde com a
 * superfície. Cada coluna tem dica ao passar o mouse; a tabela tem tudo.
 */

// medidas em pixels reais: cada gráfico é desenhado na largura do seu painel,
// para o texto do eixo ter sempre o mesmo tamanho, no painel largo e no estreito
const CONS_H = 140;
const CONS_M = { e: 34, d: 6, c: 8, b: 18 };
const CONS_GERAL_H = 190;

/** Fim de escala "redondo": 1, 2, 2,5, 5 × 10ⁿ. */
function consEscalaRedonda(v) {
  if (!(v > 0)) return 1;
  const p = 10 ** Math.floor(Math.log10(v));
  return [1, 2, 2.5, 5, 10].map((k) => k * p).find((x) => x >= v);
}

const consKwh = (v) => (v === null || v === undefined ? '––' : num(v, v < 10 ? 1 : 0));
// unidade da grandeza em tela: kWh (energia ativa) ou kVAh (aparente)
let consUn = 'kWh';
const consHora = (h) => `${String(h).padStart(2, '0')}h`;
const consFaixa = (h) => `${consHora(h)}–${consHora((h + 1) % 24)}`;

function consHoje() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function consSomarDias(dia, n) {
  const [a, m, d] = dia.split('-').map(Number);
  const x = new Date(a, m - 1, d + n);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
}
function consDiaPorExtenso(dia) {
  const [a, m, d] = dia.split('-').map(Number);
  return new Date(a, m - 1, d).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
}

/** Coluna com o topo arredondado e a base reta, crescendo da linha de base. */
function consColuna(x, y, w, base) {
  const h = base - y;
  if (h <= 0.5) return '';
  const r = Math.min(3, w / 2, h);
  return `M${x},${base}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${base}Z`;
}

/** Texto da dica de uma hora. */
function consDica(s, h, extra = '') {
  const v = s.kwh[h];
  if (s.futura[h]) return '';
  if (v === null) return `${s.nome}\n${consFaixa(h)} · sem registro`;
  const obs = s.parcial[h] ? '\nhora em andamento' : s.fonte[h] === 'potencia' ? '\nestimado pela potência média' : '';
  return `${s.nome}\n${consFaixa(h)} · ${consKwh(v)} ${consUn}${obs}${extra}`;
}

/**
 * Um gráfico de 24 colunas. `topo` é o fim de escala (comum aos setores, ou
 * do próprio setor). Hit-area da coluna inteira, maior que a marca.
 */
function consGrafico(s, topo, { largura = 360, altura = CONS_H, extras = [] } = {}) {
  const CONS_W = Math.max(240, Math.round(largura));
  const pw = CONS_W - CONS_M.e - CONS_M.d;
  const ph = altura - CONS_M.c - CONS_M.b;
  const base = CONS_M.c + ph;
  const banda = pw / 24;
  const larg = Math.min(24, banda - 2);
  const y = (v) => base - (Math.max(0, v) / topo) * ph;

  const grade = [0, topo / 2, topo].map((v) => `
    <line class="cons-grade" x1="${CONS_M.e}" x2="${CONS_W - CONS_M.d}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>
    <text class="cons-eixo" x="${CONS_M.e - 5}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${num(v, topo < 10 ? 1 : 0)}</text>`).join('');
  const marcasX = [0, 6, 12, 18].map((h) => `
    <text class="cons-eixo" x="${(CONS_M.e + banda * h + banda / 2).toFixed(1)}" y="${altura - 4}" text-anchor="middle">${consHora(h)}</text>`).join('');

  let colunas = '';
  let alvos = '';
  for (let h = 0; h < 24; h++) {
    const x = CONS_M.e + banda * h + (banda - larg) / 2;
    const v = s.kwh[h];
    if (v !== null && !s.futura[h]) {
      const classe = s.parcial[h] ? 'cons-coluna parcial' : s.fonte[h] === 'potencia' ? 'cons-coluna estimada' : 'cons-coluna';
      colunas += `<path class="${classe}" d="${consColuna(x, y(Math.min(v, topo)), larg, base)}"/>`;
    } else if (!s.futura[h]) {
      // hora sem registro: um traço na base, para não confundir com "zero"
      colunas += `<line class="cons-sem-dado" x1="${x.toFixed(1)}" x2="${(x + larg).toFixed(1)}" y1="${base - 1}" y2="${base - 1}"/>`;
    }
    const dica = consDica(s, h, extras[h] || '');
    if (dica) {
      alvos += `<rect class="cons-alvo" x="${(CONS_M.e + banda * h).toFixed(1)}" y="${CONS_M.c}" width="${banda.toFixed(2)}"
                 height="${ph}" data-dica="${esc(dica)}"/>`;
    }
  }
  return `<svg class="cons-svg" width="${CONS_W}" height="${altura}" viewBox="0 0 ${CONS_W} ${altura}" role="img"
              aria-label="${esc(s.nome)}: consumo por hora, ${consKwh(s.total)} ${consUn} no dia">
    ${grade}
    <line class="cons-base" x1="${CONS_M.e}" x2="${CONS_W - CONS_M.d}" y1="${base}" y2="${base}"/>
    ${colunas}${marcasX}${alvos}
  </svg>`;
}

function consPico(s) {
  let melhor = -1;
  s.kwh.forEach((v, h) => { if (v !== null && (melhor < 0 || v > s.kwh[melhor])) melhor = h; });
  return melhor;
}

/* --------------------------------------------- demonstração (sem servidor) */

/** Dia sintético, determinístico por dia e setor: perfil de loja aberta 7h–22h. */
function consDemo(dia, grandeza = 'ativa') {
  const fatorFp = grandeza === 'aparente' ? 1.06 : 1;   // aparente ≈ ativa / FP 0,94
  const eqs = (estado.config.equipamentos || []).filter((e) => (e.grupo || 'energia') === 'energia');
  const hoje = dia === consHoje();
  const horaAgora = new Date().getHours();
  let semente = [...dia].reduce((s, c) => s * 31 + c.charCodeAt(0), 7) >>> 0;
  const acaso = () => { semente = (semente * 1103515245 + 12345) >>> 0; return (semente % 1000) / 1000; };
  const frio = /fri|refrig|congel|climat/;
  const setor = (e, i) => {
    const potencia = 6 + ((i * 37) % 23) + acaso() * 4;     // kW médio em loja aberta
    const kwh = Array.from({ length: 24 }, (_, h) => {
      const aberta = h >= 7 && h < 22 ? 1 : 0;
      const forma = frio.test(e.id) ? 0.72 + 0.28 * aberta : 0.25 + 0.75 * aberta;
      return +(potencia * fatorFp * forma * (0.92 + acaso() * 0.16)).toFixed(2);
    });
    return kwh;
  };
  const ramais = eqs.filter((e) => !e.principal).map((e, i) => ({ e, kwh: setor(e, i) }));
  const geral = eqs.find((e) => e.principal);
  const montar = (e, kwh) => {
    const futura = kwh.map((_, h) => hoje && h > horaAgora);
    const parcial = kwh.map((_, h) => hoje && h === horaAgora);
    const valores = kwh.map((v, h) => (futura[h] ? null : parcial[h] ? +(v * 0.6).toFixed(2) : v));
    const fonte = valores.map((v, h) => (v === null ? null : h === 3 ? 'potencia' : 'contador'));
    return {
      id: e.id, nome: e.nome, tag_isa: e.tag_isa, principal: !!e.principal,
      kwh: valores, fonte, parcial, futura,
      total: +valores.filter((v) => v !== null).reduce((s, v) => s + v, 0).toFixed(2),
      horas_sem_dado: 0,
    };
  };
  const setores = ramais.map((r) => montar(r.e, r.kwh));
  if (geral) {
    const soma = Array.from({ length: 24 }, (_, h) => ramais.reduce((t, r) => t + r.kwh[h], 0) * 1.06);
    setores.unshift(montar(geral, soma));
  }
  const g = setores.find((s) => s.principal);
  const naoMedido = g && grandeza === 'ativa' ? g.kwh.map((v, h) => (v === null ? null
    : +Math.max(0, v - setores.filter((s) => !s.principal).reduce((t, s) => t + (s.kwh[h] || 0), 0)).toFixed(2))) : null;
  return { dia, grandeza, unidade: grandeza === 'aparente' ? 'kVAh' : 'kWh', geral: g?.id || null, setores, nao_medido: naoMedido };
}

const telaConsumo = {
  id: 'consumo',
  isa: '',
  nome: 'Consumo',
  titulo: 'Consumo de energia',
  _dia: null,
  _grandeza: 'ativa',
  _escala: 'comum',
  _tabela: false,
  _dados: null,
  _raiz: null,
  _ouvintes: null,
  _relogio: null,
  _pedido: 0,

  montar() {
    if (!this._dia) this._dia = consHoje();
    return `
      <svg class="cons-defs" width="0" height="0" aria-hidden="true" focusable="false">
        <defs>

          </pattern>
        </defs>
      </svg>

      <section class="bloco">
        ${placa('', 'Consumo de energia por setor')}
        <div class="corpo">

              <button class="botao" data-cons="hoje">Hoje</button>
              <button class="botao" data-cons="seguinte" title="Dia seguinte">▶</button>
            </div>
            <input class="entrada" type="date" id="cons-dia" aria-label="Dia" value="${this._dia}" max="${consHoje()}">
            <span class="rotulo" id="cons-dia-extenso" style="margin:0"></span>
            <div class="grupo-botoes" role="group" aria-label="Energia" style="margin-left:auto">
              <button class="botao" data-cons-grandeza="ativa" aria-pressed="${this._grandeza === 'ativa'}"
                      title="Energia ativa — a que gira o motor, aquece, ilumina">Ativa · kWh</button>
              <button class="botao" data-cons-grandeza="aparente" aria-pressed="${this._grandeza === 'aparente'}"
                      title="Energia aparente — ativa somada à reativa; a diferença é o efeito do fator de potência">Aparente · kVAh</button>
            </div>
          </div>
          <div id="cons-resumo"></div>
        </div>
      </section>

      <section class="bloco">
        ${placa('', 'Hora a hora')}
        <div class="corpo">
          <div class="controles">
            <div class="grupo-botoes" role="group" aria-label="Escala dos setores">
              <button class="botao" data-cons-escala="comum" aria-pressed="${this._escala === 'comum'}">Mesma escala</button>
              <button class="botao" data-cons-escala="propria" aria-pressed="${this._escala === 'propria'}">Escala de cada setor</button>
            </div>
            <button class="botao" data-cons="tabela" aria-pressed="${this._tabela}">Ver tabela</button>
            <button class="botao" data-cons="csv">Baixar CSV</button>
            <span class="cons-legenda">
              <span><i class="cons-chave"></i>medido pelo contador</span>
              <span><i class="cons-chave estimada"></i>estimado pela potência</span>
              <span><i class="cons-chave parcial"></i>hora em andamento</span>
              <span><i class="cons-chave sem-dado"></i>sem registro</span>
            </span>
          </div>
          <div id="cons-geral"></div>
          <div id="cons-paineis" class="cons-paineis"><p class="vazio">carregando…</p></div>
          <div id="cons-tabela" hidden></div>
        </div>
      </section>

      <section class="bloco">
        ${placa('', 'Participação no dia')}
        <div class="corpo"><div id="cons-ranking"></div></div>
      </section>
      <div class="cons-dica" id="cons-dica" hidden></div>`;
  },

  aoMontar(raiz) {
    this._raiz = raiz;
    const aoClicar = (ev) => {
      const b = ev.target.closest('[data-cons], [data-cons-escala], [data-cons-grandeza]');
      if (!b) return;
      const acao = b.dataset.cons;
      if (b.dataset.consGrandeza) {
        this._grandeza = b.dataset.consGrandeza;
        raiz.querySelectorAll('[data-cons-grandeza]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
        this.carregar(raiz);
      } else if (b.dataset.consEscala) {
        this._escala = b.dataset.consEscala;
        raiz.querySelectorAll('[data-cons-escala]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
        this.desenhar(raiz);
      } else if (acao === 'anterior') this.irPara(raiz, consSomarDias(this._dia, -1));
      else if (acao === 'seguinte') this.irPara(raiz, consSomarDias(this._dia, 1));
      else if (acao === 'hoje') this.irPara(raiz, consHoje());
      else if (acao === 'tabela') {
        this._tabela = !this._tabela;
        b.setAttribute('aria-pressed', String(this._tabela));
        this.desenhar(raiz);
      } else if (acao === 'csv') this.baixarCsv();
    };
    const aoMudar = (ev) => {
      if (ev.target.id === 'cons-dia' && ev.target.value) this.irPara(raiz, ev.target.value);
    };
    // dica: segue o mouse sobre qualquer coluna
    const aoMover = (ev) => {
      const alvo = ev.target.closest?.('[data-dica]');
      const dica = $('#cons-dica', raiz);
      if (!dica) return;
      if (!alvo) { dica.hidden = true; return; }
      dica.textContent = alvo.dataset.dica;
      dica.hidden = false;
      const x = Math.min(ev.clientX + 14, window.innerWidth - 230);
      dica.style.left = `${x}px`;
      dica.style.top = `${ev.clientY + 14}px`;
    };
    const aoSair = () => { const d = $('#cons-dica', raiz); if (d) d.hidden = true; };
    let espera = null;
    const aoRedimensionar = () => { clearTimeout(espera); espera = setTimeout(() => this.renderizarGraficos(raiz), 150); };
    raiz.addEventListener('click', aoClicar);
    raiz.addEventListener('change', aoMudar);
    raiz.addEventListener('mousemove', aoMover);
    raiz.addEventListener('mouseleave', aoSair);
    window.addEventListener('resize', aoRedimensionar, { passive: true });
    this._ouvintes = { aoClicar, aoMudar, aoMover, aoSair, aoRedimensionar };

    // o dia de hoje se atualiza sozinho a cada minuto
    this._relogio = setInterval(() => { if (this._dia === consHoje()) this.carregar(raiz); }, 60000);
    this.carregar(raiz);
  },

  destruir() {
    clearInterval(this._relogio);
    this._relogio = null;
    if (this._raiz && this._ouvintes) {
      this._raiz.removeEventListener('click', this._ouvintes.aoClicar);
      this._raiz.removeEventListener('change', this._ouvintes.aoMudar);
      this._raiz.removeEventListener('mousemove', this._ouvintes.aoMover);
      this._raiz.removeEventListener('mouseleave', this._ouvintes.aoSair);
    }
    if (this._ouvintes) window.removeEventListener('resize', this._ouvintes.aoRedimensionar);
    this._ouvintes = null;
    this._raiz = null;
    this._pedido += 1;   // descarta resposta que chegar depois de sair da tela
  },

  irPara(raiz, dia) {
    if (dia > consHoje()) return;
    this._dia = dia;
    const campo = $('#cons-dia', raiz);
    if (campo) campo.value = dia;
    this.carregar(raiz);
  },

  async carregar(raiz) {
    const meu = ++this._pedido;
    try {
      const dados = MODO_DEMO ? consDemo(this._dia, this._grandeza)
        : await api(`/api/consumo?dia=${encodeURIComponent(this._dia)}&grandeza=${this._grandeza}`);
      if (meu !== this._pedido) return;
      this._dados = dados;
      this.desenhar(raiz);
    } catch (e) {
      const alvo = $('#cons-paineis', raiz);
      if (alvo) alvo.innerHTML = `<p class="vazio">${esc(e.message)}</p>`;
    }
  },

  desenhar(raiz) {
    const d = this._dados;
    if (!d) return;
    consUn = d.unidade || 'kWh';
    const extenso = $('#cons-dia-extenso', raiz);
    if (extenso) extenso.textContent = consDiaPorExtenso(d.dia);
    const geral = d.setores.find((s) => s.principal) || null;
    const ramais = d.setores.filter((s) => !s.principal);
    this._graficos = new Map();

    this.desenharResumo(raiz, d, geral, ramais);

    // entrada geral, em destaque: a dica mostra a divisão da hora por setor
    const alvoGeral = $('#cons-geral', raiz);
    if (alvoGeral) {
      if (!geral) alvoGeral.innerHTML = '';
      else {
        const extras = geral.kwh.map((_, h) => {
          const partes = ramais.filter((s) => s.kwh[h] !== null).sort((a, b) => b.kwh[h] - a.kwh[h])
            .map((s) => `${s.nome}: ${consKwh(s.kwh[h])}`);
          const nm = d.nao_medido?.[h];
          return partes.length ? `\n— ${partes.join('\n— ')}${nm !== null && nm !== undefined ? `\n— não medido: ${consKwh(nm)}` : ''}` : '';
        });
        const topoG = consEscalaRedonda(Math.max(0, ...geral.kwh.filter((v) => v !== null)));
        this._graficos.set(geral.id, { s: geral, topo: topoG, altura: CONS_GERAL_H, extras });
        alvoGeral.innerHTML = `<div class="cons-painel destaque">
          ${this.cabecalho(geral, 'Entrada geral — total da instalação')}
          <div class="cons-area" data-cons-grafico="${esc(geral.id)}"></div>
        </div>`;
      }
    }

    // setores: mesma escala (compara setores) ou a de cada um (mostra o perfil)
    const paineis = $('#cons-paineis', raiz);
    if (paineis) {
      const maxComum = Math.max(0, ...ramais.flatMap((s) => s.kwh.filter((v) => v !== null)));
      paineis.innerHTML = ramais.length ? ramais.map((s) => {
        const topo = consEscalaRedonda(this._escala === 'comum' ? maxComum
          : Math.max(0, ...s.kwh.filter((v) => v !== null)));
        this._graficos.set(s.id, { s, topo, altura: CONS_H, extras: [] });
        return `<div class="cons-painel">${this.cabecalho(s)}
          <div class="cons-area" data-cons-grafico="${esc(s.id)}"></div></div>`;
      }).join('') : '<p class="vazio">Nenhum medidor de setor cadastrado.</p>';
    }
    this.renderizarGraficos(raiz);

    const tabela = $('#cons-tabela', raiz);
    if (tabela) {
      tabela.hidden = !this._tabela;
      if (this._tabela) tabela.innerHTML = this.tabelaHtml(d);
    }

    this.desenharRanking(raiz, d, geral, ramais);
  },

  /** Desenha cada gráfico na largura real do seu painel (e de novo ao redimensionar). */
  renderizarGraficos(raiz) {
    for (const area of raiz.querySelectorAll('[data-cons-grafico]')) {
      const g = this._graficos?.get(area.dataset.consGrafico);
      if (!g) continue;
      area.innerHTML = consGrafico(g.s, g.topo, { largura: area.clientWidth || 360, altura: g.altura, extras: g.extras });
    }
  },

  cabecalho(s, subtitulo = '') {
    const pico = consPico(s);
    return `<div class="cons-cabecalho">
      <div><span class="cons-nome">${esc(s.nome)}</span>${s.tag_isa ? `<span class="isa">${esc(s.tag_isa)}</span>` : ''}
        ${subtitulo ? `<div class="rotulo" style="margin:2px 0 0">${esc(subtitulo)}</div>` : ''}</div>
      <div class="cons-total"><b>${consKwh(s.total)}</b> ${consUn}
        <div class="rotulo" style="margin:0">${pico >= 0 ? `pico ${consFaixa(pico)} · ${consKwh(s.kwh[pico])} ${consUn}` : 'sem registro'}${s.horas_sem_dado ? ` · ${s.horas_sem_dado} h sem registro` : ''}</div>
      </div>
    </div>`;
  },

  desenharResumo(raiz, d, geral, ramais) {
    const alvo = $('#cons-resumo', raiz);
    if (!alvo) return;
    const somaRamais = ramais.reduce((t, s) => t + (s.total || 0), 0);
    const total = geral?.total ?? (ramais.length ? somaRamais : null);
    const ref = geral || null;
    const pico = ref ? consPico(ref) : -1;
    const maior = [...ramais].filter((s) => s.total !== null).sort((a, b) => b.total - a.total)[0];
    const nm = d.nao_medido ? d.nao_medido.filter((v) => v !== null).reduce((t, v) => t + v, 0) : null;
    const pct = (v) => (total ? `${num((v / total) * 100, 0)} % do total` : '');
    const ficha = (rotulo, valor, un, apoio) => `<div class="indicador">
      <div class="rotulo" style="margin:0 0 4px">${rotulo}</div>
      <div class="n">${valor}<span class="un">${un}</span></div>
      <div class="apoio">${apoio}</div></div>`;
    alvo.innerHTML = `<div class="indicadores">
      ${ficha(d.grandeza === 'aparente' ? 'Energia aparente do dia' : 'Consumo do dia', consKwh(total), consUn,
    geral ? 'medidor da entrada geral' : 'soma dos setores')}
      ${ficha('Hora de pico', pico >= 0 ? consFaixa(pico) : '––', '', pico >= 0 ? `${consKwh(ref.kwh[pico])} ${consUn} na entrada geral` : '')}
      ${ficha('Maior setor', maior ? esc(maior.nome) : '––', '', maior ? `${consKwh(maior.total)} ${consUn} · ${pct(maior.total)}` : '')}
      ${ficha('Não medido', nm === null ? '––' : consKwh(nm), nm === null ? '' : consUn,
    d.grandeza === 'aparente' ? 'só na energia ativa: a aparente não se soma entre setores'
      : nm === null ? 'precisa da entrada geral e de todos os setores' : `${pct(nm)} — entrada geral menos a soma dos setores`)}
    </div>`;
  },

  desenharRanking(raiz, d, geral, ramais) {
    const alvo = $('#cons-ranking', raiz);
    if (!alvo) return;
    const nm = d.nao_medido ? d.nao_medido.filter((v) => v !== null).reduce((t, v) => t + v, 0) : null;
    const linhas = ramais.filter((s) => s.total !== null).map((s) => ({ nome: s.nome, kwh: s.total, cinza: false }))
      .sort((a, b) => b.kwh - a.kwh);
    if (nm !== null) linhas.push({ nome: 'Não medido', kwh: nm, cinza: true });
    const total = geral?.total ?? linhas.reduce((t, l) => t + l.kwh, 0);
    const maximo = Math.max(...linhas.map((l) => l.kwh), 0) || 1;
    alvo.innerHTML = linhas.length ? `<div class="cons-ranking">${linhas.map((l) => `
      <div class="cons-linha">
        <span class="cons-rotulo">${esc(l.nome)}</span>
        <span class="cons-trilho"><span class="cons-barra${l.cinza ? ' cinza' : ''}" style="width:${((l.kwh / maximo) * 100).toFixed(1)}%"></span></span>
        <span class="cons-valor"><b>${consKwh(l.kwh)}</b> ${consUn}${total ? ` · ${num((l.kwh / total) * 100, 1)} %` : ''}</span>
      </div>`).join('')}</div>` : '<p class="vazio">Sem registro neste dia.</p>';
  },

  /** Linhas da tabela e do CSV: uma por hora, uma coluna por medidor. */
  linhasTabela(d) {
    const cols = [...d.setores.filter((s) => !s.principal), ...d.setores.filter((s) => s.principal)];
    const cab = ['Hora', ...cols.map((s) => s.nome), ...(d.nao_medido ? ['Não medido'] : [])];
    const horas = Array.from({ length: 24 }, (_, h) => [consFaixa(h),
      ...cols.map((s) => s.kwh[h]), ...(d.nao_medido ? [d.nao_medido[h]] : [])]);
    const totais = ['Total', ...cols.map((s) => s.total),
      ...(d.nao_medido ? [d.nao_medido.filter((v) => v !== null).reduce((t, v) => t + v, 0)] : [])];
    return { cab, horas, totais, cols };
  },

  tabelaHtml(d) {
    const { cab, horas, totais } = this.linhasTabela(d);
    return `<div class="cons-tabela"><table>
      <thead><tr>${cab.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead>
      <tbody>${horas.map((l) => `<tr>${l.map((v, i) => (i ? `<td class="n">${consKwh(v)}</td>` : `<td>${v}</td>`)).join('')}</tr>`).join('')}</tbody>
      <tfoot><tr>${totais.map((v, i) => (i ? `<td class="n"><b>${consKwh(v)}</b></td>` : '<td><b>Total</b></td>')).join('')}</tr></tfoot>
    </table><p class="nota" style="margin:8px 0 0">Valores em ${consUn}. "––" = sem registro naquela hora.</p></div>`;
  },

  /** CSV no formato do Excel brasileiro: ponto e vírgula, vírgula decimal. */
  baixarCsv() {
    const d = this._dados;
    if (!d) return;
    const { cab, horas, totais } = this.linhasTabela(d);
    const cel = (v) => (typeof v === 'number' ? v.toFixed(3).replace('.', ',') : v === null ? '' : `"${String(v).replace(/"/g, '""')}"`);
    const csv = [cab, ...horas, totais].map((l) => l.map(cel).join(';')).join('\r\n');
    const blob = new Blob([`﻿${csv}`], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `consumo-${d.dia}-${(d.unidade || 'kWh').toLowerCase()}.csv`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  },

  aoReceberDados() {},
};

/* ---- public/assets/telas/indicadores.js ---- */
/**
 * Indicadores do grupo gerador.
 *
 * O valor instantâneo de um gerador diz pouco: ele passa quase todo o tempo
 * parado. O que responde "vai pegar quando faltar energia?" é o histórico —
 * prontidão, partidas que falharam, e principalmente a tensão da bateria
 * durante o arranque, que é onde a bateria velha se entrega antes de deixar a
 * loja no escuro.
 *
 * Os números vêm prontos do servidor (/api/gerador/indicadores): quem calcula
 * é quem tem o banco, não o navegador.
 */

const PERIODOS_IND = [[7, '7 dias'], [30, '30 dias'], [90, '90 dias']];

const fichaInd = (rotulo, valor, unidade = '', apoio = '', nivel = '') => `
  <div class="indicador ${nivel}">
    <span class="rotulo">${esc(rotulo)}</span>
    <div class="n">${valor}${unidade ? `<span class="un">${esc(unidade)}</span>` : ''}</div>
    <div class="apoio">${apoio}</div>
  </div>`;

const horasInd = (h) => {
  if (h === null || h === undefined || !Number.isFinite(h)) return SEM_DADO;
  if (h >= 10) return num(h, 0);
  return num(h, 1);
};

/** Mini-gráfico das mínimas de partida: uma barra por corrida, a última à direita. */
function graficoBateria(historico, limite, critico) {
  if (!historico?.length) {
    return '<p class="nota" style="margin:10px 0 0">Ainda não há partidas registradas para comparar.</p>';
  }
  const L = 300; const A = 92; const base = A - 16; const topo = 8;
  const minimas = historico.map((h) => h.minima);
  const piso = Math.min(critico - 1.5, ...minimas) - 0.5;
  const teto = Math.max(limite + 2, ...minimas) + 0.5;
  const y = (v) => base - ((v - piso) / (teto - piso)) * (base - topo);
  const larg = Math.min(26, (L - 8) / historico.length) - 4;
  const passo = (L - 8) / historico.length;

  const barras = historico.map((h, i) => {
    const x = 4 + i * passo + (passo - larg) / 2;
    const yv = y(h.minima);
    const classe = h.minima < critico ? 'critico' : h.minima < limite ? 'atencao' : '';
    return `<rect class="barra-bat ${classe}" x="${x.toFixed(1)}" y="${yv.toFixed(1)}"
                  width="${larg.toFixed(1)}" height="${(base - yv).toFixed(1)}">
              <title>${esc(dataHora(h.ts))} — mínima ${num(h.minima, 1)} V, queda de ${num(h.queda, 1)} V</title>
            </rect>`;
  }).join('');

  return `
    <svg class="desenho" viewBox="0 0 ${L} ${A}" style="margin-top:10px"
         role="img" aria-label="Tensão mínima da bateria nas últimas partidas">
      <line class="limite-bat" x1="0" y1="${y(limite).toFixed(1)}" x2="${L}" y2="${y(limite).toFixed(1)}"/>
      <text class="rot" x="${L - 2}" y="${(y(limite) - 4).toFixed(1)}" text-anchor="end">mínimo ${num(limite, 0)} V</text>
      ${barras}
      <line class="cota" x1="0" y1="${base}" x2="${L}" y2="${base}"/>
      <text class="rot" x="0" y="${A - 3}">mais antiga</text>
      <text class="rot" x="${L}" y="${A - 3}" text-anchor="end">última partida</text>
    </svg>`;
}

/** Uma frase dizendo o que fazer — que é o que o gerente da loja vai ler. */
function vereditoBateria(bat) {
  const u = bat.ultima_queda;
  if (!u) return { nivel: '', texto: 'Sem partida registrada ainda. O primeiro arranque estabelece a referência.' };
  if (u.minima < bat.limite_critico_v) {
    return {
      nivel: 'critico',
      texto: `A tensão caiu a <b>${num(u.minima, 1)} V</b> no último arranque, abaixo do mínimo de `
        + `${num(bat.limite_critico_v, 0)} V. <b>Programe a troca da bateria</b> — o próximo arranque é aposta.`,
    };
  }
  if (u.minima < bat.limite_v) {
    return {
      nivel: 'atencao',
      texto: `Queda de <b>${num(u.queda, 1)} V</b> no arranque, chegando a ${num(u.minima, 1)} V. `
        + 'Ainda parte, mas a folga acabou: confira densidade, terminais e o carregador.',
    };
  }
  const piora = bat.queda_media !== null && u.queda > bat.queda_media * 1.25;
  return {
    nivel: piora ? 'atencao' : '',
    texto: piora

  };

const indicadores = {
  _relogio: null,
  _dias: 30,
  _dados: null,

  aoMontar(raiz) {
    this._dias = 30;
    raiz.querySelectorAll('[data-dias]').forEach((b) => b.addEventListener('click', () => {
      this._dias = Number(b.dataset.dias);
      raiz.querySelectorAll('[data-dias]').forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
      this.carregar(raiz);
    }));
    this.carregar(raiz);
    // histórico não muda a cada varredura: meio minuto basta e poupa o banco
    this._relogio = setInterval(() => this.carregar(raiz), 30000);
  },

  destruir() {
    clearInterval(this._relogio);
    this._relogio = null;
    this._dados = null;
  },

  async carregar(raiz) {
    const alvo = $('#gmg-ind-mosaico', raiz);
    if (!alvo || !alvo.isConnected) return;
    try {
      this._dados = MODO_DEMO
        ? simuladosDemo(this._dias)
        : await api(`/api/gerador/indicadores?dias=${this._dias}`);
      this.desenhar(raiz);
    } catch (e) {
      alvo.innerHTML = `<p class="nota">${esc(e.message)}</p>`;
    }
  },

  desenhar(raiz) {
    const d = this._dados;
    if (!d) return;
    const cfg = estado.config.gerador || {};
    const alvoDias = d.teste_a_cada_dias || 0;
    // a autonomia normalmente vem calculada do servidor; no modo demonstração (e
    // enquanto a primeira varredura não chega) ela sai do nível e do consumo
    const nivelAgora = valor(`${d.medidor}.nivel_diesel`);
    const lh = d.consumo_medido_lh || d.consumo_nominal_lh || cfg.consumo_litros_hora;
    const autonomia = valor(`${d.medidor}.autonomia_h`)
      ?? (nivelAgora === null || !lh || !cfg.capacidade_tanque_litros
        ? null : ((nivelAgora / 100) * cfg.capacidade_tanque_litros) / lh);
    const pronto = valor(`${d.medidor}.pronto`);

    const nivelProntidao = d.prontidao === null ? ''
      : d.prontidao < 90 ? 'critico' : d.prontidao < 98 ? 'atencao' : '';
    const nivelTeste = d.dias_sem_partir === null || !alvoDias ? ''
      : d.dias_sem_partir > alvoDias ? 'atencao' : '';
    const consumo = d.consumo_medido_lh;
    const desvio = consumo && d.consumo_nominal_lh
      ? ((consumo - d.consumo_nominal_lh) / d.consumo_nominal_lh) * 100 : null;

    $('#gmg-ind-mosaico', raiz).innerHTML = `<div class="indicadores">
      ${fichaInd('Prontidão no período', d.prontidao === null ? SEM_DADO : num(d.prontidao, 1), '%',
    pronto === null ? '' : pronto >= 0.5 ? 'pronto para partir agora' : 'indisponível agora', nivelProntidao)}
      ${fichaInd('Partidas', String(d.partidas),
    '', d.falhas_de_partida
      ? `<b>${d.falhas_de_partida}</b> não assumiram carga` : 'todas assumiram carga',
    d.falhas_de_partida ? 'critico' : '')}
      ${fichaInd('Horas de operação', horasInd(d.horas_operacao), 'h',
    d.pico_kw ? `pico de ${num(d.pico_kw, 0)} kW` : '')}
      ${fichaInd('Energia gerada', num(d.energia_kwh, 0), 'kWh',
    d.energia_kwh > 0 && d.horas_operacao > 0.05
      ? `média de ${num(d.energia_kwh / d.horas_operacao, 0)} kW` : '')}
      ${fichaInd('Consumo medido', consumo === null ? SEM_DADO : num(consumo, 1), 'L/h',
    consumo === null
      ? `catálogo: ${num(d.consumo_nominal_lh, 0)} L/h`
      : `${desvio > 0 ? '+' : ''}${num(desvio, 0)}% sobre o catálogo`,
    desvio !== null && Math.abs(desvio) > 20 ? 'atencao' : '')}
      ${fichaInd('Autonomia', autonomia === null ? SEM_DADO : num(autonomia, 1), 'h',
    'no consumo e no nível atuais',
    autonomia === null ? '' : autonomia < 4 ? 'critico' : autonomia < 8 ? 'atencao' : '')}
      ${fichaInd('Tempo de partida', d.tempo_medio_partida_s === null ? SEM_DADO
    : num(d.tempo_medio_partida_s, 0), 's', 'média até assumir a carga',
  d.tempo_medio_partida_s > 15 ? 'atencao' : '')}
      ${fichaInd('Sem partir há', d.dias_sem_partir === null ? SEM_DADO : num(d.dias_sem_partir, 1), 'd',
    alvoDias ? `teste a cada ${alvoDias} dias` : '', nivelTeste)}
    </div>`;

    const quando = $('#gmg-ind-quando', raiz);
    if (quando) {
      quando.textContent = d.em_corrida ? 'grupo em operação agora'
        : d.ultima_corrida ? `última partida em ${dataHora(d.ultima_corrida.inicio)}`
          : 'nenhuma partida registrada';
    }

    // ---- bateria
    const bat = d.bateria || {};
    const min = $('#gmg-bat-min', raiz);
    if (min) {
      const u = bat.ultima_queda;
      min.textContent = u ? num(u.minima, 1) : SEM_DADO;
      const caixa = min.closest('.leitura');
      caixa?.classList.toggle('anormal', !!u && u.minima < bat.limite_v);
      min.closest('.valor')?.classList.toggle('sem-dado', !u);
    }
    const graf = $('#gmg-bat-grafico', raiz);
    if (graf) graf.innerHTML = graficoBateria(bat.historico, bat.limite_v ?? 20, bat.limite_critico_v ?? 18);
    const vd = $('#gmg-bat-veredito', raiz);
    if (vd) {
      const v = vereditoBateria({ ...bat, limite_v: bat.limite_v ?? 20, limite_critico_v: bat.limite_critico_v ?? 18 });
      vd.className = `veredito ${v.nivel}`;
      vd.innerHTML = v.texto;
    }

    // ---- corridas
    const tabela = $('#gmg-corridas', raiz);
    if (tabela) {
      tabela.innerHTML = d.corridas.length ? `<table>
        <thead><tr>
          <th>Quando</th><th>Motivo</th><th>Duração</th><th>Partida</th>
          <th>Bateria</th><th>kWh</th><th>Resultado</th>
        </tr></thead>
        <tbody>${d.corridas.map((c) => {
    const ruim = /falha|desarme|não assumiu/.test(c.resultado || '');
    return `<tr class="${ruim ? 'prioridade-alta' : ''}">
              <td>${esc(dataHora(c.inicio))}</td>
              <td>${esc(c.motivo || '—')}</td>
              <td class="n">${c.duracao_s ? `${num(c.duracao_s / 60, 0)} min` : '—'}</td>
              <td class="n">${c.tempo_partida_s === null ? '—' : `${num(c.tempo_partida_s, 0)} s`}</td>
              <td class="n">${c.bateria_minima === null ? '—' : `${num(c.bateria_minima, 1)} V`}</td>
              <td class="n">${num(c.kwh, 1)}</td>
              <td>${esc(c.resultado || 'em andamento')}</td>
            </tr>`;
  }).join('')}</tbody></table>`
        : '<p class="vazio">Nenhuma partida no período.</p>';
    }

    // a tensão instantânea vem da varredura, não do histórico
    this.atualizarAgora(raiz, cfg);
  },

  /** Chamado a cada varredura pela tela do gerador. */
  atualizarAgora(raiz, cfg = estado.config.gerador || {}) {
    const id = cfg.medidor;
    const v = valor(`${id}.tensao_bateria`);
    const agora = $('#gmg-bat-agora', raiz);
    if (agora) {
      agora.textContent = v === null ? SEM_DADO : num(v, 1);
      agora.closest('.valor')?.classList.toggle('sem-dado', v === null);
    }
    const carregador = $('#gmg-bat-carregador', raiz);
    if (carregador) {
      const repousoMin = this._dados?.bateria?.repouso_minimo_v ?? cfg.bateria_repouso_min_v ?? 25.5;
      const falha = valor(`${id}.falha_carregador`);
      const est = valor(`${id}.estado`) ?? 0;
      const rodando = est >= 2 && est <= 4;   // no pré-aquecimento o alternador ainda não gira
      let texto = SEM_DADO; let cor = '';
      if (falha !== null && falha >= 0.5) { texto = 'em falha'; cor = 'var(--critico)'; }
      else if (v === null) { texto = SEM_DADO; }
      else if (rodando) { texto = 'alternador carregando'; }
      else if (v >= repousoMin) { texto = 'em flutuação'; }
      else { texto = 'não está carregando'; cor = 'var(--critico)'; }
      carregador.textContent = texto;
      carregador.style.color = cor || 'var(--tinta)';
    }
  },
};

/* Modo demonstração: o arquivo demo.html roda sem servidor, e um painel de
   indicadores vazio não mostra o produto. Os números abaixo são coerentes com
   o roteiro do simulador — inclusive a bateria se degradando. */
function simuladosDemo(dias) {
  const agora = Date.now();
  const partidas = Math.max(4, Math.round(dias / 7) * 2);
  const historico = Array.from({ length: Math.min(12, partidas) }, (_, i) => {
    const minima = 21.4 - i * 0.28 - (i > 7 ? 0.5 : 0);
    return { ts: agora - (12 - i) * 3 * 86400000, repouso: 26.9, minima, queda: 26.9 - minima };
  });
  const ultima = historico[historico.length - 1];
  return {
    medidor: (window.CONFIG_DEMO?.gerador || {}).medidor || 'gmg',
    dias,
    partidas,
    falhas_de_partida: dias >= 30 ? 1 : 0,
    horas_operacao: dias * 0.42,
    energia_kwh: dias * 0.42 * 96,
    litros_consumidos: dias * 0.42 * 34.6,
    consumo_medido_lh: 34.6,
    consumo_nominal_lh: 38,
    tempo_medio_partida_s: 9,
    pico_kw: 142,
    prontidao: 97.4,
    dias_sem_partir: 2.3,
    teste_a_cada_dias: 7,
    em_corrida: false,
    bateria: {
      repouso_minimo_v: 25.5,
      limite_v: 20,
      limite_critico_v: 18,
      ultima_queda: ultima,
      queda_media: historico.reduce((s, h) => s + h.queda, 0) / historico.length,
      pior_minima: Math.min(...historico.map((h) => h.minima)),
      historico,
    },
    ultima_corrida: {
      inicio: ultima.ts, fim: ultima.ts + 1800000, motivo: 'teste', resultado: 'normal',
      duracao_s: 1800, tempo_partida_s: 9, bateria_minima: ultima.minima, kwh: 48,
    },
    corridas: historico.slice().reverse().map((h, i) => ({
      inicio: h.ts,
      fim: h.ts + 1800000,
      motivo: i % 3 === 0 ? 'queda de rede' : 'teste',
      resultado: i === 4 ? 'falha de partida (bateria)' : 'normal',
      duracao_s: i === 4 ? 40 : 1800,
      tempo_partida_s: i === 4 ? null : 9,
      bateria_repouso: h.repouso,
      bateria_minima: h.minima,
      kwh: i === 4 ? 0 : 48,
      litros: i === 4 ? 0 : 17.3,
    })),
  };
}

    this._primeira = null;
    desenhar();
    indicadores.aoMontar(raiz);
  },

  atualizar(raiz) {
    const cfg = estado.config.gerador;
    if (!cfg?.medidor) return;
    const id = cfg.medidor;
    const eq = equipamento(id);
    const nivel = valor(`${id}.nivel_diesel`);

    // tanque
    const tanque = $('#gmg-diesel', raiz);
    const pct = $('#gmg-pct', raiz);
    const litros = $('#gmg-litros', raiz);
    if (tanque) {
      if (nivel === null) {
        tanque.setAttribute('height', '0');
        if (pct) { pct.textContent = SEM_DADO; pct.setAttribute('class', 'valor-desenho'); }
        if (litros) litros.textContent = SEM_DADO;
      } else {
        const y = yDoNivelDiesel(nivel);
        tanque.setAttribute('y', y.toFixed(1));
        tanque.setAttribute('height', (TQD.base - y).toFixed(1));
        const critico = (cfg.marcas || []).some((m) => m.prioridade === 'alta' && nivel < m.valor);
        if (pct) {
          pct.textContent = `${num(nivel, 1)} %`;
          pct.setAttribute('class', critico ? 'valor-desenho alerta' : 'valor-desenho');
        }
        if (litros) {
          litros.textContent = num((nivel / 100) * cfg.capacidade_tanque_litros, 0);
          litros.closest('.valor')?.classList.remove('sem-dado');
        }
      }
    }

    // estado, modo, rede e autonomia
    const estadoTxt = $('#gmg-estado', raiz);
    const modoTxt = $('#gmg-modo', raiz);
    const redeTxt = $('#gmg-rede', raiz);
    const autonomia = $('#gmg-autonomia', raiz);
    const iEstado = valor(`${id}.estado`);
    const iModo = valor(`${id}.modo`);
    const rede = valor(`${id}.rede_presente`);

    if (estadoTxt) {
      const lista = cfg.estados || [];
      estadoTxt.textContent = iEstado === null ? SEM_DADO : (lista[iEstado] ?? `código ${iEstado}`);
      estadoTxt.style.color = iEstado === 5 ? 'var(--critico)'
        : iEstado === 3 ? 'var(--ok)' : 'var(--tinta)';
    }
    if (modoTxt) {
      const lista = cfg.modos || [];
      modoTxt.textContent = iModo === null ? SEM_DADO : (lista[iModo] ?? `código ${iModo}`);
      modoTxt.style.color = iModo !== null && iModo !== 1 ? 'var(--atencao)' : 'var(--tinta)';
    }
    if (redeTxt) {
      redeTxt.textContent = rede === null ? SEM_DADO : (rede >= 0.5 ? 'presente' : 'ausente');
      redeTxt.style.color = rede !== null && rede < 0.5 ? 'var(--critico)' : 'var(--tinta)';
    }
    if (autonomia) {
      const consumo = cfg.consumo_litros_hora || 0;
      if (nivel === null || !consumo) autonomia.textContent = SEM_DADO;
      else {
        const h = ((nivel / 100) * cfg.capacidade_tanque_litros) / consumo;
        autonomia.textContent = `${num(h, 1)} h em plena carga`;
        autonomia.style.color = h < 4 ? 'var(--critico)' : h < 8 ? 'var(--atencao)' : 'var(--tinta)';
      }
    }

    // controladores que informam os disjuntores (DSE8620 pelos LEDs virtuais)
    const disjuntores = $('#gmg-disjuntores', raiz);
    if (disjuntores) {
      const gerador = valor(`${id}.disjuntor_fechado`);
      const rede = valor(`${id}.disjuntor_rede_fechado`);
      const txt = (v) => (v === null ? '––' : v >= 0.5 ? 'fechado' : 'aberto');
      // os dois fechados = em paralelo com a rede, operação normal no 8620
      disjuntores.textContent = rede === null ? `gerador ${txt(gerador)}`
        : gerador >= 0.5 && rede >= 0.5 ? 'em paralelo com a rede'
          : `gerador ${txt(gerador)} · rede ${txt(rede)}`;
    }

    indicadores.atualizarAgora(raiz, cfg);

    // primeira falha: a janela que acendeu primeiro fica marcada, como no anunciador físico
    const janelas = Array.from(raiz.querySelectorAll('[data-falha]'));
    const ativas = janelas.filter((j) => j.classList.contains('ativa'));
    if (!ativas.length) this._primeira = null;
    else if (!this._primeira || !ativas.includes(this._primeira)) [this._primeira] = ativas;
    for (const j of janelas) j.classList.toggle('primeira', j === this._primeira && ativas.length > 1);

    if (eq && !eq.online) {
      for (const j of janelas) j.classList.remove('ativa', 'primeira');
    }
  },

  destruir() {
    if (this._limpar) this._limpar();
    this._limpar = null;
    this._primeira = null;
    indicadores.destruir();
  },
};

// sem prazo fixo de histórico (vai até o disco apertar): os períodos longos
// mostram o que houver; de 7 dias para cima vêm das médias de 5 min
const PERIODOS = [[1, '1 h'], [6, '6 h'], [24, '24 h'], [168, '7 dias'], [720, '30 dias'], [2160, '90 dias'], [8760, '1 ano']];
const HIST_MAX_SERIES = PALETA_SERIES.length;

/** Comparações prontas, montadas a partir das tags que cada equipamento tem. */
function histAtalhos() {
  const saida = [];
  const eqs = estado.config.equipamentos;
  const conjunto = (eq, nomes) => nomes.filter((n) => eq.tags.some((t) => t.nome === n)).map((n) => `${eq.id}.${n}`);
  for (const eq of eqs) {
    const correntes = conjunto(eq, ['corrente_a', 'corrente_b', 'corrente_c', 'corrente_n']);
    if (correntes.length >= 2) saida.push({ id: `${eq.id}:correntes`, rotulo: `${eq.nome} · correntes das fases`, tags: correntes });
    const fn = conjunto(eq, ['tensao_an', 'tensao_bn', 'tensao_cn']);
    if (fn.length >= 2) saida.push({ id: `${eq.id}:tensoes`, rotulo: `${eq.nome} · tensões fase-neutro`, tags: fn });
    const ff = conjunto(eq, ['tensao_ab', 'tensao_bc', 'tensao_ca']);
    if (ff.length >= 2) saida.push({ id: `${eq.id}:tensoes_ff`, rotulo: `${eq.nome} · tensões fase-fase`, tags: ff });
    const energias = conjunto(eq, ['energia_ativa', 'energia_aparente']);
    if (energias.length === 2) saida.push({ id: `${eq.id}:energias`, rotulo: `${eq.nome} · energia ativa e aparente`, tags: energias });
    const potencias = conjunto(eq, ['potencia_ativa', 'potencia_aparente']);
    if (potencias.length === 2) saida.push({ id: `${eq.id}:potencias`, rotulo: `${eq.nome} · potência ativa e aparente`, tags: potencias });
    const thdI = conjunto(eq, ['thd_corrente', 'thd_corrente_b', 'thd_corrente_c']);
    if (thdI.length >= 2) saida.push({ id: `${eq.id}:thd_corrente`, rotulo: `${eq.nome} · THD de corrente das fases`, tags: thdI });
    const thdV = conjunto(eq, ['thd_tensao', 'thd_tensao_b', 'thd_tensao_c']);
    if (thdV.length >= 2) saida.push({ id: `${eq.id}:thd_tensao`, rotulo: `${eq.nome} · THD de tensão das fases`, tags: thdV });
    const ih = conjunto(eq, ['corrente_harmonica_a', 'corrente_harmonica_b', 'corrente_harmonica_c']);
    if (ih.length >= 2) saida.push({ id: `${eq.id}:harmonicas`, rotulo: `${eq.nome} · corrente harmônica das fases`, tags: ih });
  }
  // rastrear quem polui: os setores lado a lado (a entrada fica de fora — o THD
  // dela é sobre outra base, e assim cabem os 8 setores no gráfico)
  const setores = eqs.filter((e) => (e.grupo || 'energia') === 'energia' && !e.principal);
  const deTodos = (nome) => setores.filter((e) => e.tags.some((t) => t.nome === nome)).map((e) => `${e.id}.${nome}`);
  const ihSetores = deTodos('corrente_harmonica');
  if (ihSetores.length >= 2) {
    saida.unshift({ id: 'setores:harmonica', rotulo: 'Corrente harmônica de cada setor (maior fase)', tags: ihSetores.slice(0, HIST_MAX_SERIES) });
  }
  const thdSetores = deTodos('thd_corrente');
  if (thdSetores.length >= 2) {
    saida.unshift({ id: 'setores:thd', rotulo: 'THD de corrente (I1) de cada setor', tags: thdSetores.slice(0, HIST_MAX_SERIES) });
  }
  const potencias = eqs.filter((e) => (e.grupo || 'energia') === 'energia' && e.tags.some((t) => t.nome === 'potencia_ativa'))
    .sort((a, b) => Number(!!b.principal) - Number(!!a.principal))
    .map((e) => `${e.id}.potencia_ativa`);
  if (potencias.length >= 2) {
    saida.unshift({ id: 'todos:potencia', rotulo: 'Potência ativa de todos os medidores', tags: potencias.slice(0, HIST_MAX_SERIES) });
  }
  return saida;
}

/** mín · méd · máx do período de uma série agregada */
function histEstat(pontos) {
  if (!pontos?.length) return null;
  return {
    min: Math.min(...pontos.map((p) => p.min)),
    max: Math.max(...pontos.map((p) => p.max)),
    med: pontos.reduce((s, p) => s + p.med, 0) / pontos.length,
  };
}

const telaHistorico = {
  id: 'historico',
  isa: '',
  nome: 'Histórico',
  titulo: 'Histórico',
  _limpar: null,
  _series: null,      // [{ tag, cor }] — a cor fica com a grandeza enquanto ela estiver no gráfico
  _horas: 24,

  montar() {
    const grupos = { energia: 'Energia', subestacao: 'Subestação', agua: 'Água', gerador: 'Gerador' };
    const opcoes = Object.entries(grupos).map(([g, rotulo]) => {
      const itens = estado.config.equipamentos
        .filter((e) => (e.grupo || 'energia') === g)
        .flatMap((e) => e.tags
          // grandeza com valor numérico: o fator de potência não tem unidade, mas
          // entra; ficam de fora só os sinais liga/desliga, os códigos de estado
          // e os registros internos ocultos sem unidade (ex.: alarmes do DSE)
          .filter((t) => !t.digital && !t.enum && (t.unidade !== '' || !t.oculto))
          .map((t) => `<option value="${e.id}.${t.nome}">${esc(e.nome)} · ${esc(t.rotulo)}</option>`));
      return itens.length ? `<optgroup label="${rotulo}">${itens.join('')}</optgroup>` : '';
    }).join('');
    const atalhos = histAtalhos();

    if (!this._series) {
      const principal = estado.config.equipamentos.find((e) => e.principal);
      this._series = principal ? [{ tag: `${principal.id}.potencia_ativa`, cor: PALETA_SERIES[0] }] : [];
    }

    return `
      <section class="bloco">
        ${placa('', 'Tendência')}
        <div class="corpo">
          <div class="controles">
            <select id="hist-tag" aria-label="Adicionar grandeza ao gráfico">
              <option value="">+ adicionar grandeza ao gráfico…</option>${opcoes}
            </select>
            ${atalhos.length ? `<select id="hist-atalho" aria-label="Comparação pronta">
              <option value="">comparação pronta…</option>
              ${atalhos.map((a) => `<option value="${esc(a.id)}">${esc(a.rotulo)}</option>`).join('')}
            </select>` : ''}
            <div class="grupo-botoes" role="group" aria-label="Período">
              ${PERIODOS.map(([h, r]) => `<button class="botao" data-horas="${h}"
                    aria-pressed="${h === this._horas}">${r}</button>`).join('')}
            </div>
          </div>
          <div class="hist-series" id="hist-series" aria-label="Grandezas no gráfico"></div>
          <div class="hist-paineis" id="hist-paineis"></div>
        </div>
      </section>`;
  },

  aoMontar(raiz) {
    const sel = $('#hist-tag', raiz);
    const atalho = $('#hist-atalho', raiz);
    let pedido = 0;
    let dados = new Map();        // tag → pontos do último desenho
    let geometrias = [];          // por painel, para o mouse virar instante

    const defDe = (tag) => {
      const [id, nome] = String(tag).split('.');
      const eq = estado.config.equipamentos.find((e) => e.id === id);
      const t = eq?.tags.find((x) => x.nome === nome);
      return t ? { eq, t } : null;
    };

    const desenharEtiquetas = () => {
      const alvo = $('#hist-series', raiz);
      if (!alvo) return;
      alvo.innerHTML = this._series.map((s, i) => {
        const d = defDe(s.tag);
        const e = histEstat(dados.get(s.tag));
        const casas = d?.t.decimais ?? 1;
        const un = d?.t.unidade || '';
        return `<span class="hist-chip">
          <i style="background:${s.cor}" aria-hidden="true"></i>
          <b>${esc(d ? `${d.eq.nome} · ${d.t.rotulo}` : s.tag)}</b>
          <span class="hist-chip-num">${e ? `mín ${num(e.min, casas)} · méd ${num(e.med, casas)} · máx ${num(e.max, casas)} ${esc(un)}` : 'sem registro'}</span>
          <button class="hist-tirar" data-tirar="${i}" title="tirar do gráfico" aria-label="tirar ${esc(d?.t.rotulo || s.tag)} do gráfico">×</button>
        </span>`;
      }).join('') + (this._series.length > 1
        ? '<button class="botao" data-limpar-series>limpar</button>' : '')
        + (this._series.length >= HIST_MAX_SERIES ? `<span class="rotulo" style="margin:0">máximo de ${HIST_MAX_SERIES} grandezas</span>` : '');
      alvo.querySelectorAll('[data-tirar]').forEach((b) => b.addEventListener('click', () => {
        this._series.splice(Number(b.dataset.tirar), 1);
        desenhar();
      }));
      alvo.querySelectorAll('[data-limpar-series]').forEach((b) => b.addEventListener('click', () => {
        this._series = this._series.slice(0, 1);
        desenhar();
      }));
    };

    const desenhar = async () => {
      const meu = ++pedido;
      const tags = this._series.map((s) => s.tag);
      const lidos = await Promise.all(tags.map((t) => serie(t, this._horas)));
      if (meu !== pedido) return;
      dados = new Map(tags.map((t, i) => [t, lidos[i] || []]));
      desenharEtiquetas();

      const area = $('#hist-paineis', raiz);
      if (!area || !area.isConnected) return;
      if (!this._series.length) {
        area.innerHTML = '<p class="vazio">Escolha uma grandeza na lista acima.</p>';
        return;
      }
      // um painel por unidade: corrente e potência nunca dividem o mesmo eixo
      const porUnidade = new Map();
      for (const s of this._series) {
        const un = defDe(s.tag)?.t.unidade || '';
        if (!porUnidade.has(un)) porUnidade.set(un, []);
        porUnidade.get(un).push(s);
      }
      const paineis = [...porUnidade.entries()];
      const altura = paineis.length === 1 ? 320 : paineis.length === 2 ? 230 : 190;
      area.innerHTML = paineis.map(([un], i) => `
        <div class="hist-painel">
          <div class="hist-area" data-painel="${i}">
            <canvas id="hist-c-${i}" style="height:${altura}px" aria-label="Gráfico em ${esc(un || 'sem unidade')}"></canvas>
            <div class="hist-cruz" id="hist-cruz-${i}" hidden></div>
          </div>
        </div>`).join('') + '<div class="hist-dica" id="hist-dica" hidden></div>';

      // mesmo intervalo em todos os painéis: os tempos ficam alinhados na vertical
      const todos = [...dados.values()].filter((p) => p.length);
      const t0 = todos.length ? Math.min(...todos.map((p) => p[0].t)) : 0;
      const t1 = todos.length ? Math.max(...todos.map((p) => p[p.length - 1].t)) : 0;
      geometrias = paineis.map(([un, lista], i) => {
        const canvas = $(`#hist-c-${i}`, raiz);
        if (!canvas) return null;
        const marcas = lista.length === 1 ? (estado.config.limites || [])
          .filter((r) => r.tag === lista[0].tag)
          .flatMap((r) => [
            r.min !== undefined ? { valor: r.min, rotulo: `mín ${r.min}`, prioridade: r.prioridade } : null,
            r.max !== undefined ? { valor: r.max, rotulo: `máx ${r.max}`, prioridade: r.prioridade } : null,
          ].filter(Boolean)) : [];
        const g = desenharComparacao(canvas, lista.map((s) => ({
          pontos: dados.get(s.tag), cor: s.cor, unidade: un,
        })), { t0, t1, marcas, unidade: un });
        return g ? { ...g, lista } : null;
      });
      ligarMouse();
    };

    // linha vertical em todos os painéis + valores de todas as séries no instante
    const ligarMouse = () => {
      const dica = $('#hist-dica', raiz);
      raiz.querySelectorAll('.hist-area').forEach((areaP) => {
        const indice = Number(areaP.dataset.painel);
        areaP.addEventListener('mousemove', (ev) => {
          const g = geometrias[indice];
          if (!g || !areaP.getBoundingClientRect) return;
          const caixa = areaP.getBoundingClientRect();
          const x = ev.clientX - caixa.left;
          if (x < g.esquerda || x > g.esquerda + g.largura) { esconder(); return; }
          const t = g.t0 + ((x - g.esquerda) / g.largura) * (g.t1 - g.t0);
          geometrias.forEach((gg, j) => {
            const cruz = $(`#hist-cruz-${j}`, raiz);
            if (!cruz || !gg) return;
            cruz.hidden = false;
            cruz.style.left = `${gg.esquerda + ((t - gg.t0) / (gg.t1 - gg.t0)) * gg.largura}px`;
          });
          const linhas = this._series.map((s) => {
            const p = dados.get(s.tag) || [];
            if (!p.length) return null;
            let maisPerto = p[0];
            for (const q of p) if (Math.abs(q.t - t) < Math.abs(maisPerto.t - t)) maisPerto = q;
            const d = defDe(s.tag);
            return `<div><i style="background:${s.cor}"></i>${esc(d ? `${d.eq.nome} · ${d.t.rotulo}` : s.tag)}
              <b>${num(maisPerto.med, d?.t.decimais ?? 1)} ${esc(d?.t.unidade || '')}</b></div>`;
          }).filter(Boolean);
          const quando = new Date(t).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
          dica.innerHTML = `<div class="hist-dica-hora">${quando}</div>${linhas.join('')}`;
          dica.hidden = false;
          const areaTotal = $('#hist-paineis', raiz).getBoundingClientRect();
          const largDica = dica.offsetWidth || 220;
          const xPag = ev.clientX - areaTotal.left;
          const esq = xPag + 16 + largDica > areaTotal.width ? xPag - largDica - 16 : xPag + 16;
          // tela estreita: nem à direita nem à esquerda cabe inteira — encosta na borda
          dica.style.left = `${Math.max(0, Math.min(esq, areaTotal.width - largDica))}px`;
          dica.style.top = `${ev.clientY - areaTotal.top + 12}px`;
        });
        areaP.addEventListener('mouseleave', () => esconder());
      });
      function esconder() {
        raiz.querySelectorAll('.hist-cruz').forEach((c) => { c.hidden = true; });
        if (dica) dica.hidden = true;
      }
    };

    const adicionar = (tag) => {
      if (!tag || this._series.some((s) => s.tag === tag) || this._series.length >= HIST_MAX_SERIES) return;
      // primeira cor livre: tirar uma grandeza não pinta as outras de novo
      const usadas = new Set(this._series.map((s) => s.cor));
      this._series.push({ tag, cor: PALETA_SERIES.find((c) => !usadas.has(c)) });
    };

    sel.addEventListener('change', () => {
      adicionar(sel.value);
      sel.value = '';
      desenhar();
    });
    if (atalho) {
      atalho.addEventListener('change', () => {
        const a = histAtalhos().find((x) => x.id === atalho.value);
        atalho.value = '';
        if (!a) return;
        this._series = [];
        for (const tag of a.tags) adicionar(tag);
        desenhar();
      });
    }
    raiz.querySelectorAll('[data-horas]').forEach((b) => b.addEventListener('click', () => {
      this._horas = Number(b.dataset.horas);
      raiz.querySelectorAll('[data-horas]').forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
      desenhar();
    }));

    let temporizador = null;
    const aoRedimensionar = () => { clearTimeout(temporizador); temporizador = setTimeout(desenhar, 180); };
    window.addEventListener('resize', aoRedimensionar, { passive: true });
    this._limpar = () => {
      window.removeEventListener('resize', aoRedimensionar);
      clearTimeout(temporizador);
      pedido += 1;
    };
    // grandeza que sumiu da configuração (equipamento removido) sai da comparação
    this._series = this._series.filter((s) => defDe(s.tag));
    desenhar();
  },

  destruir() {
    if (this._limpar) this._limpar();
    this._limpar = null;
  },
};

/* ---- public/assets/telas/alarmes.js ---- */
/** Estado de reconhecimento do modo demonstração (sem servidor). */
const reconhecidosDemo = new Set();

function tabela(linhas, { encerrados }) {
  if (!linhas.length) {
    return `<p class="vazio">${encerrados
      ? 'Nenhuma ocorrência registrada no período.'
      : 'Nenhum alarme ativo. Todas as grandezas dentro dos limites.'}</p>`;
  }
  return `<table>
    <thead><tr>
      <th>Início</th><th>Prioridade</th><th>Ocorrência</th><th>Valor</th><th>Limite</th>
      <th>${encerrados ? 'Fim' : 'Duração'}</th><th></th>
    </tr></thead>
    <tbody>${linhas.map((a) => `
      <tr class="prioridade-${esc(a.prioridade)}">
        <td class="n">${dataHora(a.inicio)}</td>
        <td><span class="selo ${esc(a.prioridade)}">${esc(a.prioridade)}</span></td>
        <td>${esc(a.mensagem)}</td>
        <td class="n">${num(a.valor, 1)}</td>
        <td class="n">${esc(a.limite || '—')}</td>
        <td class="n">${encerrados
    ? (a.fim ? dataHora(a.fim) : '<span class="selo alta">em curso</span>')
    : duracao(Date.now() - a.inicio)}</td>
        <td class="n">${encerrados ? ''
    : (a.reconhecido
      ? '<span class="selo ok">reconhecido</span>'
      : `<button class="botao" data-reconhecer="${a.id}">Reconhecer</button>`)}</td>
      </tr>`).join('')}</tbody></table>`;
}

const telaAlarmes = {
  id: 'alarmes',
  isa: '',
  nome: 'Alarmes',
  titulo: 'Alarmes',
  _historico: [],

  montar() {
    return `
      <section class="bloco">
        ${placa('', 'Alarmes ativos')}
        <div class="corpo">
          <div class="controles">
            <button class="botao" id="rec-todos">Reconhecer todos</button>
            <span class="nota" style="margin:0">o reconhecimento fica registrado com data e hora</span>

  aoMontar(raiz) {
    // o container é permanente: o ouvinte precisa ser removido ao sair da tela,
    // senão sobra um por visita e passa a responder nas outras telas
    this._clique = async (ev) => {
      const btn = ev.target.closest('[data-reconhecer]');
      if (btn) { await this.reconhecer(Number(btn.dataset.reconhecer)); this.atualizar(raiz); return; }
      if (ev.target.id === 'rec-todos') { await this.reconhecer(null); this.atualizar(raiz); }
    };
    raiz.addEventListener('click', this._clique);
    this._raiz = raiz;
    this.carregarHistorico().then(() => this.atualizar(raiz));
  },

  destruir() {
    if (this._clique && this._raiz) this._raiz.removeEventListener('click', this._clique);
    this._clique = null;
    this._raiz = null;
    this._proximo = 0;
  },

  async reconhecer(id) {
    if (MODO_DEMO) {
      const alvos = id === null ? estado.dados.alarmes : estado.dados.alarmes.filter((a) => a.id === id);
      for (const a of alvos) { reconhecidosDemo.add(a.tag); a.reconhecido = 1; }
      return;
    }
    try {
      await api('/api/alarmes/reconhecer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(id === null ? {} : { id }),
      });
    } catch (e) {
      console.error('falha ao reconhecer', e);
    }
  },

  async carregarHistorico() {
    if (MODO_DEMO) { this._historico = estado.dados.alarmes; return; }
    try {
      const r = await api('/api/alarmes');
      this._historico = r.historico;
    } catch {
      this._historico = [];
    }
  },

  atualizar(raiz) {
    const ativos = estado.dados.alarmes.map((a) => (MODO_DEMO
      ? { ...a, reconhecido: reconhecidosDemo.has(a.tag) ? 1 : a.reconhecido }
      : a));
    const alvo = $('#lista-ativos', raiz);
    if (alvo) alvo.innerHTML = tabela(ativos, { encerrados: false });
    const hist = $('#lista-historico', raiz);
    if (hist) hist.innerHTML = tabela(MODO_DEMO ? ativos : this._historico, { encerrados: true });
  },

  aoReceberDados(raiz) {
    // recarrega o histórico só de vez em quando; os ativos vêm no próprio pacote
    if (!this._proximo || Date.now() > this._proximo) {
      this._proximo = Date.now() + 15000;
      this.carregarHistorico().then(() => this.atualizar(raiz));
    } else {
      this.atualizar(raiz);
    }
  },
};

  alterarCampo(raiz, el) {
    const i = Number(el.dataset.linha);
    const e = this._eqs?.[i];
    if (!e) return;
    const campo = el.dataset.campo;
    const v = el.value;

    if (campo === 'principal') {
      for (const x of this._eqs) x.principal = false;
      e.principal = el.checked;
    } else if (campo === 'unit_id') {
      e.conexao = { ...e.conexao, unit_id: Number(v) };
    } else if (campo === 'porta_serial') {
      e.conexao = { ...e.conexao, porta_serial: v };
    } else if (campo === 'host') {
      e.conexao = { ...e.conexao, host: v.trim() };
    } else if (campo === 'porta') {
      e.conexao = { ...e.conexao, porta: Number(v) || 502 };
    } else if (campo === 'baud') {
      e.conexao = { ...e.conexao, baud: Number(v) };
    } else if (campo === 'tipo') {
      // trocar de meio não carrega os campos do outro: serial e Ethernet têm
      // endereçamentos diferentes e misturá-los só gera configuração ambígua
      const { unit_id, timeout_ms, baud } = e.conexao || {};
      const perfil = this._perfis?.find((p) => p.nome === e.perfil);
      e.conexao = v === 'tcp'
        ? { tipo: 'tcp', host: e.conexao?.host || '', porta: e.conexao?.porta || 502, unit_id, timeout_ms }
        : {
          tipo: 'rtu',
          interface: v,
          porta_serial: e.conexao?.porta_serial || this._porta || '',
          // equipamento com endereço fixo em RS-232 (DSE: 10) já sai certo
          unit_id: v === 'rs232' && perfil?.endereco_rs232 ? perfil.endereco_rs232 : unit_id,
          timeout_ms,
          baud,
        };
    } else if (campo === 'disjuntor') {
      e.limites = v ? { ...e.limites, corrente_a: { max: Number(v) } } : {};
    } else if (campo === 'varredura_a_cada') {
      e.varredura_a_cada = v ? Number(v) : null;
    } else if (campo === 'perfil') {
      e.perfil = v;
      e.grupo = this._perfis.find((p) => p.nome === v)?.grupo || 'energia';
      if (e.grupo !== 'energia') e.principal = false;
    } else if (campo === 'nome') {
      e.nome = v;
      // o id acompanha o nome enquanto o equipamento é novo
      if (e.novo) e.id = this.idDoNome(v, i);
    } else {
      e[campo] = v;
    }
    this._sujo = true;
    this.desenharEquipamentos(raiz);
    this.desenharSecoes(raiz);
  },

  idDoNome(nome, i) {
    const base = String(nome || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || `eq${i + 1}`;
    let id = base;
    let n = 2;
    while (this._eqs.some((x, j) => j !== i && x.id === id)) { id = `${base}${n}`; n += 1; }
    return id;
  },

  acaoEquipamento(raiz, acao, linha) {
    if (acao === 'remover') {
      const e = this._eqs[linha];
      if (!confirm(`Remover ${e.nome || e.id}? O histórico já gravado é mantido.`)) return;
      this._eqs.splice(linha, 1);
    }
    if (acao === 'adicionar') {
      const usados = new Set(this._eqs.map((x) => x.conexao?.unit_id));
      let unit = 1;
      while (usados.has(unit) && unit < 247) unit += 1;
      const perfil = this._perfis?.[0];
      this._eqs.push({
        novo: true,
        id: this.idDoNome('novo equipamento', this._eqs.length),
        perfil: perfil?.nome || null,
        grupo: perfil?.grupo || 'energia',
        nome: 'Novo equipamento',
        tag_isa: '',
        principal: false,
        conexao: { unit_id: unit, porta_serial: this._porta },
        limites: {},
      });
    }
    this._sujo = true;
    this.desenharEquipamentos(raiz);
    this.desenharSecoes(raiz);
  },

  /* -------------------------------------------------- seções da instalação */

  /**
   * Campos de cada seção de tela. Só o que é da instalação: o que é do modelo
   * do equipamento (estados, modos, falhas) continua no perfil, e o servidor
   * recusa qualquer outro campo que chegue por aqui.
   */
  camposDaSecao(nome) {
    if (nome === 'gerador') {
      return [
        { campo: 'potencia_nominal_kw', rotulo: 'Potência nominal', un: 'kW', dica: 'da placa do gerador' },
        { campo: 'capacidade_tanque_litros', rotulo: 'Tanque', un: 'L', dica: 'volume útil do tanque de diesel' },
        { campo: 'consumo_litros_hora', rotulo: 'Consumo de catálogo', un: 'L/h', dica: 'a plena carga; o medido substitui assim que houver corrida' },
        { campo: 'teste_a_cada_dias', rotulo: 'Teste a cada', un: 'dias', dica: 'passou disso, alarme de grupo sem partir' },
        { campo: 'modo_automatico', rotulo: 'Código do modo automático', un: '', dica: 'qual valor da tag "modo" significa automático' },
        { campo: 'bateria_minima_v', rotulo: 'Bateria mínima', un: 'V', dica: 'abaixo disso o grupo não conta como disponível' },
        { campo: 'bateria_repouso_min_v', rotulo: 'Bateria em flutuação', un: 'V', dica: 'parado e com carregador bom' },
        { campo: 'bateria_partida_min_v', rotulo: 'Mínimo no arranque', un: 'V', dica: 'abaixo disso a bateria perdeu a folga' },
        { campo: 'bateria_partida_critica_v', rotulo: 'Crítico no arranque', un: 'V', dica: 'abaixo disso, programe a troca' },
      ];
    }
    return [
      { campo: 'capacidade_litros', rotulo: 'Capacidade', un: 'L', dica: 'volume útil do reservatório' },

   * do perfil, para o técnico ver os valores usuais preenchidos e só mudar o que
   * é diferente naquela loja.
   */
  semearSecaoDoPerfil() {
    for (const e of this._eqs || []) {
      const perfil = (this._perfis || []).find((p) => p.nome === e.perfil);
      if (!perfil?.secao || !perfil.secao_padrao) continue;
      const atual = this._secoes?.[perfil.secao];
      if (atual && Object.keys(atual).length) continue;
      this._secoes = { ...this._secoes, [perfil.secao]: { ...perfil.secao_padrao } };
    }
  },
