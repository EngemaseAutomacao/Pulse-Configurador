  alterarCampo(raiz, el) {
    const i = Number(el.dataset.linha);
    const e = this._eqs?.[i];
    if (!e) return;
    const campo = el.dataset.campo;
    const v = el.value;

    if (campo === 'principal') {
      for (const x of this._eqs) x.principal = false;
      e.principal = el.checked;
    } else if (campo === 'unit_id') {
      e.conexao = { ...e.conexao, unit_id: Number(v) };
    } else if (campo === 'porta_serial') {
      e.conexao = { ...e.conexao, porta_serial: v };
    } else if (campo === 'host') {
      e.conexao = { ...e.conexao, host: v.trim() };
    } else if (campo === 'porta') {
      e.conexao = { ...e.conexao, porta: Number(v) || 502 };
    } else if (campo === 'baud') {
      e.conexao = { ...e.conexao, baud: Number(v) };
    } else if (campo === 'tipo') {
      // trocar de meio não carrega os campos do outro: serial e Ethernet têm
      // endereçamentos diferentes e misturá-los só gera configuração ambígua
      const { unit_id, timeout_ms, baud } = e.conexao || {};
      const perfil = this._perfis?.find((p) => p.nome === e.perfil);
      e.conexao = v === 'tcp'
        ? { tipo: 'tcp', host: e.conexao?.host || '', porta: e.conexao?.porta || 502, unit_id, timeout_ms }
        : {
          tipo: 'rtu',
          interface: v,
          porta_serial: e.conexao?.porta_serial || this._porta || '',
          // equipamento com endereço fixo em RS-232 (DSE: 10) já sai certo
          unit_id: v === 'rs232' && perfil?.endereco_rs232 ? perfil.endereco_rs232 : unit_id,
          timeout_ms,
          baud,
        };
    } else if (campo === 'disjuntor') {
      e.limites = v ? { ...e.limites, corrente_a: { max: Number(v) } } : {};
    } else if (campo === 'varredura_a_cada') {
      e.varredura_a_cada = v ? Number(v) : null;
    } else if (campo === 'perfil') {
      e.perfil = v;
      e.grupo = this._perfis.find((p) => p.nome === v)?.grupo || 'energia';
      if (e.grupo !== 'energia') e.principal = false;
    } else if (campo === 'nome') {
      e.nome = v;
      // o id acompanha o nome enquanto o equipamento é novo
      if (e.novo) e.id = this.idDoNome(v, i);
    } else {
      e[campo] = v;
    }
    this._sujo = true;
    this.desenharEquipamentos(raiz);
    this.desenharSecoes(raiz);
  },

  idDoNome(nome, i) {
    const base = String(nome || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || `eq${i + 1}`;
    let id = base;
    let n = 2;
    while (this._eqs.some((x, j) => j !== i && x.id === id)) { id = `${base}${n}`; n += 1; }
    return id;
  },

  acaoEquipamento(raiz, acao, linha) {
    if (acao === 'remover') {
      const e = this._eqs[linha];
      if (!confirm(`Remover ${e.nome || e.id}? O histórico já gravado é mantido.`)) return;
      this._eqs.splice(linha, 1);
    }
    if (acao === 'adicionar') {
      const usados = new Set(this._eqs.map((x) => x.conexao?.unit_id));
      let unit = 1;
      while (usados.has(unit) && unit < 247) unit += 1;
      const perfil = this._perfis?.[0];
      this._eqs.push({
        novo: true,
        id: this.idDoNome('novo equipamento', this._eqs.length),
        perfil: perfil?.nome || null,
        grupo: perfil?.grupo || 'energia',
        nome: 'Novo equipamento',
        tag_isa: '',
        principal: false,
        conexao: { unit_id: unit, porta_serial: this._porta },
        limites: {},
      });
    }
    this._sujo = true;
    this.desenharEquipamentos(raiz);
    this.desenharSecoes(raiz);
  },

  /* -------------------------------------------------- seções da instalação */

  /**
   * Campos de cada seção de tela. Só o que é da instalação: o que é do modelo
   * do equipamento (estados, modos, falhas) continua no perfil, e o servidor
   * recusa qualquer outro campo que chegue por aqui.
   */
  camposDaSecao(nome) {
    if (nome === 'gerador') {
      return [
        { campo: 'potencia_nominal_kw', rotulo: 'Potência nominal', un: 'kW', dica: 'da placa do gerador' },
        { campo: 'capacidade_tanque_litros', rotulo: 'Tanque', un: 'L', dica: 'volume útil do tanque de diesel' },
        { campo: 'consumo_litros_hora', rotulo: 'Consumo de catálogo', un: 'L/h', dica: 'a plena carga; o medido substitui assim que houver corrida' },
        { campo: 'teste_a_cada_dias', rotulo: 'Teste a cada', un: 'dias', dica: 'passou disso, alarme de grupo sem partir' },
        { campo: 'modo_automatico', rotulo: 'Código do modo automático', un: '', dica: 'qual valor da tag "modo" significa automático' },
        { campo: 'bateria_minima_v', rotulo: 'Bateria mínima', un: 'V', dica: 'abaixo disso o grupo não conta como disponível' },
        { campo: 'bateria_repouso_min_v', rotulo: 'Bateria em flutuação', un: 'V', dica: 'parado e com carregador bom' },
        { campo: 'bateria_partida_min_v', rotulo: 'Mínimo no arranque', un: 'V', dica: 'abaixo disso a bateria perdeu a folga' },
        { campo: 'bateria_partida_critica_v', rotulo: 'Crítico no arranque', un: 'V', dica: 'abaixo disso, programe a troca' },
      ];
    }
    return [
      { campo: 'capacidade_litros', rotulo: 'Capacidade', un: 'L', dica: 'volume útil do reservatório' },
      { campo: 'altura_util_m', rotulo: 'Altura útil', un: 'm', dica: 'entre o sensor e o extravasor' },
      { campo: 'tag_isa', rotulo: 'Tag ISA', un: '', dica: 'como está escrito na porta do painel', texto: true },
    ];
  },

  /**
   * Um equipamento recém-cadastrado ainda não tem seção: o ponto de partida vem
   * do perfil, para o técnico ver os valores usuais preenchidos e só mudar o que
   * é diferente naquela loja.
   */
  semearSecaoDoPerfil() {
    for (const e of this._eqs || []) {
      const perfil = (this._perfis || []).find((p) => p.nome === e.perfil);
      if (!perfil?.secao || !perfil.secao_padrao) continue;
      const atual = this._secoes?.[perfil.secao];
      if (atual && Object.keys(atual).length) continue;
      this._secoes = { ...this._secoes, [perfil.secao]: { ...perfil.secao_padrao } };
    }
  },

  desenharSecoes(raiz) {
    const alvo = $('#sec-formulario', raiz);
    if (!alvo) return;
    this.semearSecaoDoPerfil();
    const grupos = new Set((this._eqs || []).map((e) => e.grupo));
    const quais = [
      ['gerador', 'gerador', 'Grupo gerador', 'nível de diesel'],
      ['caixa_agua', 'agua', 'Reservatório', 'nível de água'],
    ].filter(([, grupo]) => grupos.has(grupo));

    if (!quais.length) {
      alvo.innerHTML = '<p class="vazio">Nenhuma seção a preencher: '
        + 'esta instalação não tem gerador nem reservatório cadastrado.</p>';
      return;
    }

    alvo.innerHTML = quais.map(([nome, , titulo, oQue]) => {
      const dados = this._secoes?.[nome] || {};
      const campos = this.camposDaSecao(nome).map((c) => `
        <label class="campo-secao">
          <span class="rotulo">${esc(c.rotulo)}${c.un ? ` <span class="un">(${esc(c.un)})</span>` : ''}</span>
          <input class="entrada" data-secao="${nome}" data-secao-campo="${c.campo}"
                 ${c.texto ? '' : 'type="number" step="any" min="0"'}
                 value="${esc(dados[c.campo] ?? '')}" title="${esc(c.dica)}">
          <span class="dica">${esc(c.dica)}</span>
        </label>`).join('');

      const marcas = (dados.marcas || []).map((m, i) => `
        <tr>
          <td><input class="entrada curta" type="number" min="0" max="100" step="any"
                     data-secao="${nome}" data-marca="${i}" data-marca-campo="valor" value="${esc(m.valor)}"></td>
          <td><input class="entrada larga" data-secao="${nome}" data-marca="${i}"
                     data-marca-campo="rotulo" value="${esc(m.rotulo || '')}"></td>
          <td><select class="entrada" data-secao="${nome}" data-marca="${i}" data-marca-campo="prioridade">
            ${[['alta', 'crítico'], ['media', 'atenção'], ['info', 'informativo']].map(([v, r]) => `
              <option value="${v}" ${m.prioridade === v ? 'selected' : ''}>${r}</option>`).join('')}
          </select></td>
          <td class="n"><button class="botao" data-secao-acao="remover-marca"
                                data-secao="${nome}" data-marca="${i}">Remover</button></td>
        </tr>`).join('');

      return `<div class="secao-instalacao">
        <h3 class="titulo-secao">${esc(titulo)}</h3>
        <div class="campos-secao">${campos}</div>
        <p class="rotulo" style="margin:14px 0 6px">Marcas de ${esc(oQue)} — viram as linhas
          tracejadas do desenho e os limites do alarme</p>
        <table class="editor">
          <thead><tr><th>%</th><th>Rótulo</th><th>Prioridade</th><th></th></tr></thead>
          <tbody>${marcas || `<tr><td colspan="4" class="rotulo">nenhuma marca definida</td></tr>`}</tbody>
        </table>
        <button class="botao" style="margin-top:10px" data-secao-acao="add-marca"
                data-secao="${nome}">Adicionar marca</button>
      </div>`;
    }).join('');
  },

  alterarSecao(raiz, el) {
    const nome = el.dataset.secao;
    if (!this._secoes) this._secoes = {};
    if (!this._secoes[nome]) this._secoes[nome] = {};
    const secao = this._secoes[nome];

    if (el.dataset.marca !== undefined) {
      const i = Number(el.dataset.marca);
      secao.marcas = secao.marcas || [];
      const campo = el.dataset.marcaCampo;
      secao.marcas[i] = {
        ...secao.marcas[i],
        [campo]: campo === 'valor' ? Number(el.value) : el.value,
      };
    } else {
      const campo = el.dataset.secaoCampo;
      secao[campo] = el.value === '' ? null : (el.type === 'number' ? Number(el.value) : el.value);
    }
    this._sujo = true;
    this.desenharEquipamentos(raiz);
  },

  acaoSecao(raiz, acao, nome, i) {
    if (!this._secoes[nome]) this._secoes[nome] = {};
    const secao = this._secoes[nome];
    secao.marcas = secao.marcas || [];
    if (acao === 'add-marca') secao.marcas.push({ valor: 50, rotulo: 'nova marca', prioridade: 'media' });
    if (acao === 'remover-marca') secao.marcas.splice(i, 1);
    this._sujo = true;
    this.desenharSecoes(raiz);
    this.desenharEquipamentos(raiz);
  },

  async salvarEquipamentos(raiz, apenasValidar) {
    const aviso = $('#eq-aviso', raiz);
    aviso.innerHTML = '<p class="rotulo">conferindo…</p>';
    try {
      const r = await api('/api/eng/equipamentos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Painel': '1' },
        body: JSON.stringify({
          equipamentos: this._eqs,
          secoes: this._secoes || {},
          apenas_validar: apenasValidar,
        }),
      });
      const avisos = (r.avisos || []).map((a) => `<li>${esc(a)}</li>`).join('');
      aviso.innerHTML = `<div class="resultado ok">
        <b>${apenasValidar ? 'Configuração válida.' : 'Configuração aplicada.'}</b>
        ${apenasValidar ? ' Nada foi alterado ainda.' : ' A leitura já está usando os novos endereços.'}
        ${avisos ? `<ul class="rotulo" style="margin:8px 0 0">${avisos}</ul>` : ''}
      </div>`;
      if (!apenasValidar) {
        this._sujo = false;
        setTimeout(() => location.reload(), 1200);
      }
    } catch (e) {
      const lista = e.dados?.erros?.length ? e.dados.erros : [e.message];
      aviso.innerHTML = `<div class="resultado ruim"><b>Não foi aplicado.</b>
        <ul class="rotulo" style="margin:8px 0 0">${lista.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
    }
  },

  async varrer(raiz) {
    const saida = $('#v-saida', raiz);
    const botao = $('#v-rodar', raiz);
    botao.disabled = true;
    saida.innerHTML = '<p class="rotulo">procurando…</p>';
    try {
      const r = await api('/api/eng/varredura', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Painel': '1' },
        body: JSON.stringify({
          tipo: $('#v-tipo', raiz).value,
          ...($('#v-tipo', raiz).value === 'tcp'
            ? { host: $('#v-host', raiz).value.trim(), porta: Number($('#v-porta-tcp', raiz).value) || 502 }
            : {
              porta_serial: $('#v-porta', raiz).value,
              baud: Number($('#v-baud', raiz).value),
              paridade: $('#v-paridade', raiz).value,
            }),
          de: Number($('#v-de', raiz).value),
          ate: Number($('#v-ate', raiz).value),
        }),
      });
      const configurados = new Map(estado.config.equipamentos.map((e) => [e.unit_id, e.nome]));
      saida.innerHTML = r.achados.length ? `<table>
        <thead><tr><th>Endereço</th><th>Situação</th><th>Resposta</th><th>Configurado como</th></tr></thead>
        <tbody>${r.achados.map((a) => `<tr>
          <td class="n">${a.unit_id}</td>
          <td>${a.situacao === 'respondeu' ? '<span class="selo ok">respondeu</span>'
    : '<span class="selo media">existe, recusou o pedido</span>'}</td>
          <td class="n">${a.ms} ms</td>
          <td>${esc(configurados.get(a.unit_id) || '— não está no config —')}</td>
        </tr>`).join('')}</tbody></table>
        ${r.simulado ? '<p class="rotulo">resultado simulado</p>' : ''}`
        : '<p class="vazio">Ninguém respondeu nessa faixa. Confira velocidade, paridade e fiação.</p>';
    } catch (e) {
      saida.innerHTML = `<p class="vazio" style="color:var(--critico)">${esc(e.message)}</p>`;
    } finally {
      botao.disabled = false;
    }
  },

  async ler(raiz) {
    const saida = $('#t-saida', raiz);
    const sel = $('#t-id', raiz);
    const unitId = sel.value === 'livre' ? Number($('#t-id-livre', raiz).value) : Number(sel.value);
    try {
      const r = await api('/api/eng/ler', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Painel': '1' },
        body: JSON.stringify({
          unit_id: unitId,
          funcao: $('#t-funcao', raiz).value,
          endereco: Number($('#t-end', raiz).value),
          quantidade: Number($('#t-qtd', raiz).value),
        }),
      });
      const base = Number($('#t-end', raiz).value);
      saida.innerHTML = `<table>
        <thead><tr><th>Reg.</th><th>Hex</th><th>Bits</th>${COLUNAS.map((c) => `<th>${TITULOS[c]}</th>`).join('')}</tr></thead>
        <tbody>${r.leitura.map((l) => `<tr>
          <td class="n">${base + l.endereco_relativo}</td>
          <td class="n">${l.hex}</td>
          <td class="n" style="letter-spacing:.06em">${l.bits.replace(/(.{4})/g, '$1 ').trim()}</td>
          ${COLUNAS.map((c) => `<td class="n">${l[c] === undefined || l[c] === null ? '—' : num(l[c], 3)}</td>`).join('')}
        </tr>`).join('')}</tbody></table>
        <p class="rotulo">resposta em ${r.ms} ms · ${r.registradores.length} registradores</p>`;
    } catch (e) {
      saida.innerHTML = `<p class="vazio" style="color:var(--critico)">${esc(e.message)}</p>`;
    }
  },

  async diagnostico(raiz) {
    const saida = $('#d-saida', raiz);
    if (!saida || !saida.isConnected) return;
    try {
      const r = await api('/api/eng/diagnostico');
      $('#d-resumo', raiz).textContent = `${r.equipamentos.length} equipamentos · `
        + `${r.barramentos.length} barramento(s) · varredura a cada ${r.intervalo_ms} ms`;
      saida.innerHTML = `<table>
        <thead><tr><th>Equipamento</th><th>ID</th><th>Estado</th><th>Requisições</th><th>Falhas</th>
          <th>Exceções</th><th>Tempo médio</th><th>Pior tempo</th><th>Última falha</th></tr></thead>
        <tbody>${r.equipamentos.map((e) => `<tr class="${e.taxa_falha > 5 ? 'prioridade-alta' : e.taxa_falha > 0 ? 'prioridade-media' : ''}">
          <td>${esc(e.nome)}</td>
          <td class="n">${e.unit_id ?? '—'}</td>
          <td>${e.online ? '<span class="selo ok">em serviço</span>' : '<span class="selo alta">sem comunicação</span>'}</td>
          <td class="n">${e.requisicoes}</td>
          <td class="n">${e.falhas}${e.taxa_falha ? ` (${e.taxa_falha}%)` : ''}</td>
          <td class="n">${e.excecoes}</td>
          <td class="n">${e.tempo_medio ?? '—'} ms</td>
          <td class="n">${e.tempo_max || '—'} ms</td>
          <td class="n">${e.ultima_falha ? esc(`${dataHora(e.ultima_falha.ts)} — ${e.ultima_falha.mensagem}`) : '—'}</td>
        </tr>`).join('')}</tbody></table>`;
    } catch (e) {
      saida.innerHTML = `<p class="vazio">${esc(e.message)}</p>`;
    }
  },

  async perfis(raiz) {
    const saida = $('#p-saida', raiz);
    try {
      const r = await api('/api/eng/perfis');
      const usados = new Map();
      for (const e of estado.config.equipamentos) {
        if (e.perfil) usados.set(e.perfil, (usados.get(e.perfil) || 0) + 1);
      }
      saida.innerHTML = `<table>
        <thead><tr><th>Perfil</th><th>Equipamento</th><th>Grupo</th><th>Tags</th><th>Alarmes</th><th>Em uso</th></tr></thead>
        <tbody>${r.perfis.map((p) => `<tr>
          <td class="n">${esc(p.nome)}</td>
          <td>${esc(p.titulo)}${p.observacao ? `<br><span class="rotulo">${esc(p.observacao)}</span>` : ''}</td>
          <td>${esc(p.grupo || '—')}</td>
          <td class="n">${p.tags}</td>
          <td class="n">${p.alarmes}</td>
          <td class="n">${usados.get(p.nome) || 0}</td>
        </tr>`).join('')}</tbody></table>`;
    } catch (e) {
      saida.innerHTML = `<p class="vazio">${esc(e.message)}</p>`;
    }
  },

  destruir() {
    clearInterval(this._timer);
    clearInterval(this._diag);
    this._timer = null;
    this._diag = null;
    if (this._raiz) {
      if (this._aoClicar) this._raiz.removeEventListener('click', this._aoClicar);
      if (this._aoMudar) this._raiz.removeEventListener('change', this._aoMudar);
    }
    this._raiz = null;
    this._aoClicar = null;
    this._aoMudar = null;
  },
};

  montar() {

  // a raiz é a mesma a cada troca de tela: sem remover os ouvintes, voltar à

/* ---- public/assets/app.js ---- */
const CATALOGO = [telaEnergia, telaUnifilar, telaConsumo, telaAgua, telaGerador,
  telaHistorico, telaAlarmes, telaEngenharia, telaUsuarios];

// Energia e Unifilar são o esqueleto do produto e ficam sempre no menu: sem
// medidor configurado elas mostram o que falta fazer, em vez de sumir. Água e
// Gerador dependem do equipamento, porque sem reservatório ou sem grupo gerador
// não há o que desenhar. Engenharia e Usuários dependem do papel.
const EXIGE_GRUPO = { agua: 'agua', gerador: 'gerador' };
const EXIGE_SECAO = { agua: 'caixa_agua', gerador: 'gerador' };
let TELAS = [];

/**
 * Quais telas entram no menu.
 *
 * Por padrão, Água e Gerador só aparecem quando existem de verdade — loja sem
 * reservatório não precisa de uma tela de reservatório. Mas na hora de instalar
 * é o contrário: o técnico quer a tela antes do equipamento, para seguir o guia.
 * Daí o `telas` da configuração, que manda em cima da regra automática:
 *   "telas": { "gerador": true }    mostra sempre, com o guia quando faltar
 *   "telas": { "agua": false }      esconde mesmo havendo equipamento
 */
function telasDisponiveis() {
  const grupos = new Set((estado.config.equipamentos || []).map((e) => e.grupo));
  const pedido = estado.config.telas || {};
  return CATALOGO.filter((t) => {
    if (t.papel && (MODO_DEMO || !pode(t.papel))) return false;
    if (pedido[t.id] === false) return false;
    if (pedido[t.id] === true) return true;
    const grupo = EXIGE_GRUPO[t.id];
    if (grupo && !grupos.has(grupo)) return false;
    const secao = EXIGE_SECAO[t.id];
    if (secao && !estado.config[secao]) return false;
    return true;
  });
}
const GRUPO_DA_TELA = { energia: 'energia', unifilar: 'energia', agua: 'agua', gerador: 'gerador' };

let telaAtual = null;
let raiz = null;
/**
 * Sirene no padrão de anunciador, e não um bipe solto:
 *   ligado         chave do posto (botão da coluna). Desligada, nada soa.
 *   silenciadoEm   conjunto de alarmes que o operador já calou. Alarme NOVO
 *                  muda o conjunto e a sirene volta — silenciar não pode
 *                  desarmar o anunciador para o resto do turno.
 *   proximoToque   a sirene repete enquanto houver alarme não reconhecido.
 * Reconhecer também cala, porque o alarme deixa de estar pendente.
 */
let som = { ligado: true, ctx: null, silenciadoEm: '', proximoToque: 0 };

const INTERVALO_SIRENE = { alta: 3000, media: 9000, baixa: 0 };

/** Identidade do conjunto pendente: muda quando entra ou sai um alarme. */
const chaveDoConjunto = (pendentes) => pendentes.map((a) => a.id).sort().join(',');

function atualizarSirene(pendentes) {
  const chave = chaveDoConjunto(pendentes);
  if (chave !== som.silenciadoEm && som.silenciadoEm) som.silenciadoEm = '';   // entrou alarme novo
  const silenciado = som.silenciadoEm === chave && chave !== '';

  const maisGrave = pendentes.reduce((m, a) => ((PESO[a.prioridade] || 0) > (PESO[m?.prioridade] || 0) ? a : m), null);
  const intervalo = INTERVALO_SIRENE[maisGrave?.prioridade] || 0;

  if (!pendentes.length || silenciado || !som.ligado || !intervalo) {
    som.proximoToque = 0;
    return { silenciado, tocando: false };
  }
  const agora = Date.now();
  if (agora >= som.proximoToque) {
    som.proximoToque = agora + intervalo;
    apitar(maisGrave.prioridade);
  }
  return { silenciado, tocando: true };
}

function silenciar() {
  som.silenciadoEm = chaveDoConjunto((estado.dados.alarmes || []).filter((a) => !a.reconhecido));
  som.proximoToque = 0;
  desenhar();
}

/** Guarda a tela na URL. Aberto direto do disco (file://) o navegador recusa
    replaceState, e isso não pode derrubar a interface. */
function guardarNaUrl(id) {
  if (location.protocol === 'file:') return;
  if (location.hash.slice(1) === id) return;
  try {
    history.replaceState(null, '', `#${id}`);
  } catch {
    /* origem opaca ou navegação bloqueada: a tela funciona igual */
  }
}

function abrir(id) {

/* --------------------------------------------------- cabeçalho e alarmes */

const PESO = { alta: 3, media: 2, baixa: 1 };

function grupoDoAlarme(a) {
  const id = String(a.tag).split('.')[0];
  const eq = estado.config.equipamentos.find((e) => e.id === id);
  return eq?.grupo || 'energia';
}

function atualizarCabecalho() {
  const alarmes = estado.dados.alarmes || [];
  const pior = alarmes.reduce((m, a) => ((PESO[a.prioridade] || 0) > (PESO[m?.prioridade] || 0) ? a : m), null);
  const primeiro = alarmes.reduce((m, a) => (!m || a.inicio < m.inicio ? a : m), null);

  const faixa = $('#faixa-alarme');
  faixa.classList.toggle('visivel', alarmes.length > 0);
  if (alarmes.length) {
    // reconhecer não resolve o alarme: o operador diz "estou ciente" e a faixa
    // recua para um aviso discreto, mas continua ali enquanto a condição durar
    const pendentes = alarmes.filter((a) => !a.reconhecido);
    const tudoCiente = pendentes.length === 0;

    faixa.dataset.nivel = pior.prioridade;
    faixa.classList.toggle('ciente', tudoCiente);
    $('#faixa-quando').textContent = dataHora(primeiro.inicio);
    $('#faixa-msg').textContent = primeiro.mensagem;
    $('#faixa-resto').textContent = [
      alarmes.length > 1 ? `e mais ${alarmes.length - 1} ativo(s)` : '',
      tudoCiente ? '· reconhecido, aguardando normalizar' : '',
    ].filter(Boolean).join(' ');

    const btnRec = $('#faixa-reconhecer');
    btnRec.hidden = tudoCiente;
    btnRec.textContent = pendentes.length > 1 ? `Reconhecer ${pendentes.length}` : 'Reconhecer';
  } else {
    faixa.classList.remove('ciente');
  }

  const pendentesAgora = alarmes.filter((a) => !a.reconhecido);
  const sirene = atualizarSirene(pendentesAgora);
  const btnSilenciar = $('#faixa-silenciar');
  btnSilenciar.textContent = !som.ligado ? 'Som desligado'
    : sirene.silenciado ? 'Silenciado'
      : 'Silenciar';
  btnSilenciar.classList.toggle('apagado', !som.ligado || sirene.silenciado);
  btnSilenciar.disabled = !som.ligado || sirene.silenciado || !pendentesAgora.length;

  // contadores por tela
  const porGrupo = {};
  for (const a of alarmes) {
    const g = grupoDoAlarme(a);
    porGrupo[g] = (porGrupo[g] || 0) + 1;
  }
  for (const t of TELAS) {
    const el = document.querySelector(`[data-contagem="${t.id}"]`);
    if (!el) continue;
    const n = t.id === 'alarmes' ? alarmes.length : (porGrupo[GRUPO_DA_TELA[t.id]] || 0);
    el.hidden = n === 0;
    el.textContent = n;
  }

  const led = $('#led-conexao');
  led.className = `led ${!estado.conectado ? 'critico' : alarmes.some((a) => a.prioridade === 'alta') ? 'critico'
    : alarmes.length ? 'atencao' : 'ok'}`;
  $('#txt-conexao').textContent = !estado.conectado ? 'servidor fora do ar'
    : alarmes.length ? `${alarmes.length} alarme(s) ativo(s)` : 'operação normal';

}

function apitar(prioridade = 'alta') {
  if (!som.ligado || !som.ctx) return;
  const ctx = som.ctx;
  // o navegador suspende o contexto quando a aba perde o foco
  if (ctx.state === 'suspended') ctx.resume().catch(() => {});

  // alta: dois toques rápidos e agudos. média: um toque grave.
  const toques = prioridade === 'alta' ? [[0, 880], [0.18, 880]] : [[0, 520]];
  for (const [atraso, hz] of toques) {
    const t0 = ctx.currentTime + atraso;
    const osc = ctx.createOscillator();
    const ganho = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = hz;
    ganho.gain.setValueAtTime(0.0001, t0);
    ganho.gain.exponentialRampToValueAtTime(0.07, t0 + 0.02);
    ganho.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
    osc.connect(ganho).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.16);
  }
}

function desenhar() {
  atualizarCabecalho();
  aplicarVinculos();
  if (!telaAtual || !raiz) return;
  if (telaAtual.aoReceberDados) telaAtual.aoReceberDados(raiz);
  else telaAtual.atualizar?.(raiz);
}

/* ------------------------------------------------ modo demonstração local */

const pendentesDemo = new Map();
const inicioDemo = new Map();

function avaliarAlarmesDemo(equipamentos) {
  const agora = Date.now();
  const ativos = [];
  (estado.config.limites || []).forEach((r, i) => {
    const chave = `${r.tag || r.medidor}#${i}`;
    let violado = false;
    let v = null;

    if (r.comunicacao) {
      const eq = equipamentos[r.medidor];
      if (!eq) return;
      violado = !eq.online;
      v = eq.online ? 1 : 0;
    } else {
      const [id, nome] = String(r.tag).split('.');
      const eq = equipamentos[id];
      if (!eq || !eq.online) { pendentesDemo.delete(chave); inicioDemo.delete(chave); return; }
      v = eq.valores[nome];
      if (v === null || v === undefined) return;
      violado = r.digital
        ? (r.inverso ? v < 0.5 : v >= 0.5)
        : ((r.min !== undefined && v < r.min) || (r.max !== undefined && v > r.max));
    }

    if (!violado) { pendentesDemo.delete(chave); inicioDemo.delete(chave); return; }

    const desde = pendentesDemo.get(chave) ?? agora;
    pendentesDemo.set(chave, desde);
    if (agora - desde < (r.atraso_s ?? 0) * 1000) return;
    if (!inicioDemo.has(chave)) inicioDemo.set(chave, agora);

    ativos.push({
      id: i + 1,
      tag: r.tag || r.medidor,
      mensagem: r.mensagem,
      prioridade: r.prioridade || 'media',
      valor: v,
      limite: r.comunicacao ? 'sem resposta'
        : r.digital ? (r.inverso ? 'esperado ligado' : 'esperado desligado')
          : [r.min !== undefined ? `mín ${r.min}` : null, r.max !== undefined ? `máx ${r.max}` : null]
            .filter(Boolean).join(' · '),
      inicio: inicioDemo.get(chave),
      fim: null,
      reconhecido: 0,
    });
  });
  return ativos.sort((a, b) => a.inicio - b.inicio);
}

async function iniciarDemo() {
  const { CONFIG_DEMO, Simulador } = window.DEMO_RECURSOS;
  estado.config = CONFIG_DEMO;
  const sim = new Simulador(CONFIG_DEMO, { roteiro: true });
  const ciclo = async () => {
    const equipamentos = await sim.lerTodos();
    estado.dados = { ts: Date.now(), equipamentos, alarmes: avaliarAlarmesDemo(equipamentos), simulado: true };
    estado.conectado = true;
    publicar();
  };
  await ciclo();
  setInterval(ciclo, 1000);
}

/**
 * Logos: assets/marcas/cliente.(svg|png|webp) no cabeçalho e
 * assets/marcas/engemase.(...) no rodapé da coluna. O arquivo do cliente é de
 * cada instalação; o que não existir simplesmente não aparece (nada de ícone
 * de imagem quebrada). No demo, que é um arquivo só, vêm embutidos.
 */
function mostrarMarcas() {
  const embutidas = window.DEMO_RECURSOS?.MARCAS || null;
  document.querySelectorAll('img[data-marca]').forEach((img) => {
    const nome = img.dataset.marca;
    const fontes = embutidas
      ? [embutidas[nome]].filter(Boolean)
      : ['svg', 'png', 'webp'].map((x) => `assets/marcas/${nome}.${x}`);
    if (!fontes.length) return;
    let i = 0;
    img.onload = () => {
      img.hidden = false;
      const caixa = img.closest('[data-marca-caixa]');
      if (caixa) caixa.hidden = false;
    };
    img.onerror = () => { i += 1; if (i < fontes.length) img.src = fontes[i]; };
    img.src = fontes[0];
  });
}

  $('#btn-tema').addEventListener('click', () => {
    window.PulseTema?.trocar(PROXIMO_TEMA[window.PulseTema.escolha()] || 'automatico');
    rotularTema();
  });
  // os gráficos em canvas pegam as cores na hora de desenhar: remonta a tela aberta
  window.addEventListener('tema', () => {
    if (!telaAtual) return;
    const id = estado.tela;
    telaAtual.destruir?.();
    telaAtual = null;
    abrir(id);
  });

  // o navegador só libera áudio depois de um gesto do operador
  // o navegador só libera áudio depois de um gesto do operador
  const liberarSom = () => {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!som.ctx && Audio) som.ctx = new Audio();
    if (som.ctx?.state === 'suspended') som.ctx.resume().catch(() => {});
    document.removeEventListener('click', liberarSom);
    document.removeEventListener('keydown', liberarSom);
  };
  document.addEventListener('click', liberarSom);
  document.addEventListener('keydown', liberarSom);

  /**
   * Atalho de tela pelos números 1 a 9. Nunca quando o operador está digitando:
   * sem isso, teclar "1" num campo de endereço Modbus ou de senha troca a tela
   * e o que ele escreveu se perde.
   */
  const digitando = (alvo) => {
    if (!alvo || alvo === document.body) return false;
    if (alvo.isContentEditable) return true;
    return ['INPUT', 'TEXTAREA', 'SELECT', 'OPTION'].includes(alvo.tagName);
  };

  document.addEventListener('keydown', (ev) => {
    if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
    if (digitando(ev.target) || digitando(document.activeElement)) return;
    if (ev.key.length !== 1) return;
    const i = Number(ev.key);
    if (Number.isInteger(i) && i >= 1 && i <= TELAS.length) {
      ev.preventDefault();
      abrir(TELAS[i - 1].id);
    }
  });

  setInterval(() => {
    $('#relogio').textContent = dataHora(Date.now());
    // a sirene repete por conta própria: não depende de chegar pacote novo
    atualizarSirene((estado.dados.alarmes || []).filter((a) => !a.reconhecido));
  }, 1000);
  $('#relogio').textContent = dataHora(Date.now());

  const inicial = () => location.hash.slice(1) || TELAS[0]?.id;
  abrir(inicial());
  window.addEventListener('hashchange', () => abrir(inicial()));
}

function mostrarFalha(titulo, detalhe) {
  document.body.innerHTML = `<div style="padding:28px;font-family:system-ui;max-width:70ch">
    <h1 style="font-size:19px;margin:0 0 8px">${esc(titulo)}</h1>
    <pre style="white-space:pre-wrap;font-size:12px;color:#555">${esc(detalhe)}</pre>
    <p style="font-size:13px;color:#555">Recarregue a página. Se persistir, informe a mensagem acima.</p>
  </div>`;
}

window.addEventListener('error', (ev) => {
  if (!document.querySelector('#menu')?.children.length) {
    mostrarFalha('Falha ao iniciar o supervisório', ev.message || String(ev.error));
  }
});

iniciar().catch((e) => mostrarFalha('Não foi possível carregar o supervisório', e.stack || e.message));

</script>
