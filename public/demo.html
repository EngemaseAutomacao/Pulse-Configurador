  <script>
/* Tema claro ou escuro, como no Engemase Pulse. Roda no <head>, antes de
   desenhar a página, para não piscar no tema errado. A escolha fica no
   navegador ("automatico", "claro" ou "escuro"); no automático, segue o
   aparelho e acompanha quando ele troca. */
(function () {
  var raiz = document.documentElement;
  var midia = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  function escolha() {
    try { return localStorage.getItem('tema') || 'automatico'; } catch (e) { return 'automatico'; }
  }

  function aplicar() {
    var pedido = escolha();
    var escuro = pedido === 'escuro' || (pedido !== 'claro' && !!(midia && midia.matches));
    raiz.setAttribute('data-tema', escuro ? 'escuro' : 'claro');
    raiz.style.colorScheme = escuro ? 'dark' : 'light';
    try { window.dispatchEvent(new Event('tema')); } catch (e) { /* navegador antigo */ }
  }

  window.PulseTema = {
    escolha: escolha,
    trocar: function (valor) {
      try { localStorage.setItem('tema', valor); } catch (e) { /* aba privada: vale só agora */ }
      aplicar();
    },
  };

  if (midia) {
    var mudou = function () { if (escolha() === 'automatico') aplicar(); };
    if (midia.addEventListener) midia.addEventListener('change', mudou);
    else if (midia.addListener) midia.addListener(mudou);
  }
  aplicar();
})();

</script>

:root {
  /* superfícies — fundo, cartão e os dois tons de apoio */
  --painel: #f3f6f9;
  --painel-borda: #dfe5ec;
  --tela: #ffffff;
  --tela-2: #f4f7fa;
  --tela-3: #e4e9f0;
  --coluna: #ffffff;
  --coluna-borda: #e3e8ee;
  --coluna-texto: #0c2340;
  --coluna-apagado: #66728a;
  --coluna-hover: #f1f4f8;

  --tinta: #0c2340;
  --tinta-2: #526079;
  --tinta-3: #7f8a9d;
  --linha: #e3e8ee;
  --linha-forte: #c9d2dd;

  /* marca: o azul da Engemase (claro, com contraste para texto branco) */
  --primaria: #1874b3;
  --primaria-texto: #ffffff;
  --primaria-suave: rgb(24 116 179 / .10);
  --foco: rgb(24 116 179 / .45);

  /* estados — usados só quando algo foge do normal */
  --critico: #c62f35;
  --atencao: #d99000;
  --atencao-texto: #8a5c00;
  --ok: #15803d;
  --info: #0369a1;
  --critico-suave: #fbeaea;
  --atencao-suave: #fbf2df;
  --ok-suave: #e7f5ec;
  --sobre-critico: #ffffff;
  --sobre-atencao: #241a00;

  /* fases ABNT. A fase C é cinza na norma, mas num fundo claro o cinza-claro
     some: usamos um cinza escurecido, que mantém a leitura e a convenção. */
  --fase-a: #7a4a22;
  --fase-b: #2b2f2c;
  --fase-c: #5f6660;
  --neutro: #1f5c99;
  --terra: #4f7a1f;

  /* desenhos */
  --agua: #4b7fa8;
  --agua-borda: #2f5f85;
  --diesel: #8a6a2f;
  --serie: #2a78d6;
  --serie-suave: #d6e4f5;
  --banda-grafico: rgba(12, 35, 64, .12);
  --dica-fundo: #0c2340;
  --dica-texto: #f2f5f9;
  --entrada-fundo: #ffffff;
  --sombra: 0 1px 2px rgb(12 35 64 / .05), 0 6px 20px -12px rgb(12 35 64 / .18);
  --raio: 12px;
  --raio-p: 8px;

  --titulo: "Sora", "Segoe UI", system-ui, sans-serif;
  --corpo: "Manrope", "Segoe UI", system-ui, sans-serif;
  --num: "Manrope", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}

/* escuro, como o Pulse: preto, cartões grafite e o azul mais claro */
:root[data-tema="escuro"] {
  --painel: #000000;
  --painel-borda: #262626;
  --tela: #111111;
  --tela-2: #171717;
  --tela-3: #262626;
  --coluna: #0a0a0a;
  --coluna-borda: #1f1f1f;
  --coluna-texto: #f2f2f2;
  --coluna-apagado: #8c8c8c;
  --coluna-hover: #171717;

  --tinta: #f2f2f2;
  --tinta-2: #a3a3a3;
  --tinta-3: #737373;
  --linha: #262626;
  --linha-forte: #3a3a3a;

  --primaria: #4a9ee0;
  --primaria-texto: #0c2340;
  --primaria-suave: rgb(74 158 224 / .14);
  --foco: rgb(74 158 224 / .5);

  --critico: #ef4f55;
  --atencao: #f0a020;
  --atencao-texto: #f5b84a;
  --ok: #3cbf6e;
  --info: #38bdf8;
  --critico-suave: rgb(239 79 85 / .14);
  --atencao-suave: rgb(240 160 32 / .13);
  --ok-suave: rgb(60 191 110 / .12);
  --sobre-critico: #ffffff;
  --sobre-atencao: #1a1200;

  /* fase B é preta na norma: no fundo escuro ela vira cinza claro */
  --fase-a: #b07344;
  --fase-b: #d4d4d4;
  --fase-c: #8f8f8f;
  --neutro: #5a9be0;
  --terra: #7fae45;

  --agua: #3d7fb3;
  --agua-borda: #79aedb;
  --diesel: #a98443;
  --serie: #4a9ee0;
  --serie-suave: #16324d;
  --banda-grafico: rgba(242, 242, 242, .14);
  --dica-fundo: #1f1f1f;
  --dica-texto: #f2f2f2;
  --entrada-fundo: #0a0a0a;
  --sombra: 0 0 0 1px rgb(255 255 255 / .02);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--painel);
  color: var(--tinta);
  font-family: var(--corpo);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

body {
  display: grid;
  grid-template-columns: 236px 1fr;
  grid-template-rows: 100%;
}

/* ---------------------------------------------------- coluna de navegação */

.coluna {
  background: var(--coluna);
  color: var(--coluna-texto);
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--coluna-borda);
  overflow-y: auto;
}

.marca {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 16px 16px;
  border-bottom: 1px solid var(--coluna-borda);
}
.marca .marca-simbolo { width: 36px; height: 36px; flex: none; border-radius: 50%; }
.marca-texto { display: flex; flex-direction: column; min-width: 0; }
.marca b {
  display: block;
  font-family: var(--titulo);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -.01em;
  color: var(--primaria);
  white-space: nowrap;
}
.marca-texto > span {
  display: block;
  margin-top: 1px;
  font-size: 12px;
  color: var(--coluna-apagado);
}

.menu { padding: 6px 10px 10px; flex: 1; }
.menu .secao-menu {
  display: block;
  padding: 14px 8px 6px;
  font-size: 12px;
  font-weight: 500;
  color: var(--coluna-apagado);
}

.item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  border: 0;
  border-radius: var(--raio-p);
  background: transparent;
  color: var(--coluna-texto);
  padding: 8px 10px;
  margin: 1px 0;
  cursor: pointer;
  font-family: var(--corpo);
  position: relative;
}
.item:hover { background: var(--coluna-hover); }
.item[aria-current="page"] {
  background: var(--primaria-suave);
  color: var(--primaria);
}
.item[aria-current="page"]::before {
  content: "";
  position: absolute;
  left: -10px;
  top: 6px;
  bottom: 6px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--primaria);
}
.item:focus-visible { outline: 2px solid var(--foco); outline-offset: 0; }

.item .icone { width: 18px; height: 18px; flex: none; }
.item .icone svg { display: block; width: 18px; height: 18px; }
.item .rotulos { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.item .isa {
  display: block;
  order: 2;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .04em;
  color: var(--coluna-apagado);
}
.item[aria-current="page"] .isa { color: inherit; opacity: .75; }
.item .nome { font-weight: 600; font-size: 14px; }

.item .contagem {
  order: 3;
  font-family: var(--num);
  font-size: 11px;
  font-weight: 700;
  background: var(--critico);
  color: var(--sobre-critico);
  min-width: 20px;
  text-align: center;
  padding: 1px 6px;
  border-radius: 999px;
}

.rodape-coluna {
  padding: 12px 16px 14px;
  border-top: 1px solid var(--coluna-borda);
  font-size: 12px;
  color: var(--coluna-apagado);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.rodape-coluna .linha-estado { display: flex; align-items: center; gap: 7px; }
.rodape-coluna .usuario { color: var(--coluna-texto); font-size: 12.5px; font-weight: 500; }
.botao.escuro { background: transparent; color: var(--coluna-texto); border-color: var(--coluna-borda); text-align: left; }
.botao.escuro:hover { background: var(--coluna-hover); }

/* logos — placa branca: a marca do cliente e a da Engemase têm cores próprias
   e somem num fundo escuro */
.assinatura { margin-top: 6px; background: #ffffff; border: 1px solid var(--coluna-borda); border-radius: var(--raio-p);
              padding: 7px 10px 8px; display: flex; flex-direction: column; gap: 4px; }
.assinatura span { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: #5b6475; }
.assinatura img { display: block; height: 36px; width: auto; max-width: 100%; object-fit: contain; object-position: left center; }
.cabecalho .logo-cliente { height: 34px; width: auto; max-width: 220px; object-fit: contain; flex: none; }
:root[data-tema="escuro"] .cabecalho .logo-cliente { background: #ffffff; border-radius: var(--raio-p); padding: 4px 8px; }

/* ------------------------------------------------------------- área útil */

.area { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

.cabecalho {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 24px 14px;
  background: var(--painel);
  border-bottom: 1px solid var(--painel-borda);
}
.cabecalho h1 {
  margin: 0;
  font-family: var(--titulo);
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -.01em;
}
.cabecalho .isa {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--tinta-2);
  border: 1px solid var(--linha-forte);
  padding: 2px 8px;
  border-radius: 999px;
}
.cabecalho .relogio {
  margin-left: auto;
  font-family: var(--num);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  color: var(--tinta-2);
  white-space: nowrap;
}

/* faixa de alarme — a única coisa que grita na tela */
.faixa-alarme {
  display: none;
  align-items: center;
  gap: 12px;
  padding: 10px 24px;
  background: var(--critico);
  color: var(--sobre-critico);
  font-size: 13px;
}
.faixa-alarme[data-nivel="media"] { background: var(--atencao); color: var(--sobre-atencao); }
.faixa-alarme[data-nivel="baixa"] { background: var(--info); color: #fff; }
.faixa-alarme.visivel { display: flex; }
.faixa-alarme .quando { font-family: var(--num); font-size: 12px; opacity: .85; }
.faixa-alarme .msg { font-weight: 700; }
.faixa-alarme .resto { opacity: .85; }
.faixa-alarme .acoes { margin-left: auto; display: flex; gap: 8px; }
.faixa-alarme button {
  background: rgba(255,255,255,.16);
  border: 1px solid rgba(255,255,255,.5);
  color: inherit;
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: var(--raio-p);
  cursor: pointer;
}
.faixa-alarme button:hover { background: rgba(255,255,255,.28); }
.faixa-alarme button.apagado { opacity: .6; }
.faixa-alarme button[disabled] { opacity: .45; cursor: default; }
/* enquanto não reconhecido, o marcador pulsa: é o que chama o operador de longe */
.faixa-alarme:not(.ciente) .msg::before {
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 8px;
  border-radius: 50%;
  background: currentColor;
  animation: pulsar 1.1s steps(2, end) infinite;
  vertical-align: baseline;
}
@media (prefers-reduced-motion: reduce) {
  .faixa-alarme:not(.ciente) .msg::before { animation: none; }
}

/* reconhecido: a faixa deixa de gritar mas não some — a condição continua lá */
.faixa-alarme.ciente {
  background: var(--tela-2);
  color: var(--tinta);
  border-bottom: 1px solid var(--linha);
  box-shadow: inset 4px 0 0 var(--critico);
}
.faixa-alarme.ciente[data-nivel="media"] { box-shadow: inset 4px 0 0 var(--atencao); }
.faixa-alarme.ciente[data-nivel="baixa"] { box-shadow: inset 4px 0 0 var(--info); }
.faixa-alarme.ciente button {
  background: transparent;
  border-color: var(--linha-forte);
  color: var(--tinta-2);
}
.faixa-alarme.ciente button:hover { background: var(--tela-3); }

.faixa-sim {
  padding: 7px 24px;
  background: var(--atencao-suave);
  border-bottom: 1px solid var(--linha);
  font-size: 12px;
  font-weight: 600;
  color: var(--atencao-texto);
}

.tela { padding: 22px 24px 28px; overflow-y: auto; flex: 1; }
.tela > * + * { margin-top: 16px; }

/* --------------------------------------------- cabeçalho de cada cartão
   Antes era a "placa de acrílico" com parafusos; agora é o título do
   cartão, como no Pulse: nome em destaque, a TAG ISA discreta ao lado. */

.placa {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 46px;
  background: transparent;
  color: var(--tinta);
  padding: 12px 16px 6px;
  position: relative;
}
.placa .isa {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--tinta-3);
  order: 2;
}
.placa .titulo {
  font-family: var(--titulo);
  font-weight: 600;
  font-size: 16px;
  letter-spacing: -.005em;
  white-space: nowrap;
}
.placa .estado {
  order: 3;
  margin-left: auto;
  white-space: nowrap;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ok);
  background: var(--ok-suave);
  padding: 2px 9px;
  border-radius: 999px;
}
.placa .estado.ruim { color: var(--critico); background: var(--critico-suave); }

/* ------------------------------------------------------------- instrumentos */

.bloco {
  background: var(--tela);
  border: 1px solid var(--linha);
  border-radius: var(--raio);
  box-shadow: var(--sombra);
  overflow: hidden;
}
.bloco > .corpo { padding: 10px 16px 16px; }

.grade { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grade.dupla { grid-template-columns: minmax(340px, 1fr) minmax(340px, 1.2fr); }
.largura-total { grid-column: 1 / -1; }

.leituras {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  border-top: 1px solid var(--linha);
  border-left: 1px solid var(--linha);
  border-radius: var(--raio-p);
  overflow: hidden;
}
.leitura {
  background: var(--tela);
  padding: 9px 11px 10px;
  border-right: 1px solid var(--linha);
  border-bottom: 1px solid var(--linha);
  border-left: 3px solid transparent;
}
.leitura[data-fase="a"] { border-left-color: var(--fase-a); }
.leitura[data-fase="b"] { border-left-color: var(--fase-b); }
.leitura[data-fase="c"] { border-left-color: var(--fase-c); }
.leitura[data-fase="n"] { border-left-color: var(--neutro); }
.leitura.anormal { background: var(--critico-suave); border-left-color: var(--critico); }

.rotulo {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--tinta-2);
  margin-bottom: 5px;
}
.valor {
  font-family: var(--num);
  font-size: 26px;
  font-weight: 600;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.005em;
}
.valor.g { font-size: 42px; font-weight: 700; letter-spacing: -.015em; }
.valor .un { font-size: 12px; color: var(--tinta-2); margin-left: 4px; letter-spacing: 0; }
.valor.sem-dado { color: var(--tinta-3); }
.leitura.anormal .valor { color: var(--critico); }

/* escala com marcas de limite — mostra onde o valor está dentro da faixa */
.escala { margin-top: 8px; }
.escala .trilho {
  position: relative;
  height: 8px;
  background: var(--tela-3);
  border-radius: 999px;
}
.escala .barra { position: absolute; inset: 0 auto 0 0; background: var(--tinta-2); border-radius: 999px; transition: width .5s ease; }
.escala .barra.atencao { background: var(--atencao); }
.escala .barra.critico { background: var(--critico); }
/* marca de limite na régua. Nome próprio: ".marca" já é a logomarca da coluna,
   e o padding dela virava um bloco de 33 px em cima da régua. */
.escala .limite {
  position: absolute;
  top: -3px;
  bottom: -3px;
  width: 2px;
  margin: 0;
  padding: 0;
  background: var(--tinta);
  border-radius: 1px;
}
.escala .limite.atencao { background: var(--atencao); }
.escala .limite.critico { background: var(--critico); }
.escala .extremos {
  display: flex;
  justify-content: space-between;
  font-family: var(--num);
  font-size: 10px;
  color: var(--tinta-3);
  margin-top: 3px;
}

/* barras de fase */
.barras { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.barra-fase { display: grid; grid-template-columns: 20px 1fr 66px; align-items: center; gap: 10px; font-size: 11px; }
.barra-fase .id { font-family: var(--mono); color: var(--tinta-2); }
.barra-fase .trilho {
  display: block;
  height: 8px;
  background: var(--tela-3);
  border-radius: 999px;
  overflow: hidden;
}
.barra-fase .fill { display: block; height: 100%; width: 0; border-radius: 999px; transition: width .5s ease; }
.barra-fase .medida { font-family: var(--num); text-align: right; font-variant-numeric: tabular-nums; }

/* ------------------------------------------------- anunciador de falhas (gerador) */

.anunciador {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(178px, 1fr));
  gap: 8px;
}
.janela {
  position: relative;
  background: var(--tela-2);
  border: 1px solid var(--linha);
  border-radius: var(--raio-p);
  padding: 11px 12px 11px 30px;
  font-size: 12px;
  line-height: 1.25;
  color: var(--tinta-2);
  min-height: 52px;
  display: flex;
  align-items: center;
}
.janela::before {
  content: "";
  position: absolute;
  left: 11px;
  top: 50%;
  margin-top: -5px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--tela-3);
  box-shadow: inset 0 1px 2px #0003;
}
.janela.ativa {
  background: var(--critico);
  border-color: var(--critico);
  color: var(--sobre-critico);
  font-weight: 600;
  animation: piscar-janela 1.1s steps(2, end) 6;
}
.janela.ativa::before { background: #fff; box-shadow: 0 0 7px #fff9; }
.janela.ativa[data-prioridade="media"] { background: var(--atencao); border-color: var(--atencao); color: var(--sobre-atencao); }
/* estado de operação normal (bomba ligada, disjuntor fechado): acende, não alarma */
.janela.ativa[data-prioridade="info"] {
  background: var(--ok);
  border-color: var(--ok);
  color: #fff;
  animation: none;
}
.janela.primeira::after {
  content: "1ª";
  position: absolute;
  right: 8px;
  top: 6px;
  font-family: var(--num);
  font-size: 10px;
  opacity: .8;
}
@keyframes piscar-janela { 50% { filter: brightness(.62); } }

/* ------------------------------------------------------------ indicadores */

.led { width: 9px; height: 9px; border-radius: 50%; background: var(--tinta-3); flex: 0 0 auto; }
.led.ok { background: var(--ok); }
.led.atencao { background: var(--atencao); }
.led.critico { background: var(--critico); animation: pulsar 1.1s steps(2, end) infinite; }
@keyframes pulsar { 50% { opacity: .3; } }

.selo {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 9px;
  border: 1px solid;
  border-radius: 999px;
}
.selo.alta { color: var(--critico); border-color: var(--critico); }
.selo.media { color: var(--atencao-texto); border-color: var(--atencao); }
.selo.baixa { color: var(--info); border-color: var(--info); }
.selo.ok { color: var(--ok); border-color: var(--ok); }

.dados-linha { display: flex; flex-wrap: wrap; gap: 22px; }
.dado .rotulo { margin-bottom: 3px; }
.dado .n { font-family: var(--num); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------- desenhos SVG */

.rolagem { overflow-x: auto; }
.desenho { width: 100%; display: block; }
.desenho text { fill: var(--tinta); font-family: var(--corpo); font-size: 11px; }
.desenho .rot { fill: var(--tinta-2); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }
.desenho .simbolo { fill: var(--tinta-2); font-family: var(--mono); font-size: 10px; }
.desenho .num { font-family: var(--num); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.desenho .caixa { fill: var(--tela-2); stroke: var(--linha-forte); stroke-width: 1; }
.desenho .cond { stroke: var(--linha-forte); stroke-width: 2; fill: none; }
.desenho .cond.energizado { stroke: var(--tinta); }
.desenho .cond.atencao-carga { stroke: var(--atencao); }
.desenho .cond.sobrecarga { stroke: var(--critico); stroke-width: 3; }
.desenho .fluxo {
  stroke: var(--tinta); stroke-width: 2; stroke-dasharray: 5 9; fill: none;
  opacity: .75; animation: correr 1.6s linear infinite;
}
.desenho .fluxo.atencao-carga { stroke: var(--atencao); }
.desenho .fluxo.sobrecarga { stroke: var(--critico); }
@keyframes correr { to { stroke-dashoffset: -28; } }
.desenho .barra-geral { stroke: var(--tinta); stroke-width: 5; stroke-linecap: square; }
.desenho .trilho-svg { fill: var(--tela-3); stroke: var(--linha-forte); stroke-width: 1; }
.desenho .led-svg { stroke: #0003; stroke-width: 1; }
.desenho .f-a { fill: var(--fase-a); }
.desenho .f-b { fill: var(--fase-b); }
.desenho .f-c { fill: var(--fase-c); }
.desenho .alerta { fill: var(--critico); }
.desenho .cota { stroke: var(--tinta-3); stroke-width: .8; fill: none; }
.desenho .agua { fill: var(--agua); }
/* a parede do tanque não pode ter preenchimento: pintaria por cima da água */
.desenho .parede { fill: none; stroke: var(--linha-forte); stroke-width: 1.5; }
.desenho .parede-interna { fill: none; stroke: var(--linha); stroke-width: 1; }
.desenho .valor-desenho {
  font-family: var(--num);
  font-weight: 700;
  font-size: 30px;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.015em;
  fill: var(--tinta);
}
.desenho .valor-desenho.alerta { fill: var(--critico); }
.desenho .agua-topo { stroke: var(--agua-borda); stroke-width: 1.5; fill: none; }
.desenho .diesel { fill: var(--diesel); }

@media (prefers-reduced-motion: reduce) {
  .desenho .fluxo, .led.critico, .janela.ativa { animation: none; }
}

/* ----------------------------------------------------------------- controles */

.entrada {
  font-family: var(--mono);
  font-size: 12px;
  padding: 7px 9px;
  background: var(--entrada-fundo);
  color: var(--tinta);
  border: 1px solid var(--linha-forte);
  border-radius: var(--raio-p);
}
.entrada:focus-visible { outline: 3px solid var(--foco); outline-offset: 0; border-color: var(--primaria); }
.controles label.rotulo { display: inline-flex; align-items: center; gap: 6px; margin: 0; }
code { font-family: var(--mono); font-size: .92em; background: var(--tela-3); padding: 1px 5px; border-radius: 4px; }

select, .botao {
  font-family: var(--corpo);
  font-size: 12.5px;
  font-weight: 600;
  background: var(--tela);
  color: var(--tinta);
  border: 1px solid var(--linha-forte);
  border-radius: var(--raio-p);
  padding: 7px 12px;
  cursor: pointer;
}
select { background: var(--entrada-fundo); font-weight: 500; }
.botao:hover { background: var(--tela-2); }
select:focus-visible, .botao:focus-visible { outline: 3px solid var(--foco); outline-offset: 0; }
/* seletor segmentado, como o "24 h · 7 dias · 30 dias" do Pulse */
.grupo-botoes { display: inline-flex; padding: 3px; gap: 2px; background: var(--tela); border: 1px solid var(--linha); border-radius: var(--raio); }
.grupo-botoes .botao { border: 0; background: transparent; color: var(--tinta-2); }
.grupo-botoes .botao:hover { background: var(--tela-2); color: var(--tinta); }
.grupo-botoes .botao[aria-pressed="true"] { background: var(--primaria); color: var(--primaria-texto); }

.controles { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
canvas { width: 100%; height: 320px; display: block; }

/* Histórico: comparação de várias grandezas */
.hist-series { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; min-height: 32px; }
.hist-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--tela); border: 1px solid var(--linha);
             border-radius: 999px; padding: 4px 4px 4px 12px; font-size: 13px; max-width: 100%; }
.hist-chip > i { width: 14px; height: 4px; flex: none; }
.hist-chip b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist-chip-num { color: var(--tinta-2, #4a514b); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12px; }
.hist-tirar { border: 0; background: none; font-size: 18px; line-height: 1; padding: 2px 8px; cursor: pointer; color: inherit; }
.hist-tirar { border-radius: 999px; }
.hist-tirar:hover, .hist-tirar:focus-visible { background: var(--tela-3); color: var(--tinta); }
.hist-paineis { position: relative; display: grid; gap: 6px; }
.hist-area { position: relative; }
.hist-cruz { position: absolute; top: 12px; bottom: 24px; width: 1px; background: var(--tinta-2); pointer-events: none; }
.hist-dica { position: absolute; z-index: 5; background: var(--dica-fundo); color: var(--dica-texto); padding: 8px 10px; font-size: 12px;
             border-radius: var(--raio-p); pointer-events: none; min-width: 200px; max-width: 320px; box-shadow: 0 6px 18px rgba(0, 0, 0, .25); }
.hist-dica > div { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
.hist-dica i { width: 10px; height: 3px; flex: none; }
.hist-dica b { margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hist-dica-hora { opacity: .7; margin-bottom: 4px; }
@media (max-width: 640px) {
  .hist-chip { flex-wrap: wrap; }
  .hist-chip-num { white-space: normal; }
}

/* ----------------------------------------------------------- indicadores
   Mosaico de números do período. Segue a mesma regra do resto da interface:
   o número é escuro em operação normal e só ganha cor quando sai do alvo. */
/* flex, e não grid: assim as fichas da última fileira se esticam e preenchem a
   largura, em vez de deixar um vão cinza do lado */
.indicadores {
  display: flex;
  flex-wrap: wrap;

/* ------------------------------------------------------------ consumo

.cons-cabecalho { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 4px; }

  <div class="area">
    <header class="cabecalho">
      <h1 id="titulo-tela">Energia</h1>
      <span class="isa" id="isa-tela"></span>
      <span class="relogio"><span id="planta">—</span> · <span id="relogio">––</span></span>

    </header>

      </span>

      Modo simulado — valores gerados pelo servidor, sem leitura dos equipamentos
    </div>

  <script>
/**
 * Simulador de planta para o modo --sem-modbus.
 * Reproduz energia, caixa d'água e grupo gerador com comportamento plausível,
 * incluindo partida do gerador e ciclo de recalque, para validar telas e alarmes.
 */

// Quanto do disjuntor cada circuito usa no pico do dia
const USO_DO_DISJUNTOR = {
  padaria: 0.30, acougue: 0.35, frios: 0.42, refrigerados: 0.78,
  congelados: 0.42, climatizacao: 0.38, iluminacao: 0.35, carregadores: 0.18,
};
const COM_COMPRESSOR = ['frios', 'refrigerados', 'congelados', 'climatizacao'];
// THD de corrente típico de cada carga (%): inversores e fontes chaveadas poluem mais
const THD_DO_SETOR = {
  padaria: 9, acougue: 7, frios: 14, refrigerados: 12,
  congelados: 13, climatizacao: 32, iluminacao: 22, carregadores: 38,
};
// mesma conta de src/derivadas.js (derivarHarmonicas), repetida pelo mesmo motivo
// de palavrasDeclaradas abaixo
const harmonica = (i, thd) => (Math.abs(i) * (thd / 100)) / Math.sqrt(1 + (thd / 100) ** 2);
function preencherHarmonicas(v) {
  const fases = [['a', 'thd_corrente'], ['b', 'thd_corrente_b'], ['c', 'thd_corrente_c']];
  const maiores = [];
  for (const [f, tagThd] of fases) {
    if (!(`corrente_harmonica_${f}` in v)) continue;
    const i = v[`corrente_${f}`];
    const thd = v[tagThd];
    v[`corrente_harmonica_${f}`] = i === undefined || thd === undefined ? null : harmonica(i, thd);
    if (v[`corrente_harmonica_${f}`] !== null) maiores.push(v[`corrente_harmonica_${f}`]);
  }
  if ('corrente_harmonica' in v) v.corrente_harmonica = maiores.length ? Math.max(...maiores) : null;
}

const entre = (v, min, max) => Math.min(max, Math.max(min, v));

// mesma regra de src/comandos.js (palavrasDoComando). Repetida aqui porque este
// arquivo também roda no demo.html, como script clássico, sem import
const palavrasDeclaradas = (c) => (Array.isArray(c.valores) ? c.valores
  : c.complemento ? [c.valor, (~c.valor) & 0xffff] : [c.valor]);

class Simulador {
  /**
   * @param {object} config
   * @param {{roteiro?: boolean}} opcoes  roteiro: encena ocorrências para
   *        demonstração (nível baixo, diesel na reserva, falha no gerador).
   *        Não usar em comissionamento: mascara o comportamento real.
   */
  constructor(config, opcoes = {}) {
    this.config = config;
    this.roteiro = !!opcoes.roteiro;
    // no servidor a lista vem como "medidores"; na configuração pública
    // entregue ao navegador ela se chama "equipamentos"
    this.lista = config.medidores ?? config.equipamentos ?? [];
    this.t = Math.floor(Math.random() * 200);
    this.energias = {};
    this.disjuntores = Object.fromEntries(
      (config.unifilar?.saidas || []).map((s) => [s.medidor, parseFloat(s.disjuntor) || 100]),
    );
    // estado interno das utilidades
    this.agua = { nivel: 25 + Math.random() * 65, bomba: false, horas: 4820 };
    // estado do disjuntor, que os comandos mudam de verdade em bancada
    this.disjuntor = { ligado: true, remoto: true, falha: false };
    // estado dos digitais que o operador consegue mudar por comando
    this.estadoDigital = { disjuntor_ligado: true };
    // causa do último disparo e permissivo do relé, para exercitar o
    // religamento seletivo: 2 = sobretensão (religável), 1 = sobrecorrente (não)
    this.protecao = { causa: 0, permite_religar: true };
    this.diesel = { nivel: 30 + Math.random() * 55, horimetro: 312 };
    if (this.roteiro) {
      this.agua.nivel = 26;      // logo abaixo do limite de nível baixo
      this.diesel.nivel = 38;    // abaixo da reserva operacional
    }
  }

  async lerTodos() {
    this.t += 1;
    const t = this.t;
    const carga = 0.62 + 0.18 * Math.sin(t / 180) + 0.05 * Math.sin(t / 23);
    const normalizada = Math.min(1, carga / 0.85);

    const saida = {};
    const principal = this.lista.find((m) => m.principal) || this.lista[0];

    for (const m of this.lista) {
      // o CLP da subestação (disjuntor) usa o mesmo painel simulado do CLP
      // de utilidades: a simulação devolve só as tags que ele tem mapeadas
      const valores = m.grupo === 'agua' || m.grupo === 'subestacao' ? this.simularAgua(m)
        : m.grupo === 'gerador' ? this.simularGerador(m, carga)
          : this.simularEnergia(m, m.id === principal.id, normalizada, t);
      saida[m.id] = {
        id: m.id, nome: m.nome, tag_isa: m.tag_isa || null, grupo: m.grupo || 'energia',
        online: true, erro: null, lidoEm: Date.now(), valores,
      };
    }

    this.fecharEntrada(saida, principal.id);
    return saida;
  }

  simularEnergia(m, ehGeral, normalizada, t) {
    const ruido = (a) => (Math.random() - 0.5) * a;
    const ciclo = COM_COMPRESSOR.includes(m.id)
      ? 0.78 + 0.22 * Math.sign(Math.sin(t / 40 + m.id.length))
      : 1;
    const nominal = this.disjuntores[m.id] || 100;
    const corrente = ehGeral ? 0 : nominal * (USO_DO_DISJUNTOR[m.id] ?? 0.35) * normalizada * ciclo;
    const potencia = (Math.sqrt(3) * 380 * corrente * 0.94) / 1000;
    const valores = {};

    for (const tag of m.tags) {
      switch (tag.nome) {
        case 'tensao_an': valores[tag.nome] = 220.5 + ruido(2.4); break;
        case 'tensao_bn': valores[tag.nome] = 219.2 + ruido(2.4); break;
        case 'tensao_cn': valores[tag.nome] = 221.8 + ruido(2.4); break;
        case 'tensao_ab': valores[tag.nome] = 381.4 + ruido(3); break;
        case 'tensao_bc': valores[tag.nome] = 379.8 + ruido(3); break;
        case 'tensao_ca': valores[tag.nome] = 382.1 + ruido(3); break;
        case 'corrente_a': valores[tag.nome] = corrente + ruido(4); break;
        case 'corrente_b': valores[tag.nome] = corrente * 0.94 + ruido(4); break;
        case 'corrente_c': valores[tag.nome] = corrente * 1.05 + ruido(4); break;
        case 'corrente_n': valores[tag.nome] = corrente * 0.09 + ruido(2); break;
        case 'potencia_ativa': valores[tag.nome] = potencia; break;
        case 'potencia_reativa': valores[tag.nome] = potencia * 0.34; break;
        case 'potencia_aparente': valores[tag.nome] = potencia * 1.06; break;
        // o FP passeia em torno do limite contratual: exercita alarme e normalização
        case 'fp': valores[tag.nome] = 0.929 + 0.021 * Math.sin(t / 45) + ruido(0.006); break;
        case 'frequencia': valores[tag.nome] = 60 + ruido(0.06); break;
        case 'demanda': valores[tag.nome] = potencia * 0.97; break;
        case 'thd_tensao': valores[tag.nome] = 3.4 + ruido(1.2); break;
        case 'thd_tensao_b': valores[tag.nome] = 3.1 + ruido(1.2); break;
        case 'thd_tensao_c': valores[tag.nome] = 3.7 + ruido(1.2); break;
        case 'thd_corrente': valores[tag.nome] = (THD_DO_SETOR[m.id] ?? 7.8) + ruido(2.4); break;
        case 'thd_corrente_b': valores[tag.nome] = (THD_DO_SETOR[m.id] ?? 7.8) * 0.9 + ruido(2.4); break;
        case 'thd_corrente_c': valores[tag.nome] = (THD_DO_SETOR[m.id] ?? 7.8) * 1.1 + ruido(2.4); break;
        case 'corrente_harmonica':
        case 'corrente_harmonica_a':
        case 'corrente_harmonica_b':
        case 'corrente_harmonica_c': valores[tag.nome] = null; break;   // preenchidas no fim
        case 'sequencia_fase': valores[tag.nome] = 0; break;
        case 'energia_ativa':
        case 'energia_reativa':
        case 'energia_aparente': {
          const chave = `${m.id}.${tag.nome}`;
          // aparente = ativa / FP (~0,94); reativa ≈ 34 % da ativa
          const fator = { energia_ativa: 1, energia_reativa: 0.34, energia_aparente: 1.06 }[tag.nome];
          const inicial = ehGeral ? { energia_ativa: 128450, energia_reativa: 41200, energia_aparente: 136160 }[tag.nome] : 12800 * fator;
          const incremento = (potencia * fator) / 3600;
          this.energias[chave] = (this.energias[chave] ?? inicial) + incremento;
          valores[tag.nome] = this.energias[chave];
          break;
        }
        default: valores[tag.nome] = 0;
      }
    }
    preencherHarmonicas(valores);
    return valores;
  }

  /** Caixa d'água: consumo contínuo e bomba de recalque em automático. */
  simularAgua(m) {
    const a = this.agua;
    // proteção disparada abre o disjuntor, como no equipamento real
    if (this.roteiro && this.t % 300 >= 240 && this.t % 300 < 270) {
      this.disjuntor.ligado = false;
      this.estadoDigital.disjuntor_ligado = false;
      // alterna a causa entre religável e não religável, para a tela mostrar
      // os dois comportamentos ao longo da demonstração
      const religavel = Math.floor(this.t / 300) % 2 === 0;
      this.protecao.causa = religavel ? 2 : 1;
      this.protecao.permite_religar = religavel;
    }
    // no roteiro o ciclo é acelerado e trabalha em torno do limite de nível baixo
    const ritmo = this.roteiro ? 4 : 1;
    const liga = this.roteiro ? 24 : 60;
    const desliga = this.roteiro ? 60 : 97;
    const consumo = (0.030 + Math.random() * 0.012) * ritmo;   // %/s
    const recalque = 0.115 * ritmo;                            // %/s com a bomba ligada
    if (a.nivel < liga) a.bomba = true;
    if (a.nivel >= desliga) a.bomba = false;
    a.nivel = entre(a.nivel - consumo + (a.bomba ? recalque : 0), 0, 100);
    if (a.bomba) a.horas += 1 / 3600;

    const cap = this.config.caixa_agua?.capacidade_litros ?? 20000;
    const altura = this.config.caixa_agua?.altura_util_m ?? 2.5;

    // a leitura bruta é obtida invertendo a escala da própria tag configurada,
    // para o simulador acompanhar qualquer sensor sem código novo
    const tagNivel = (m?.tags || []).find((t) => t.nome === 'nivel');
    const escala = tagNivel?.escala ?? 1;
    const offset = tagNivel?.offset ?? 0;

    const candidatos = {
      nivel: a.nivel,
      nivel_bruto: Math.round((a.nivel - offset) / (escala || 1)),
      coluna: (a.nivel / 100) * altura,
      vazao_entrada: a.bomba ? 18 + Math.random() * 1.5 : 0,
      pressao_recalque: a.bomba ? 32 + Math.random() * 2 : 1.2,
      horas_bomba: Math.floor(a.horas),
      volume_litros: (a.nivel / 100) * cap,
      status: 0,
      bomba_ligada: a.bomba ? 1 : 0,
      bomba_falha: 0,
      boia_baixo: a.nivel < 12 ? 1 : 0,
      boia_alto: a.nivel > 98 ? 1 : 0,
      sensor_falha: 0,
      modo_automatico: 1,
      // painel de disjuntor (CLP FX3U). O estado responde aos comandos; no
      // roteiro a proteção ainda dispara sozinha por um trecho, para mostrar
      // o intertravamento recusando o religamento.
      disjuntor_ligado: this.estadoDigital.disjuntor_ligado ? 1 : 0,
      disjuntor_falha: (this.roteiro && this.t % 300 >= 240 && this.t % 300 < 270) || this.disjuntor.falha ? 1 : 0,
      modo_remoto: this.disjuntor.remoto ? 1 : 0,
      // permissivo vindo do contato do relé, e o código da causa do disparo:
      // é o par que sustenta o religamento seletivo por tipo de falta
      permite_religar: this.protecao.permite_religar ? 1 : 0,
      causa_disparo: this.protecao.causa,
      saida_y0: a.bomba ? 1 : 0,
      saida_y1: a.nivel > 50 ? 1 : 0,
    };

    // devolve só o que o equipamento realmente tem mapeado
    const valores = {};
    for (const tag of m?.tags || []) {
      if (tag.calculada) continue;          // quem preenche é o motor de indicadores
      valores[tag.nome] = candidatos[tag.nome] ?? 0;
    }
    return (m?.tags?.length) ? valores : candidatos;
  }

  /**
   * Grupo gerador. A cada 4 min de simulação a rede "cai" e o grupo cumpre o
   * ciclo completo: partida, assunção de carga, retorno da rede e resfriamento.
   */
  simularGerador(m, carga) {
    const fase = this.t % 240;
    // um ciclo em cada dois é teste semanal com a rede presente: o supervisório
    // precisa distinguir partida por queda de rede de partida por exercício
    const ciclo = Math.floor(this.t / 240);
    const ensaio = ciclo % 2 === 1;
    const redeCaiu = !ensaio && fase >= 180 && fase < 232;
    let estado = 0;              // 0 parado 1 pré-aquecendo 2 partindo 3 em carga 4 resfriando 5 falha
    if (fase >= 180 && fase < 184) estado = 1;
    else if (fase >= 184 && fase < 190) estado = 2;
    else if (fase >= 190 && fase < 226) estado = 3;
    else if (fase >= 226 && fase < 232) estado = 4;

    // roteiro: durante a carga o motor perde pressão de óleo e o grupo desarma.
    // Desarmado, ele fica em falha até o fim da janela — grupo que disparou não
    // volta sozinho para a carga, e o supervisório precisa ver isso assim.
    const desarme = this.roteiro && fase >= 206 && fase < 232;
    if (desarme) estado = 5;
    const rodando = (estado >= 2 && estado <= 4);
    const emCarga = estado === 3;
    const ruido = (a) => (Math.random() - 0.5) * a;
    const nominal = this.config.gerador?.potencia_nominal_kw ?? 180;
    const potencia = emCarga ? nominal * (0.45 + 0.25 * carga) : 0;

    if (rodando) {
      this.diesel.horimetro += 1 / 3600;
      const consumo = this.config.gerador?.consumo_litros_hora ?? 38;
      const tanque = this.config.gerador?.capacidade_tanque_litros ?? 500;
      this.diesel.nivel = entre(this.diesel.nivel - (consumo / tanque) * 100 / 3600, 0, 100);
    }
    const nivel = this.diesel.nivel;

    return {
      tensao_ab: emCarga ? 380 + ruido(4) : 0,
      tensao_bc: emCarga ? 379 + ruido(4) : 0,
      tensao_ca: emCarga ? 381 + ruido(4) : 0,
      corrente_a: emCarga ? (potencia * 1000) / (Math.sqrt(3) * 380 * 0.9) + ruido(6) : 0,
      corrente_b: emCarga ? (potencia * 1000) / (Math.sqrt(3) * 380 * 0.9) * 0.97 + ruido(6) : 0,
      corrente_c: emCarga ? (potencia * 1000) / (Math.sqrt(3) * 380 * 0.9) * 1.03 + ruido(6) : 0,
      frequencia: rodando ? (estado === 2 ? 30 + ruido(8) : 60 + ruido(0.2)) : 0,
      potencia,
      rotacao: rodando ? (estado === 2 ? 900 + ruido(200) : 1800 + ruido(12)) : 0,
      tensao_bateria: this.tensaoDaBateria(estado, ruido),
      pressao_oleo: rodando ? 4.2 + ruido(0.4) : 0,
      temperatura: rodando ? entre(60 + (fase - 184) * 0.7, 40, 88) + ruido(2) : 28 + ruido(2),
      nivel_diesel: nivel,
      horimetro: Math.floor(this.diesel.horimetro),
      estado,
      // código de modo do controlador configurado (genérico: 2 = teste; DSE: 3)
      modo: ensaio && fase >= 178 && fase < 234
        ? (this.config.gerador?.modos_teste?.[0] ?? 2)
        : (this.config.gerador?.modo_automatico ?? 1),
      disjuntor_fechado: emCarga ? 1 : 0,
      rede_presente: redeCaiu ? 0 : 1,
      falha_partida: 0,
      falha_sobrevelocidade: 0,
      falha_pressao_oleo: desarme ? 1 : 0,
      falha_temperatura: 0,
      falha_bateria: 0,
      falha_combustivel: nivel < 25 ? 1 : 0,
      falha_emergencia: 0,
      falha_carregador: 0,
      falha_sobrecarga: 0,
      falha_tensao: 0,
    };
  }

  /**
   * Tensão da bateria. O detalhe que importa é o arranque: o motor de partida
   * puxa centenas de ampères e a tensão despenca por alguns segundos. A
   * profundidade dessa queda é o que denuncia bateria no fim da vida, então a
   * simulação precisa reproduzi-la — sem isso o indicador não teria o que medir.
   *   parado com carregador bom  ~26,9 V
   *   arranque                   ~20,5 V (e pior a cada corrida, no roteiro)
   *   rodando, alternador        ~27,5 V
   */
  tensaoDaBateria(estado, ruido) {
    if (estado === 2) {
      const desgaste = this.roteiro ? Math.min(3.2, Math.floor(this.t / 240) * 0.45) : 0;
      return 20.5 - desgaste + ruido(0.4);
    }
    // no pré-aquecimento o motor ainda não gira: quem segura a tensão é o carregador
    if (estado >= 2 && estado <= 4) return 27.5 + ruido(0.2);
    return 26.9 + ruido(0.15);
  }

  /** A entrada geral tem que fechar com a soma dos alimentadores. */
  fecharEntrada(saida, idGeral) {
    const g = saida[idGeral];
    if (!g) return;
    const alimentadores = Object.values(saida).filter((x) => x.grupo === 'energia' && x.id !== idGeral);
    if (!alimentadores.length) return;
    const soma = (campo) => alimentadores.reduce((s, x) => s + (x.valores[campo] || 0), 0);

    for (const fase of ['corrente_a', 'corrente_b', 'corrente_c']) {
      if (g.valores[fase] !== undefined) g.valores[fase] = soma(fase);
    }
    const P = soma('potencia_ativa');
    const fp = g.valores.fp ?? 0.94;
    if (g.valores.potencia_ativa !== undefined) g.valores.potencia_ativa = P;
    if (g.valores.potencia_aparente !== undefined) g.valores.potencia_aparente = P / fp;
    if (g.valores.potencia_reativa !== undefined) {
      g.valores.potencia_reativa = Math.sqrt(Math.max(0, (P / fp) ** 2 - P ** 2));
    }
    if (g.valores.demanda !== undefined) g.valores.demanda = P * 0.97;
    if (g.valores.corrente_n !== undefined) {
      const { corrente_a: a = 0, corrente_b: b = 0, corrente_c: c = 0 } = g.valores;
      const media = (a + b + c) / 3;
      g.valores.corrente_n = (Math.abs(a - media) + Math.abs(b - media) + Math.abs(c - media)) * 0.9;
    }
    // THD da entrada a partir das harmônicas dos setores (soma aritmética:
    // pior caso, harmônicas todas em fase)
    for (const [f, tagThd] of [['a', 'thd_corrente'], ['b', 'thd_corrente_b'], ['c', 'thd_corrente_c']]) {
      const i = g.valores[`corrente_${f}`];
      if (g.valores[tagThd] === undefined || !i) continue;
      const ih = Math.min(soma(`corrente_harmonica_${f}`), i * 0.99);
      g.valores[tagThd] = (ih / Math.sqrt(i ** 2 - ih ** 2)) * 100;
    }
    preencherHarmonicas(g.valores);
  }

  encerrar() {}
}

/* O modo simulado responde às mesmas chamadas de engenharia do coletor real,
   para que a tela funcione igual em demonstração e em bancada. */
Object.assign(Simulador.prototype, {
  listarBarramentos() { return ['rtu:/dev/ttyUSB0 (simulado)']; },

  diagnostico() {
    return this.lista.map((m, i) => ({
      id: m.id,
      nome: m.nome,
      barramento: 'rtu:/dev/ttyUSB0 (simulado)',
      unit_id: m.conexao?.unit_id ?? i + 1,
      online: true,
      erro: null,
      lido_em: Date.now(),
      blocos: 2,
      requisicoes: 100 + this.t,
      falhas: 0,
      excecoes: 0,
      tempo_medio: 40 + (i % 5) * 7,
      tempo_max: 120 + (i % 3) * 30,
      taxa_falha: 0,
      ultima_falha: null,
    }));
  },

  zerarDiagnostico() {},
  async pausar() {},
  retomar() {},

  /** Mesmo contrato do coletor real: só o equipamento pedido. */
  async lerUm(id) {
    const leitura = await this.lerTodos();
    return leitura[id] ? { [id]: leitura[id] } : {};
  },

  async varrer({ de = 1, ate = 32, tipo = 'rtu', host = '' } = {}) {
    const achados = [];
    for (const m of this.lista) {
      const id = m.conexao?.unit_id;
      // a varredura simulada respeita o meio: quem está na serial não aparece
      // quando se procura na rede, como aconteceria em campo
      const meio = m.conexao?.tipo === 'tcp' ? 'tcp' : 'rtu';
      if (meio !== tipo) continue;
      if (tipo === 'tcp' && host && m.conexao?.host && m.conexao.host !== host) continue;
      if (id >= de && id <= ate) {
        achados.push({ unit_id: id, situacao: 'respondeu', ms: 30 + Math.round(Math.random() * 40), dados: [0, 0] });
      }
    }
    return achados;
  },

  async lerBruto({ unit_id, endereco = 0, quantidade = 8 }) {
    const eq = this.lista.find((m) => m.conexao?.unit_id === unit_id);
    if (!eq) throw new Error(`escravo ${unit_id} não respondeu (simulado)`);
    const leitura = await this.lerTodos();
    const valores = leitura[eq.id].valores;
    // devolve os registradores como o equipamento devolveria, a partir das tags
    const dados = new Array(quantidade).fill(0);
    const desloc = eq.padrao?.deslocamento_endereco ?? 0;   // endereço no fio, como o equipamento real
    for (const tag of eq.tags) {
      if (tag.calculada) continue;
      const i = tag.endereco + desloc - endereco;
      if (i < 0 || i >= quantidade) continue;
      const v = valores[tag.nome];
      if (v === undefined || v === null) continue;
      if (Number.isInteger(tag.bit)) { if (v >= 0.5) dados[i] |= (1 << tag.bit); continue; }
      const escala = tag.escala ?? 1;
      if ((tag.tipo || eq.padrao?.tipo) === 'float32') {
        const b = Buffer.alloc(4);
        b.writeFloatBE(v / escala, 0);
        // na ordem de palavras do equipamento (o 7KT0310 manda a palavra baixa primeiro)
        const cdab = (tag.ordem_palavras || eq.padrao?.ordem_palavras) === 'CDAB';
        dados[i] = b.readUInt16BE(cdab ? 2 : 0);
        if (i + 1 < quantidade) dados[i + 1] = b.readUInt16BE(cdab ? 0 : 2);
      } else {
        dados[i] = Math.round(v / escala) & 0xffff;
      }
    }
    return { dados, ms: 35 };
  },

  /**
   * Em bancada a escrita é aceita e reflete no estado simulado, senão não dá
   * para exercitar comando nenhum sem o equipamento na mesa.
   */
  /**
   * Escrita simulada. O efeito de cada comando é deduzido do próprio
   * `confirma_com` declarado no perfil: se o comando diz que confirma com
   * `disjuntor_ligado = 1`, é isso que o simulador passa a devolver. Assim a
   * bancada exercita o caminho completo sem código específico por equipamento.
   */
  async escreverBruto({ endereco, valor, valores }) {
    // com várias palavras (complemento, dois bits) o simulador faz o papel do
    // CLP: só obedece se o quadro inteiro bater com o declarado no comando
    const enviadas = valores || [valor];
    const cmd = this.lista
      .flatMap((m) => (m.comandos || []))
      .find((c) => c.endereco === endereco
        && JSON.stringify(palavrasDeclaradas(c)) === JSON.stringify(enviadas));

    const efeito = cmd?.confirma_com;
    if (efeito && Object.prototype.hasOwnProperty.call(this.estadoDigital, efeito.tag)) {
      // o painel leva um instante para responder, como no equipamento real
      const alvo = efeito.igual >= 0.5;
      setTimeout(() => {
        this.estadoDigital[efeito.tag] = alvo;
        // religou: o relé rearma e o registro de causa volta a zero
        if (efeito.tag === 'disjuntor_ligado' && alvo) {
          this.protecao.causa = 0;
          this.protecao.permite_religar = true;
        }
      }, 600);
    }
    // o eco que um escravo real devolveria (FC16: endereço e quantidade)
    return valores ? { address: endereco, length: valores.length } : { address: endereco, value: valor };
  },

  conexaoDe(id) {
    return this.lista.some((m) => m.id === id)
      ? { barramento: 'rtu:simulado', unit_id: this.lista.find((m) => m.id === id).conexao?.unit_id || 1 }
      : null;
  },
});

<script>
/* ---- public/assets/nucleo.js ---- */
/* Núcleo do supervisório: estado, formatação, vínculos de dados e conexão.
   Os vínculos são coletados uma vez por tela e reaproveitados a cada
   varredura — nada de varrer o DOM inteiro a 1 Hz. */

const estado = {
  usuario: null,
  config: null,
  dados: { ts: Date.now(), equipamentos: {}, alarmes: [] },
  conectado: false,
  tela: 'energia',
};

const $ = (sel, raiz = document) => raiz.querySelector(sel);
const $$ = (sel, raiz = document) => Array.from(raiz.querySelectorAll(sel));

const SEM_DADO = '––';

function num(v, dec = 1) {
  if (v === null || v === undefined || !Number.isFinite(v)) return SEM_DADO;
  return v.toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

function hora(ts, comSegundos = true) {
  if (!ts) return SEM_DADO;
  return new Date(ts).toLocaleTimeString('pt-BR',
    { hour: '2-digit', minute: '2-digit', ...(comSegundos ? { second: '2-digit' } : {}) });
}

function dataHora(ts) {
  if (!ts) return SEM_DADO;
  return new Date(ts).toLocaleString('pt-BR',
    { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function duracao(ms) {
  if (!Number.isFinite(ms) || ms < 0) return SEM_DADO;
  const min = Math.floor(ms / 60000);
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60);
  return `${h} h ${String(min % 60).padStart(2, '0')} min`;
}

const esc = (t) => String(t ?? '').replace(/[&<>"]/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ------------------------------------------------------------- consultas */

function equipamento(id) {
  return estado.dados.equipamentos[id] || null;
}

function valor(tag) {
  const [id, nome] = String(tag).split('.');
  const eq = estado.dados.equipamentos[id];
  if (!eq || !eq.online) return null;
  const v = eq.valores[nome];
  return v === undefined ? null : v;
}

function defTag(tag) {
  const [id, nome] = String(tag).split('.');
  const eq = estado.config.equipamentos.find((e) => e.id === id);
  return eq?.tags.find((t) => t.nome === nome) || null;
}

function defEquipamento(id) {
  return estado.config.equipamentos.find((e) => e.id === id) || null;
}

/** Regras de alarme que apontam para uma tag, na ordem em que foram configuradas. */
function regrasDe(tag) {
  return (estado.config.limites || []).filter((r) => r.tag === tag);
}

/** Maior limite máximo configurado para uma tag (usado como fundo de escala). */
function limiteMax(tag) {
  const v = regrasDe(tag).map((r) => r.max).filter((x) => x !== undefined);
  return v.length ? Math.max(...v) : null;
}

function tagsEmAlarme() {
  return new Set(estado.dados.alarmes.map((a) => a.tag));
}

/** Carga de um equipamento elétrico: maior fase sobre a corrente do disjuntor. */
function carga(idEquipamento) {
  const eq = equipamento(idEquipamento);
  if (!eq || !eq.online) return { corrente: null, fracao: 0, online: false };
  const fases = ['corrente_a', 'corrente_b', 'corrente_c']
    .map((f) => eq.valores[f])
    .filter((v) => Number.isFinite(v));
  const corrente = fases.length ? Math.max(...fases) : null;
  const limite = limiteMax(`${idEquipamento}.corrente_a`);
  return { corrente, fracao: corrente !== null && limite ? corrente / limite : 0, online: true };
}

function classeCarga(fracao) {
  if (fracao >= 1) return 'critico';
  if (fracao >= 0.8) return 'atencao';
  return '';
}

/* --------------------------------------------------- vínculos de dados
   Cada tela declara os vínculos no HTML com data-*; aqui eles viram uma
   lista fechada, percorrida a cada varredura sem tocar no resto do DOM. */

let vinculos = null;

function coletarVinculos(raiz) {
  vinculos = {
    valores: $$('[data-tag]', raiz).map((el) => ({ el, tag: el.dataset.tag, dec: Number(el.dataset.dec ?? 1) })),
    leituras: $$('[data-leitura]', raiz).map((el) => ({ el, tag: el.dataset.leitura })),
    barras: $$('[data-barra]', raiz).map((el) => ({
      el, tag: el.dataset.barra, escala: Number(el.dataset.escala) || 100,
    })),
    escalas: $$('[data-escala-tag]', raiz).map((el) => ({
      el, tag: el.dataset.escalaTag,
      min: Number(el.dataset.min ?? 0), max: Number(el.dataset.max ?? 100),
      inverso: el.dataset.inverso === 'sim',
    })),
    condutores: $$('[data-cond]', raiz).map((el) => ({ el, id: el.dataset.cond })),
    fluxos: $$('[data-fluxo]', raiz).map((el) => ({ el, id: el.dataset.fluxo })),
    cargasBarra: $$('[data-carga-barra]', raiz).map((el) => ({
      el, id: el.dataset.cargaBarra, total: Number(el.dataset.larguraMax) || 100,
    })),
    cargasTexto: $$('[data-carga-txt]', raiz).map((el) => ({ el, id: el.dataset.cargaTxt })),
    leds: $$('[data-led]', raiz).map((el) => ({ el, id: el.dataset.led })),
    estados: $$('[data-estado]', raiz).map((el) => ({ el, id: el.dataset.estado })),
    digitais: $$('[data-digital]', raiz).map((el) => ({
      el, tag: el.dataset.digital, inverso: el.dataset.inverso === 'sim',
    })),
  };
}

const ehSvg = (el) => el.namespaceURI === 'http://www.w3.org/2000/svg';

function aplicarVinculos() {
  if (!vinculos) return;
  const emAlarme = tagsEmAlarme();

  for (const { el, tag, dec } of vinculos.valores) {
    const v = valor(tag);
    const texto = num(v, dec);
    if (el.textContent !== texto) el.textContent = texto;
    const caixa = el.closest('.valor');
    if (caixa) caixa.classList.toggle('sem-dado', v === null);
    if (ehSvg(el)) el.classList.toggle('alerta', emAlarme.has(tag));
  }

  for (const { el, tag } of vinculos.leituras) el.classList.toggle('anormal', emAlarme.has(tag));

  for (const { el, tag, escala } of vinculos.barras) {
    const v = valor(tag) ?? 0;
    el.style.width = `${Math.min(100, Math.max(0, (v / escala) * 100))}%`;
  }

  for (const { el, tag, min, max } of vinculos.escalas) {
    const v = valor(tag);
    const fr = v === null ? 0 : Math.min(1, Math.max(0, (v - min) / (max - min || 1)));
    el.style.width = `${fr * 100}%`;
    const critico = regrasDe(tag).some((r) => r.prioridade === 'alta'
      && ((r.min !== undefined && v !== null && v < r.min) || (r.max !== undefined && v !== null && v > r.max)));
    const atencao = regrasDe(tag).some((r) => r.prioridade !== 'alta'
      && ((r.min !== undefined && v !== null && v < r.min) || (r.max !== undefined && v !== null && v > r.max)));
    el.classList.toggle('critico', critico);
    el.classList.toggle('atencao', !critico && atencao);
  }

  for (const { el, id } of vinculos.condutores) {
    const { corrente, fracao } = carga(id);
    const viva = corrente !== null && corrente > 0.5;
    el.classList.toggle('energizado', viva);
    el.classList.toggle('atencao-carga', viva && fracao >= 0.8 && fracao < 1);
    el.classList.toggle('sobrecarga', viva && fracao >= 1);
  }

  for (const { el, id } of vinculos.fluxos) {
    const { corrente, fracao } = carga(id);
    const viva = corrente !== null && corrente > 0.5;
    el.style.visibility = viva ? 'visible' : 'hidden';
    el.classList.toggle('atencao-carga', viva && fracao >= 0.8 && fracao < 1);
    el.classList.toggle('sobrecarga', viva && fracao >= 1);
    el.style.animationDuration = `${(2.4 - 1.7 * Math.min(1, fracao)).toFixed(2)}s`;
  }

  for (const { el, id, total } of vinculos.cargasBarra) {
    const { fracao } = carga(id);
    el.setAttribute('width', (Math.min(1, Math.max(0, fracao)) * total).toFixed(1));
    el.style.fill = fracao >= 1 ? 'var(--critico)' : fracao >= 0.8 ? 'var(--atencao)' : 'var(--tinta)';
  }

  for (const { el, id } of vinculos.cargasTexto) {
    const { corrente, fracao, online } = carga(id);
    el.textContent = !online || corrente === null ? SEM_DADO : `${Math.round(fracao * 100)} %`;
    el.setAttribute('class', fracao >= 1 ? 'rot alerta' : 'rot');
  }

  for (const { el, id } of vinculos.leds) {
    const eq = equipamento(id);
    el.style.fill = eq?.online ? 'var(--ok)' : 'var(--critico)';
  }

  for (const { el, id } of vinculos.estados) {
    const eq = equipamento(id);
    const ok = !!eq?.online;
    el.textContent = ok ? 'em serviço' : 'sem comunicação';
    el.classList.toggle('ruim', !ok);
  }

  for (const { el, tag, inverso } of vinculos.digitais) {
    const v = valor(tag);
    const ligado = v !== null && v >= 0.5;
    const anormal = inverso ? !ligado : ligado;
    el.classList.toggle('ativa', v !== null && anormal);
  }
}

const ouvintes = new Set();
const aoAtualizar = (fn) => { ouvintes.add(fn); return () => ouvintes.delete(fn); };
function publicar() { for (const fn of ouvintes) fn(); }

let ws = null;
let tentativa = 0;

function conectar() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => { tentativa = 0; estado.conectado = true; };
  ws.onmessage = (ev) => {
    try {
      estado.dados = JSON.parse(ev.data);
      estado.conectado = true;
      publicar();
    } catch (e) {
      console.error('pacote inválido', e);
    }
  };
  ws.onerror = () => ws.close();
  ws.onclose = (ev) => {
    estado.conectado = false;
    publicar();
    // 4001: o servidor encerrou a sessão (saída, senha trocada, usuário desativado)
    if (ev.code === 4001) { location.href = '/login'; return; }
    tentativa = Math.min(tentativa + 1, 6);
    // o navegador não mostra o 401 do handshake; a partir da segunda falha
    // seguida pergunta à API, que leva ao login se a sessão tiver acabado
    if (tentativa >= 2) api('/api/eu').catch(() => {});
    setTimeout(conectar, 1000 * tentativa);   // espera crescente, até 6 s
  };
}

const PAPEIS = { operador: 1, tecnico: 2, admin: 3 };

/** O usuário atual alcança este papel? */
function pode(minimo) {
  return (PAPEIS[estado.usuario?.papel] || 0) >= (PAPEIS[minimo] || 99);
}

/**
 * Toda chamada à API passa por aqui. O cabeçalho X-Painel é posto
 * automaticamente: o servidor recusa POST sem ele (é o que barra formulário
 * enviado de outro site), e depender de cada tela lembrar disso já custou um
 * botão de reconhecer alarme que não funcionava.
 */
async function api(rota, opcoes = {}) {
  const r = await fetch(rota, {
    credentials: 'same-origin',
    ...opcoes,
    headers: {
      'X-Painel': '1',
      ...(opcoes.body ? { 'Content-Type': 'application/json' } : {}),
      ...(opcoes.headers || {}),
    },
  });
  if (r.status === 428) { location.href = '/login'; throw new Error('troca de senha obrigatória'); }
  const dados = await r.json().catch(() => ({}));
  // 401 normalmente é sessão perdida e leva ao login. A exceção é a senha pedida
  // no momento de acionar um comando: ali a sessão continua boa e o operador
  // precisa continuar na tela, só com o aviso de senha incorreta.
  if (r.status === 401 && dados.sessao !== 'valida') {
    location.href = '/login';
    throw new Error(dados.erro || 'sessão expirada');
  }
  if (!r.ok) {
    const e = new Error(dados.erro || (dados.erros || []).join(' · ') || `${rota}: ${r.status}`);
    e.dados = dados;          // validação devolve { erros, avisos }
    e.status = r.status;
    throw e;
  }
  return dados;
}

const MODO_DEMO = window.DEMO_EMBUTIDO === true
  || new URLSearchParams(location.search).has('demo');

/** Série sintética para o modo demonstração, com perfil de dia comercial. */
function serieSimulada(tag, horas) {
  const base = valor(tag) ?? 50;
  const ate = Date.now();
  const n = 200;
  const passo = (horas * 3600000) / n;
  return Array.from({ length: n }, (_, i) => {
    const t = ate - (n - i) * passo;
    const h = new Date(t).getHours();
    const jornada = h >= 7 && h <= 21 ? 1 : 0.45;
    const med = base * jornada * (1 + 0.06 * Math.sin(i / 8) + (Math.random() - 0.5) * 0.03);
    const disp = Math.abs(med) * 0.05;
    return { t, med, min: med - disp, max: med + disp };
  });
}

async function serie(tag, horas) {
  if (MODO_DEMO) return serieSimulada(tag, horas);
  try {
    const r = await api(`/api/historico?tag=${encodeURIComponent(tag)}&horas=${horas}`);
    return r.pontos;
  } catch {
    return [];
  }
}

/* ---- public/assets/grafico.js ---- */
/* Gráfico de tendência em canvas puro — sem CDN, porque a rede da
   instalação costuma ser isolada. As cores vêm das variáveis do tema
   (claro ou escuro), lidas a cada desenho: trocar o tema redesenha certo. */

const lerVar = (nome, padrao) => {
  try {
    return getComputedStyle(document.documentElement).getPropertyValue(nome).trim() || padrao;
  } catch {
    return padrao;
  }
};

function coresDoTema() {
  return {
    linha: lerVar('--tinta', '#0c2340'),
    banda: lerVar('--banda-grafico', 'rgba(12, 35, 64, .12)'),
    grade: lerVar('--linha', '#e3e8ee'),
    texto: lerVar('--tinta-3', '#7f8a9d'),
    fundo: lerVar('--tela', '#ffffff'),
    critico: lerVar('--critico', '#c62f35'),
    atencao: lerVar('--atencao', '#d99000'),
    atencaoTexto: lerVar('--atencao-texto', '#8a5c00'),
  };
}

function desenharTendencia(canvas, pontos, { unidade = '', marcas = [] } = {}) {
  const CORES = coresDoTema();
  const dpr = window.devicePixelRatio || 1;
  const larg = canvas.clientWidth;
  const alt = canvas.clientHeight;
  if (!larg || !alt) return;
  canvas.width = Math.round(larg * dpr);
  canvas.height = Math.round(alt * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = CORES.fundo;
  ctx.fillRect(0, 0, larg, alt);

  const m = { e: 56, d: 14, c: 12, b: 24 };
  const w = larg - m.e - m.d;
  const h = alt - m.c - m.b;

  if (!pontos || pontos.length < 2) {
    ctx.fillStyle = CORES.texto;
    ctx.font = '13px Manrope, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Sem registro no período.', larg / 2, alt / 2 - 8);
    ctx.fillText('O histórico começa a gravar assim que o servidor lê o equipamento.', larg / 2, alt / 2 + 12);
    return;
  }

  const t0 = pontos[0].t;
  const t1 = pontos[pontos.length - 1].t;
  let vMin = Math.min(...pontos.map((p) => p.min), ...marcas.map((x) => x.valor));
  let vMax = Math.max(...pontos.map((p) => p.max), ...marcas.map((x) => x.valor));
  if (!Number.isFinite(vMin) || !Number.isFinite(vMax)) return;
  if (vMax - vMin < 1e-6) { vMax += 1; vMin -= 1; }
  const folga = (vMax - vMin) * 0.1;
  vMin -= folga; vMax += folga;

  const px = (t) => m.e + ((t - t0) / (t1 - t0 || 1)) * w;
  const py = (v) => m.c + h - ((v - vMin) / (vMax - vMin)) * h;

  ctx.font = '11px ui-monospace, monospace';
  ctx.strokeStyle = CORES.grade;
  ctx.fillStyle = CORES.texto;
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const v = vMin + ((vMax - vMin) * i) / 4;
    const y = Math.round(py(v)) + 0.5;
    ctx.beginPath(); ctx.moveTo(m.e, y); ctx.lineTo(m.e + w, y); ctx.stroke();
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(escala(v), m.e - 8, y);
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const varreDias = (t1 - t0) > 86400000;
  for (let i = 0; i <= 4; i++) {
    const t = t0 + ((t1 - t0) * i) / 4;
    const d = new Date(t);
    const rot = varreDias
      ? d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })
      : d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    ctx.fillText(rot, Math.min(Math.max(px(t), m.e + 16), m.e + w - 16), m.c + h + 7);
  }

  // linhas de limite configuradas (alarme)
  for (const marca of marcas) {
    const y = Math.round(py(marca.valor)) + 0.5;
    if (y < m.c || y > m.c + h) continue;
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = marca.prioridade === 'alta' ? CORES.critico : CORES.atencao;
    ctx.beginPath(); ctx.moveTo(m.e, y); ctx.lineTo(m.e + w, y); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = marca.prioridade === 'alta' ? CORES.critico : CORES.atencaoTexto;
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText(marca.rotulo, m.e + 4, y - 2);
  }

  // faixa mínimo–máximo do período agregado
  ctx.beginPath();
  pontos.forEach((p, i) => (i ? ctx.lineTo(px(p.t), py(p.max)) : ctx.moveTo(px(p.t), py(p.max))));
  for (let i = pontos.length - 1; i >= 0; i--) ctx.lineTo(px(pontos[i].t), py(pontos[i].min));
  ctx.closePath();
  ctx.fillStyle = CORES.banda;
  ctx.fill();

  ctx.beginPath();
  pontos.forEach((p, i) => (i ? ctx.lineTo(px(p.t), py(p.med)) : ctx.moveTo(px(p.t), py(p.med))));
  ctx.strokeStyle = CORES.linha;
  ctx.lineWidth = 1.6;
  ctx.lineJoin = 'round';
  ctx.stroke();

  const ultimo = pontos[pontos.length - 1];
  ctx.beginPath();
  ctx.arc(px(ultimo.t), py(ultimo.med), 3, 0, Math.PI * 2);
  ctx.fillStyle = CORES.linha;
  ctx.fill();

  const texto = `${escala(ultimo.med)} ${unidade}`.trim();
  ctx.font = '600 12px ui-monospace, monospace';
  const lt = ctx.measureText(texto).width;
  const bx = Math.min(px(ultimo.t) + 8, m.e + w - lt - 10);
  const by = Math.min(Math.max(py(ultimo.med) - 20, m.c), m.c + h - 20);
  ctx.fillStyle = CORES.linha;
  ctx.fillRect(bx, by, lt + 10, 18);
  ctx.fillStyle = CORES.fundo;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(texto, bx + 5, by + 9);
}

/* Cores das séries na comparação do Histórico. Ordem fixa e validada para
   daltonismo sobre o fundo #e8eae5 (pior par vizinho ΔE 9,1). Laranja,
   verde-água, amarelo e rosa ficam abaixo de 3:1 no fundo claro: por isso cada
   série tem legenda com o nome e, até 4 séries, o valor escrito na ponta. */
const PALETA_SERIES = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#4a3aa7', '#e34948'];

/**
 * Várias séries com a MESMA unidade num eixo só (quem tem unidade diferente vai
 * para outro painel — nunca dois eixos verticais no mesmo gráfico).
 *   series: [{ pontos, cor, rotulo, unidade }]   pontos = [{ t, min, med, max }]
 *   t0, t1: o mesmo intervalo em todos os painéis, para os tempos se alinharem
 * Devolve a geometria, para a tela converter a posição do mouse em instante.
 */
function desenharComparacao(canvas, series, { t0, t1, marcas = [], unidade = '' } = {}) {
  const CORES = coresDoTema();
  const dpr = window.devicePixelRatio || 1;
  const larg = canvas.clientWidth;
  const alt = canvas.clientHeight;
  if (!larg || !alt) return null;
  canvas.width = Math.round(larg * dpr);
  canvas.height = Math.round(alt * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = CORES.fundo;
  ctx.fillRect(0, 0, larg, alt);

  const rotularPonta = series.length <= 4;
  const m = { e: 56, d: rotularPonta ? 92 : 14, c: 12, b: 24 };
  const w = larg - m.e - m.d;
  const h = alt - m.c - m.b;
  const comDados = series.filter((s) => s.pontos && s.pontos.length >= 2);
  if (!comDados.length || !(t1 > t0)) {
    ctx.fillStyle = CORES.texto;
    ctx.font = '13px Manrope, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Sem registro no período.', larg / 2, alt / 2);
    return null;
  }

  const sozinha = comDados.length === 1;
  const valores = comDados.flatMap((s) => s.pontos.flatMap((p) => (sozinha ? [p.min, p.max] : [p.med])));
  let vMin = Math.min(...valores, ...(sozinha ? marcas.map((x) => x.valor) : []));
  let vMax = Math.max(...valores, ...(sozinha ? marcas.map((x) => x.valor) : []));
  if (!Number.isFinite(vMin) || !Number.isFinite(vMax)) return null;
  if (vMax - vMin < 1e-6) { vMax += 1; vMin -= 1; }
  const folga = (vMax - vMin) * 0.1;
  // grandeza que nunca fica negativa (corrente, tensão) não ganha eixo abaixo de zero
  const semNegativo = vMin >= 0;
  vMin -= folga; vMax += folga;
  if (semNegativo && vMin < 0) vMin = 0;
  const px = (t) => m.e + ((t - t0) / (t1 - t0)) * w;
  const py = (v) => m.c + h - ((v - vMin) / (vMax - vMin)) * h;

  ctx.font = '11px ui-monospace, monospace';
  ctx.strokeStyle = CORES.grade;
  ctx.fillStyle = CORES.texto;
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const v = vMin + ((vMax - vMin) * i) / 4;
    const y = Math.round(py(v)) + 0.5;
    ctx.beginPath(); ctx.moveTo(m.e, y); ctx.lineTo(m.e + w, y); ctx.stroke();
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(escala(v), m.e - 8, y);
  }
  if (unidade) {
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(unidade, 4, 2);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const varreDias = (t1 - t0) > 86400000;
  for (let i = 0; i <= 4; i++) {
    const t = t0 + ((t1 - t0) * i) / 4;
    const d = new Date(t);
    const rot = varreDias
      ? d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })
      : d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    ctx.fillText(rot, Math.min(Math.max(px(t), m.e + 16), m.e + w - 16), m.c + h + 7);
  }

  // limites de alarme só com uma série: com várias, não se sabe de qual é a linha
  if (sozinha) {
    for (const marca of marcas) {
      const y = Math.round(py(marca.valor)) + 0.5;
      if (y < m.c || y > m.c + h) continue;
      ctx.save();
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = marca.prioridade === 'alta' ? CORES.critico : CORES.atencao;
      ctx.beginPath(); ctx.moveTo(m.e, y); ctx.lineTo(m.e + w, y); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = marca.prioridade === 'alta' ? CORES.critico : CORES.atencaoTexto;
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText(marca.rotulo, m.e + 4, y - 2);
    }
    // faixa mínimo–máximo, como na tendência de uma grandeza só
    const p = comDados[0].pontos;
    ctx.beginPath();
    p.forEach((q, i) => (i ? ctx.lineTo(px(q.t), py(q.max)) : ctx.moveTo(px(q.t), py(q.max))));
    for (let i = p.length - 1; i >= 0; i--) ctx.lineTo(px(p[i].t), py(p[i].min));
    ctx.closePath();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = comDados[0].cor;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  for (const s of comDados) {
    ctx.beginPath();
    s.pontos.forEach((q, i) => (i ? ctx.lineTo(px(q.t), py(q.med)) : ctx.moveTo(px(q.t), py(q.med))));
    ctx.strokeStyle = s.cor;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  // valor na ponta de cada linha (até 4), empurrando os rótulos para não encavalar
  if (rotularPonta) {
    const pontas = comDados.map((s) => {
      const u = s.pontos[s.pontos.length - 1];
      return { s, x: px(u.t), yLinha: py(u.med), y: py(u.med), texto: escala(u.med) };
    }).sort((a, b) => a.y - b.y);
    for (let i = 1; i < pontas.length; i++) pontas[i].y = Math.max(pontas[i].y, pontas[i - 1].y + 15);
    const excesso = pontas.length ? pontas[pontas.length - 1].y - (m.c + h) : 0;
    if (excesso > 0) for (const p of pontas) p.y -= excesso;
    ctx.font = '600 12px ui-monospace, monospace';
    ctx.textBaseline = 'middle';
    for (const p of pontas) {
      ctx.fillStyle = p.s.cor;
      ctx.beginPath(); ctx.arc(p.x, p.yLinha, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(m.e + w + 6, p.y - 1, 8, 2);
      ctx.fillStyle = CORES.linha;          // texto em tinta, não na cor da série
      ctx.textAlign = 'left';
      ctx.fillText(p.texto, m.e + w + 18, p.y);
    }
  }
  return { t0, t1, esquerda: m.e, largura: w };
}

function escala(v) {
  const abs = Math.abs(v);
  const casas = abs >= 1000 ? 0 : abs >= 100 ? 1 : abs >= 1 ? 2 : 3;
  return v.toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas });
}

/**
 * Estado vazio. Uma tela sem equipamento não some nem mostra caixas em branco:
 * ela diz o que falta e onde fazer. É o que o instalador vê antes de cadastrar
 * o primeiro medidor.
 */
function estadoVazio({ isa = '', titulo, mensagem, passos = [] }) {
  return `
    <section class="bloco">
      ${placa(isa, titulo)}
      <div class="corpo">
        <div class="vazio-guia">
          <p class="vazio-texto">${esc(mensagem)}</p>

}
